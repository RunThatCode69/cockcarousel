<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cum of Duty: Modern Wharfare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #2a1030; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  // ================================================================
  //  CUM OF DUTY: MODERN WHARFARE — a Cock Carousel joint
  //  Canvas 2D raycaster. No libraries, no assets, no shame.
  // ================================================================
  const W = 960, H = 540;
  const cv = document.getElementById('c');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx;                        // drawing helpers target this; swapped when baking sprites
  let scale = 1, dpr = 1, portrait = false;
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2);   // phones: 1.5x is plenty for a cartoon and keeps the fill rate honest
    portrait = innerHeight > innerWidth * 1.1;
    scale = portrait ? Math.min(innerHeight / W, innerWidth / H) : Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.style.transform = portrait ? 'rotate(90deg)' : '';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  }
  addEventListener('resize', resize);
  resize();

  const FONT = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
  const INK = '#4a1d3a';
  const SKIN = '#f9c3ad', SKIN2 = '#f3a48c', HEAD = '#f47fa2', HEAD2 = '#e85f8b';
  const PINK = '#ff5d8f', YEL = '#ffd23f', PURP = '#7a3fb5', CYAN = '#7ed6df', CUM = '#f7f4ec', CUM2 = '#e6e0d2';
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, k) => a + (b - a) * k;
  const TAU = Math.PI * 2;
  const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
  const pickOne = a => a[Math.floor(Math.random() * a.length)];
  let t = 0;                                 // global frame counter (always ticks, even in slow-mo)

  // ---------- Drawing helpers (same as Slide Rush) ----------
  function E(x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, TAU); }
  function fs(fill, stroke = INK, lw = 2.5) { ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
  function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s);
    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.2, x - s * 0.6, y - s * 1.2, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.4, y - s * 0.2, x, y + s);
    ctx.closePath();
  }
  function txt(s, x, y, size, fill = '#fff', align = 'center', stroke = INK) {
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = fill; ctx.fillText(s, x, y);
  }
  // word-wrapped text, returns the number of lines drawn
  function txtWrap(s, x, y, size, maxW, fill = '#fff', align = 'left', stroke = null, lh = 1.25) {
    ctx.font = `${size}px ${FONT}`;
    const words = s.split(' '); let line = '', n = 0;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { txt(line, x, y + n * size * lh, size, fill, align, stroke); line = w; n++; }
      else line = test;
    }
    if (line) { txt(line, x, y + n * size * lh, size, fill, align, stroke); n++; }
    return n;
  }
  function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  // run a painter against an offscreen canvas and hand the canvas back
  function bake(w, h, fn) { const c = mkCanvas(w, h); const old = ctx; ctx = c.getContext('2d'); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; fn(ctx, w, h); ctx = old; return c; }

  // ---------- Sound: Web Audio only, but with a proper mix bus, noise, music and ambience ----------
  // iOS notes: (1) audioSession must be set BEFORE the context exists; (2) on older iOS the ringer switch mutes Web Audio
  // unless an HTML <audio> element is playing, so we loop a silent WAV through one on the first touch; (3) a silent buffer unlocks the context.
  let actx = null, muted = false, unlocked = false, master = null, sfxBus = null, musBus = null, ambBus = null, noiseBuf = null, silentEl = null;
  try { muted = localStorage.getItem('mw_muted') === '1'; } catch (e) {}
  function silentWavURL() {
    const n = 4410, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  }
  function audio() {
    if (!actx) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      if (actx) {
        const comp = actx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(actx.destination);
        master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(comp);
        sfxBus = actx.createGain(); sfxBus.gain.value = 1.4; sfxBus.connect(master);
        musBus = actx.createGain(); musBus.gain.value = 0.55; musBus.connect(master);
        ambBus = actx.createGain(); ambBus.gain.value = 0.7; ambBus.connect(master);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
    }
    if (!silentEl) { try { silentEl = new Audio(silentWavURL()); silentEl.loop = true; silentEl.setAttribute('playsinline', ''); silentEl.volume = 0.01; const p = silentEl.play(); if (p && p.catch) p.catch(() => { silentEl = null; }); } catch (e) { silentEl = null; } }
    if (actx && actx.state !== 'running') { try { actx.resume(); } catch (e) {} }
    if (actx && !unlocked) {
      try { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); unlocked = true; } catch (e) {}
    }
    return actx;
  }
  ['touchend', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(ev => addEventListener(ev, audio, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!actx) return; if (document.hidden) actx.suspend(); else actx.resume(); });
  function setMuted(m) { muted = m; try { localStorage.setItem('mw_muted', m ? '1' : '0'); } catch (e) {} if (master) master.gain.setTargetAtTime(m ? 0 : 1, actx.currentTime, 0.05); }
  const live = () => actx && actx.state === 'running';
  // absolute-time oscillator note on a bus
  function note(f1, f2, at, d, type, vol, bus, attack = 0.005) {
    const a = actx; if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.connect(g); g.connect(bus || sfxBus);
    o.frequency.setValueAtTime(f1, at); if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), at + d);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + attack); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
    o.start(at); o.stop(at + d + 0.03);
  }
  function tone(f1, f2, d, type, vol, when) { const a = audio(); if (!a || !live()) return; note(f1, f2, a.currentTime + (when || 0), d, type, vol); }
  // filtered white noise: the thing that makes guns and explosions sound like guns and explosions
  function hiss(d, vol, when = 0, ftype = 'lowpass', f1 = 2000, f2 = 300, q = 0.8, bus) {
    const a = audio(); if (!a || !live()) return;
    const at = a.currentTime + when, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; s.playbackRate.value = rand(0.8, 1.2); f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f1, at); f.frequency.exponentialRampToValueAtTime(Math.max(20, f2), at + d);
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
    s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(at, rand(0, 1.5)); s.stop(at + d + 0.05);
  }
  function noise(d, vol, when, f = 800) { hiss(d, vol, when || 0, 'bandpass', f * 1.5, f * 0.4, 1.2); }
  function sfx(n) {
    switch (n) {
      case 'shoot': hiss(0.16, 0.5, 0, 'lowpass', 5000, 400); tone(160, 45, 0.18, 'sine', 0.5); tone(700, 200, 0.07, 'square', 0.05); hiss(0.08, 0.15, 0.03, 'highpass', 3000, 6000, 0.5); break;   // crack + thump + a wet tail
      case 'pump': tone(150, 520, 0.16, 'sine', 0.2); tone(520, 120, 0.3, 'sine', 0.18, 0.17); hiss(0.05, 0.2, 0.3, 'highpass', 3000, 5000); break;
      case 'click': hiss(0.03, 0.3, 0, 'highpass', 4000, 6000, 2); tone(2400, 1800, 0.03, 'square', 0.05); break;
      case 'magout': hiss(0.05, 0.3, 0, 'bandpass', 2500, 1200, 3); tone(300, 90, 0.12, 'square', 0.06); tone(90, 40, 0.2, 'sine', 0.2, 0.05); break;
      case 'thud': tone(110, 40, 0.18, 'sine', 0.35); hiss(0.08, 0.15, 0, 'lowpass', 600, 200); break;
      case 'magin': tone(200, 700, 0.12, 'sine', 0.2); hiss(0.04, 0.35, 0.12, 'bandpass', 3000, 2000, 4); tone(1500, 900, 0.04, 'square', 0.06, 0.12); break;
      case 'butt': tone(120, 40, 0.2, 'sine', 0.5); hiss(0.12, 0.3, 0, 'lowpass', 1200, 200); tone(400, 90, 0.1, 'square', 0.06); break;
      case 'hit': hiss(0.06, 0.25, 0, 'bandpass', 1800, 900, 2); tone(300, 120, 0.1, 'triangle', 0.12); break;
      case 'hitmark': tone(2600, 2600, 0.035, 'square', 0.05); break;
      case 'splat': hiss(0.12, 0.25, 0, 'lowpass', 1400, 200); tone(rand(220, 340), 60, 0.14, 'sine', 0.15); break;
      case 'kill': tone(500, 1000, 0.12, 'square', 0.06); tone(1000, 250, 0.25, 'sine', 0.1, 0.1); break;
      case 'hurt': tone(240, 70, 0.3, 'sawtooth', 0.1); hiss(0.2, 0.2, 0, 'lowpass', 900, 150); break;
      case 'loot': tone(880, 1400, 0.1, 'triangle', 0.14); tone(1400, 1800, 0.1, 'triangle', 0.12, 0.1); break;
      case 'streak': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, 0.18, 'square', 0.07, i * 0.08)); break;
      case 'bee': tone(rand(300, 360), rand(280, 340), 0.25, 'sawtooth', 0.04); break;
      case 'sting': tone(1500, 700, 0.08, 'square', 0.06); hiss(0.05, 0.15, 0, 'highpass', 4000, 6000); break;
      case 'snap': hiss(0.05, 0.4, 0, 'highpass', 3000, 5000, 1); tone(300, 60, 0.3, 'sawtooth', 0.08, 0.05); break;
      case 'wrap': tone(200, 900, 0.35, 'sine', 0.14); tone(900, 200, 0.35, 'sine', 0.1, 0.35); break;
      case 'sizzle': hiss(0.5, 0.25, 0, 'highpass', 3000, 5000, 0.7); break;
      case 'shiver': for (let i = 0; i < 6; i++) tone(700 + i * 40, 650, 0.05, 'square', 0.04, i * 0.06); break;
      case 'boom': hiss(1.4, 0.9, 0, 'lowpass', 3000, 60, 0.7); tone(90, 25, 1.2, 'sine', 0.8); tone(60, 30, 0.8, 'sawtooth', 0.12); break;
      case 'nade': hiss(0.9, 0.8, 0, 'lowpass', 4000, 80, 0.7); tone(110, 30, 0.8, 'sine', 0.7); break;
      case 'pin': tone(2200, 1800, 0.04, 'square', 0.06); hiss(0.04, 0.2, 0.05, 'highpass', 5000, 7000); break;
      case 'bounce': tone(420, 300, 0.05, 'sine', 0.15); break;
      case 'chop': hiss(0.09, 0.35, 0, 'lowpass', 500, 120, 1); tone(70, 55, 0.1, 'sine', 0.2); break;
      case 'step': hiss(0.06, 0.12, 0, 'lowpass', 900, 200, 1); break;
      case 'tick': tone(1800, 1400, 0.02, 'square', 0.03); hiss(0.1, 0.05, 0.02, 'bandpass', 2000, 2500, 2); break;
      case 'drop': tone(900, 200, 0.5, 'sine', 0.1); hiss(0.4, 0.4, 0.5, 'lowpass', 1200, 80); break;
      case 'ultra': for (let i = 0; i < 4; i++) tone(1200, 1800, 0.1, 'sine', 0.07, i * 0.15); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.02, 0.28, 'triangle', 0.14, i * 0.13)); tone(200, 60, 0.6, 'sine', 0.2, 0.55); break;
      case 'die': tone(400, 50, 1.4, 'sawtooth', 0.12); tone(200, 30, 1.4, 'sine', 0.15); break;
      case 'slide': hiss(0.6, 0.3, 0, 'bandpass', 800, 300, 1); break;
      case 'boss': tone(70, 40, 0.6, 'sawtooth', 0.15); tone(140, 80, 0.6, 'square', 0.06); hiss(0.4, 0.2, 0, 'lowpass', 400, 80); break;
      case 'type': tone(2000, 1500, 0.015, 'square', 0.03); break;
      case 'select': tone(700, 1100, 0.08, 'square', 0.08); break;
      case 'slowmo': tone(800, 80, 1.5, 'sine', 0.15); hiss(1.5, 0.2, 0, 'lowpass', 2000, 100); break;
      case 'ads': hiss(0.08, 0.15, 0, 'bandpass', 1500, 900, 2); break;
      case 'xp': tone(1320, 1320, 0.05, 'triangle', 0.06); tone(1760, 1760, 0.08, 'triangle', 0.06, 0.05); break;
    }
  }

  // ---------- music: a tiny look-ahead sequencer. Each song is a function(step, time). ----------
  let music = null;
  function playMusic(name) { if (music && music.name === name) return; music = name ? { name, step: 0, next: 0 } : null; }
  const MN = n => 440 * Math.pow(2, (n - 69) / 12);   // midi → Hz
  const kick = at => { note(130, 40, at, 0.22, 'sine', 0.55, musBus); };
  const snare = (at, v = 0.3) => { const a = actx, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 1200; g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.14); s.connect(f); f.connect(g); g.connect(musBus); s.start(at, Math.random()); s.stop(at + 0.16); };
  const hat = (at, v = 0.08) => { const a = actx, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.04); s.connect(f); f.connect(g); g.connect(musBus); s.start(at, Math.random()); s.stop(at + 0.06); };
  const pad = (notes, at, d, v = 0.05) => { for (const m of notes) { note(MN(m), MN(m), at, d, 'sawtooth', v, musBus, d * 0.3); note(MN(m) * 1.004, MN(m) * 1.004, at, d, 'triangle', v, musBus, d * 0.3); } };
  const SONGS = {
    // menu / briefing: a big dumb heroic march in D minor. Drums, strings, brass stabs.
    title: { dt: 0.2, fn(s, at) {
      const bar = (s >> 4) % 4, st = s % 16, ch = [[50, 53, 57], [46, 50, 53], [53, 57, 60], [48, 52, 55]][bar];
      if (st % 8 === 0) kick(at); if (st === 4 || st === 12) snare(at); if (bar === 3 && st >= 12) snare(at, 0.18);
      if (st === 0) { pad(ch.map(n => n + 12), at, 3.1, 0.035); note(MN(ch[0] - 12), MN(ch[0] - 12), at, 3.1, 'sawtooth', 0.09, musBus, 0.05); }
      if (st === 0 || st === 3 || st === 6) { note(MN(ch[2] + 12), MN(ch[2] + 12), at, 0.28, 'square', 0.05, musBus, 0.01); note(MN(ch[0] + 12), MN(ch[0] + 12), at, 0.28, 'triangle', 0.08, musBus, 0.01); }
      hat(at, st % 2 ? 0.03 : 0.06);
    } },
    // combat bed: low pulse + drone, tense but quiet so the gun is the star
    tense: { dt: 0.16, fn(s, at) {
      const st = s % 16, root = [38, 38, 41, 36][(s >> 4) % 4];
      if (st % 2 === 0) note(MN(root), MN(root), at, 0.14, 'sawtooth', 0.05, musBus, 0.005);
      if (st === 0) { kick(at); pad([root + 12, root + 15, root + 19], at, 2.5, 0.018); }
      if (st === 8) kick(at); if (st % 4 === 2) hat(at, 0.04);
    } },
    // the stealth level: night drone + crickets
    night: { dt: 0.25, fn(s, at) {
      const st = s % 16;
      if (st === 0) pad([38, 45, 50], at, 4.2, 0.02);
      if (Math.random() < 0.35) { const f = rand(4200, 5200); for (let i = 0; i < 3; i++) note(f, f, at + i * 0.045, 0.03, 'sine', 0.02, musBus); }
    } },
    // the clinic: elevator muzak. bossa-ish, soft, relentlessly calm
    muzak: { dt: 0.18, fn(s, at) {
      const bar = (s >> 4) % 4, st = s % 16, ch = [[60, 64, 67, 71], [57, 60, 64, 67], [62, 65, 69, 72], [55, 59, 62, 65]][bar];
      if (st === 0 || st === 6 || st === 10) for (const m of ch) note(MN(m), MN(m), at, 0.5, 'sine', 0.035, musBus, 0.01);
      if (st === 0 || st === 7) note(MN(ch[0] - 24), MN(ch[0] - 24), at, 0.4, 'sine', 0.14, musBus);
      if (st === 10) note(MN(ch[2] - 24), MN(ch[2] - 24), at, 0.3, 'sine', 0.1, musBus);
      if (st % 2 === 0) hat(at, 0.025); if (st === 4 || st === 12) note(MN(ch[3] + 12), MN(ch[3] + 12), at, 0.6, 'triangle', 0.03, musBus, 0.02);
    } },
    // the bridge: faster, drums forward
    chase: { dt: 0.13, fn(s, at) {
      const st = s % 16, root = [38, 36, 34, 36][(s >> 4) % 4];
      if (st % 4 === 0) kick(at); if (st === 4 || st === 12) snare(at, 0.25); hat(at, st % 2 ? 0.03 : 0.06);
      if (st % 2 === 0) note(MN(root), MN(root), at, 0.12, 'sawtooth', 0.07, musBus);
      if (st === 0) pad([root + 24, root + 27, root + 31], at, 2, 0.02);
    } },
  };
  // continuous ambience per level: looping noise through a filter with a slow wobble
  let amb = null;
  function setAmbience(kind) {
    if (!actx) return;
    if (amb) { try { amb.g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.3); const old = amb; setTimeout(() => { try { old.s.stop(); old.l && old.l.stop(); } catch (e) {} }, 1500); } catch (e) {} amb = null; }
    if (!kind) return;
    const cfg = { wind: ['bandpass', 500, 0.6, 0.12], sea: ['lowpass', 380, 0.7, 0.22], room: ['lowpass', 220, 0.5, 0.06], fire: ['highpass', 2500, 0.5, 0.05] }[kind];
    const a = actx, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), l = a.createOscillator(), lg = a.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = cfg[0]; f.frequency.value = cfg[1]; f.Q.value = cfg[2];
    l.frequency.value = 0.13; lg.gain.value = cfg[1] * 0.5; l.connect(lg); lg.connect(f.frequency);
    g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.setTargetAtTime(cfg[3], a.currentTime, 0.8);

  function audioTick() {

  }

        { obj: 'THE SHIP IS SINKING. Get back to the helipad!', at: [22.5, 17, Math.PI], pre() { for (const e of ents) if (e.kind === 'pickup' && e.type === 'crate') e.got = true; }, start() { M.goal = { x: 3.5, y: 3.5 }; M.timer = 60 * 75; M.timerLabel = 'SINKING'; M.onTimeout = () => die('timer'); shake = 16; flash = 0.5; sfx('boom'); say('PRICK', 'That\'s a bomb. Ship\'s going down. Move it, move it, MOVE IT!', 240);
            spawnWave([['crab', 26.5, 16], ['crab', 24, 20.5], ['crab', 12, 20.5], ['crab', 9, 18], ['crab', 9, 8], ['crab', 8.5, 4]]); for (const e of ents) if (e.kind === 'enemy') { e.ai = 'chase'; e.sightMul = 3; } },
          tick() { roll = lerp(roll, -0.16 * (1 - M.timer / (60 * 75)), 0.02); },
          done: () => near(3.5, 3.5, 2.2), end() { M.timer = null; say('PRICK', 'Bird\'s overhead! JUMP FOR IT!', 200); } },
        { obj: 'JUMP', checkpoint: false, start() { M.state = 'cut'; player.canMove = false; player.canFire = false; player.a = -Math.PI / 2; player.x = 3.5; player.y = 4.2; M.flags.jumpT = t; sfx('chop'); },
          tick() { const f = t - M.flags.jumpT; if (f % 8 === 0) sfx('chop'); if (f > 40) { player.y -= 0.03; camH = Math.min(0.95, camH + 0.012); pitch = lerp(pitch, -120, 0.04); } if (f === 100) { shake = 18; announce('GRABBED', 'by the balls. as is tradition.', 44); } if (f > 110) flash = Math.min(1.2, flash + 0.06); },
          done: () => t - M.flags.jumpT > 150 },
      ],
    };
  };

  // ---------- 4. NO RUSHIN' ----------
  const M4 = () => {
    const g = grid(34, 24);
    carve(g, 1, 12, 14, 22);                                                   // waiting room
    [3, 5, 7, 9, 11].forEach(x => { put(g, x, 14, 'h'); put(g, x, 17, 'h'); });
    put(g, 1, 12, 'q'); put(g, 14, 12, 'q'); put(g, 1, 22, 'q');
    carve(g, 16, 16, 22, 22); put(g, 15, 19, '.');                             // reception
    carve(g, 16, 17, 20, 17, 'A');                                             // the counter (velvet)
    carve(g, 24, 2, 25, 22); put(g, 23, 19, '.');                              // escalator shaft
    carve(g, 24, 5, 25, 20, '^');
    carve(g, 4, 1, 32, 3); put(g, 3, 2, 'G');                                  // upstairs hallway, Room 69 gate
    carve(g, 8, 2, 20, 2, '>');                                                // the walkway, going the wrong way
    carve(g, 1, 1, 2, 3);                                                      // Room 69
    put(g, 30, 1, 'e'); put(g, 12, 21, 'e'); put(g, 2, 13, 'e');
    put(g, 0, 17, 'P'); put(g, 33, 2, 'P');
    let wave = 0, serving = 4;
    const SPAWNS = [[2, 13], [13, 13], [7, 21.5], [13, 21.5]];
    const waves = [[['condom', 0], ['condom', 1], ['bee', 2]], [['condom', 0], ['condom', 3], ['bee', 1], ['bee', 2]], [['condom', 1], ['condom', 2], ['condom', 3], ['bee', 0], ['bee', 3]]];
    const nextWave = () => { const w = waves[wave]; if (!w) return; spawnWave(w.map(([ty, s]) => [ty, SPAWNS[s][0], SPAWNS[s][1]])); for (const e of ents) if (e.kind === 'enemy') { e.ai = 'chase'; e.sightMul = 3; } wave++; serving++; bakeBoard(serving); announce(`NOW SERVING: ${serving}`, 'your number is 69. nobody is rushing.', 40); };
    return {
      map: g, tex: { '#': 'tile', A: 'velvet', G: 'door', P: 'poster' }, variants: { '#': ['clinicposter', 6] }, floor: 'lino', ceil: 'ceiltile', floorOf: (x, y) => (x <= 14 && y >= 12) ? 'carpet' : null, pal: PAL.clinic, start: [7.5, 20.5, -Math.PI / 2], par: 190, music: 'muzak', amb: 'room',
      card: ['Day 4 – 10:30:00 (appt. 9:00)', "Sgt. 'Soap' MacTugish", 'undercover, sort of', 'Fertility Clinic — Waiting Room B'], goal: { x: 19.5, y: 19.5 },
      props: [['cooler', 13.5, 21.5], ['magrack', 1.5, 20.5], ['posterstand', 1.5, 16.5], ['cooler', 21.5, 21.5], ['board', 21.5, 18.2, { passable: true }], ['magrack', 16.5, 21.5], ['cone', 24.5, 21.5, { passable: true }], ['sign', 28.5, 1.4, { spr: 'sign_69' }], ['posterstand', 31.5, 2.5], ['cooler', 6.5, 1.5], ['magrack', 12.5, 1.5]],
      brief: ['> FERTILITY CLINIC, WAITING ROOM B. 10:30. APPOINTMENT WAS AT 9.', 'Deep cover. You are here to make a deposit. Nobody is rushing. Nobody has ever rushed here.',
        'Take a number at reception. Wait your turn. Condom Troopers guard the waiting room; they will try to wrap you.', 'When they call 69, ride the escalator up to Room 69. The walkway may be going the wrong way. That is on purpose.',
        '> OBJECTIVE: make the deposit. Remember: no Rushin\'.'],
      init() {
        bakeSign('sign_69', 'ROOM 69', '← this way', '#fff6e0', PINK); bakeBoard(4);
        spawnPickup('ticket', 19.5, 19.5);
        spawnNpc('prick', 21.5, 16.5, 1.15, 0.9, { far: 30 });
        say('PRICK', 'I\'m at reception, son. Undercover. The mustache is a disguise.', 240);
      },
      triggers: [
        { x: 24.5, y: 18, r: 1.6, fn: () => say('PRICK', 'Escalator\'s going up. Let it carry you. No rushin\'.', 220) },
        { x: 20, y: 2, r: 1.5, fn: () => { say('PRICK', 'That walkway is going the wrong way.', 160); say('PRICK', '...Walk anyway.', 140); announce('WRONG WAY', 'nobody is rushing', 40); } },
        { x: 5, y: 2, r: 1.5, fn: () => say('PRICK', 'Room 69. Go on in. Take your time. That\'s a joke. Please hurry.', 220) },
      ],
      stages: [
        { obj: 'Take a number at reception', done: () => M.flags.ticket, end() { M.goal = null; say('PRICK', 'Sixty-nine. Nice. Now sit tight — they\'re calling four.', 220); } },
        { obj: 'Wait your turn (nobody is rushing)', at: [7.5, 20.5, -Math.PI / 2], pre() { for (const e of ents) if (e.kind === 'pickup' && e.type === 'ticket') e.got = true; M.goal = null; }, start() { M.flags.waveT = t; nextWave(); },
          tick() { if (noEnemies() && wave < waves.length && t - M.flags.waveT > 90) { M.flags.waveT = t; nextWave(); } },
          done: () => wave >= waves.length && noEnemies(), end() { serving = 69; bakeBoard(69); announce('NOW SERVING: 69', 'that\'s you. finally.', 46); openGate(3, 2); say('PRICK', 'Sixty-nine! That\'s you. Escalator\'s past reception. Room 69 is upstairs at the far end.', 300); M.goal = { x: 1.5, y: 2 }; } },
        { obj: 'Ride the escalator up to Room 69', at: [20, 19.5, 0], pre() { for (const e of ents) if (e.kind === 'pickup' && e.type === 'ticket') e.got = true; openGate(3, 2); M.goal = { x: 1.5, y: 2 }; }, start() { spawnWave([['bee', 12, 2], ['bee', 28, 2], ['condom', 6, 2]]); for (const e of ents) if (e.kind === 'enemy') { e.ai = 'chase'; e.sightMul = 3; } },
          done: () => near(1.5, 2, 1.3), end() { announce('DEPOSIT MADE', 'the doctor will see you now', 44); say('PRICK', 'Sample delivered. You beautiful, patient man.', 240); M.flags.outT = t; } },
        { obj: 'Deposit', checkpoint: false, done: () => t - M.flags.outT > 130 },
      ],
    };
  };

  // ---------- 5. GAME OVA ----------
  const M5 = () => {
    const g = grid(82, 11);
    carve(g, 1, 3, 78, 7);          // the bridge deck
    carve(g, 58, 1, 80, 9);         // where it all ends
    for (let x = 6; x < 56; x += 10) { put(g, x, 2, 'A'); put(g, x, 8, 'A'); }
    let allies = [], boss = null, prick = null, pistol = null, f0 = 0;
    const F = () => t - f0;
    return {
      map: g, tex: { '#': 'concrete', A: 'tower', B: 'rust' }, floor: 'asphalt', floorOf: (x) => x >= 57 ? 'rubble' : null, pal: PAL.bridge, start: [3, 5, Math.PI], par: 200, railSpeed: 0.028, music: 'chase', amb: 'wind',
      card: ['Day 6 – 11:11:11', "Sgt. 'Soap' MacTugish", '22nd Sausage Air Service', 'Bridge over the Tubes'],
      props: [['car', 12, 3.5], ['car', 22, 6.5], ['cone', 26, 3.5, { passable: true }], ['barrier', 31, 6.5], ['car', 38, 3.5], ['lampost', 8, 7.5], ['lampost', 18, 3.5], ['lampost', 28, 7.5], ['lampost', 38, 7.5], ['lampost', 48, 3.5], ['barrier', 44, 3.5], ['car', 50, 6.5], ['cone', 54, 3.5, { passable: true }],
        ['wreck', 60, 2], ['wreck', 66, 8], ['fire', 60.5, 2.5, { passable: true }], ['smoke', 60.5, 2.3, { passable: true, z: 0.8 }], ['car', 70, 1.5], ['fire', 70, 2.4, { passable: true }], ['smoke', 70, 2.2, { passable: true, z: 0.8 }], ['barrel', 75, 8.5], ['wreck', 76, 3], ['barrier', 63, 8.5], ['cone', 65, 1.5, { passable: true }]],
      brief: ['> BRIDGE OVER THE TUBES. 11:11. THE END.', 'Jackoff has the launch codes. He is going to launch something. Nobody asked what.',
        'You are in the back of the truck with Soup, Gas and Gropes. Everything behind you wants to pinch you.', 'Hold them off until the bridge. Then it goes how it always goes. You know how it goes.',
        '> OBJECTIVE: survive the bridge. Don\'t. Look. Back. (Do look back. That\'s where they are.)'],
      init() { say('PRICK', 'Back of the truck, son. They\'re coming up behind us. Fire at will. Will\'s the crab.', 260); },
      stages: [
        { obj: 'Hold them off until the bridge', start() { M.state = 'rails'; player.a = Math.PI; M.flags.spawnT = 0; },
          tick() {
            if (t - M.flags.spawnT > (diff === 'regular' ? 70 : 95) && player.x < 50) { M.flags.spawnT = t; const ty = Math.random() < 0.55 ? 'bee' : 'crab'; spawnEnemy(ty, player.x - 9, rand(3.5, 6.5), { ai: 'chase', speedMul: ty === 'crab' ? 2.2 : 1.6, sightMul: 5 }); }
            for (const e of ents) if (e.kind === 'enemy' && e.x < player.x - 14) e.gone = true;
            if (player.x > 25 && !M.flags.mid) { M.flags.mid = true; say('SOUP', 'Bridge! We\'re almost across!', 180); say('PRICK', 'Don\'t say that. Never say that.', 180); }
          },
          done: () => player.x >= 56, end() { M.timer = null; } },
        { obj: '', at: [58, 5, 0],
          start() {
            M.state = 'crawl'; f0 = t; player.canFire = false; player.invul = true; player.a = 0; camH = 0.5; ts = 1;
            for (const e of ents) if (e.kind === 'enemy') e.gone = true; ents = ents.filter(e => !e.gone);
            M.pal = PAL.finale; M.tex = { '#': 'rust', A: 'tower', B: 'rust' }; spawnProp('fire', 58, 1.8, { passable: true }); spawnProp('smoke', 58, 1.6, { passable: true, z: 0.8 }); spawnProp('fire', 64.5, 8.5, { passable: true });
            allies = [spawnNpc('gas', 59.6, 3.7, 1.3, 1.0), spawnNpc('gropes', 60.8, 6.6, 1.3, 1.0), spawnNpc('soup', 59.2, 7.3, 1.3, 1.0)];
            boss = spawnNpc('boss', 74, 5, 3.0, 2.3, { r: 1.0, hp: 1, far: 60 });
            prick = spawnNpc('prick', 57, 8.2, 1.15, 0.9, { far: 60 });
            shake = 30; flash = 1.4; sfx('boom');
          },
          tick() {
            const f = F();
            if (f < 40) { shake = Math.max(shake, 14); }
            camH = lerp(camH, 0.16, 0.03); ts = lerp(ts, 0.42, 0.03); pitch = lerp(pitch, 24, 0.02);
            if (f === 30) { say('PRICK', 'The bridge... Soup! Gas! Gropes! Sound off!', 220); sfx('slowmo'); }
            if (f === 60) setObjective('Crawl. That\'s all you can do.');
            if (f > 60 && f % 14 === 0 && f < 500) sfx('chop');
            if (f === 150) { allies[0].dead = true; say('SOUP', 'Gas is down!', 160); sfx('shoot'); }
            if (f === 300) { allies[1].dead = true; say('SOUP', 'Gropes! No... no.', 160); sfx('shoot'); }
            if (f === 420) { allies[2].dead = true; say('PRICK', '...Soup.', 200); sfx('shoot'); }
            if (f > 90 && boss.x > 61.6) { boss.x -= 0.022; boss.y = lerp(boss.y, 5, 0.01); if (f % 40 === 0) sfx('boss'); }
            if (f === 480) { say('JACKOFF', 'Hello, little fella. I\'d shake your hand, but... you know.', 260); boss.attackT = 999; }
            if (f === 640) { say('JACKOFF', 'You took my arm. I\'m going to take everything.', 220); }
            if (f === 760) { say('PRICK', 'Son... catch.', 160); sfx('slide'); prick.attackT = 999; pistol = spawnPickup('pistol', 57.4, 7.8); pistol.tick = e => { const a = angleTo(e, player); e.x += Math.cos(a) * 0.05; e.y += Math.sin(a) * 0.05; }; pistol.h = 0.35; pistol.w = 0.5; }
          },
          done: () => M.flags.pistol },
        { obj: 'SHOOT HIM.', checkpoint: false,
          start() { M.state = 'showdown'; f0 = t; player.a = angleTo(player, boss); player.canFire = true; player.ammo = 1; player.reloading = false; boss.shootable = true; boss.attackT = 0; boss.onDeath = e => { M.flags.bossDead = true; M.flags.deadT = t; sfx('boss'); shake = 20; ts = 0.2; say('JACKOFF', '...oh.', 120); }; announce(isTouch ? 'TAP TO SHOOT' : 'CLICK TO SHOOT', 'one glob. make it count.', 48); ts = 0.3; sfx('slowmo'); },
          tick() { ts = lerp(ts, M.flags.bossDead ? 0.2 : 0.35, 0.05); if (M.flags.bossDead) { const k = t - M.flags.deadT; if (k > 60) whiteOut = Math.min(1, (k - 60) / 90); } },
          done: () => M.flags.bossDead && t - M.flags.deadT > 170 },
        { obj: '', checkpoint: false,
          start() { M.state = 'cut'; f0 = t; ts = 1; player.canFire = false; player.canMove = false; for (const e of ents) if (e.kind === 'npc' && e !== prick) e.gone = true; ents = ents.filter(e => !e.gone); camH = 0.5; pitch = -30; player.x = 62; player.y = 5; player.a = -Math.PI / 2 + 0.3; whiteOut = 1; spawnDeco('heli', 64, 2.5, 1.4, 1.6, { z: 1.2, far: 40 }); M.pal = PAL.bridge; },
          tick() { const f = F(); whiteOut = Math.max(0, 1 - f / 60); if (f % 10 === 0 && f < 400) sfx('chop'); if (f === 70) say('PRICK', 'We got you, son. We got you.', 200); if (f === 200) say('PRICK', 'It\'s over. She said... she said you did great.', 240); if (f > 330) whiteOut = Math.min(1, (f - 330) / 60); },
          done: () => F() > 400 },
      ],
    };
  };
  const MISSIONS = [M1, M2, M3, M4, M5];

  function drawTruck() {   // the back of the truck you're riding in: a tailgate bouncing along the bottom of the screen
    const b = Math.sin(t * 0.3) * 3 + Math.sin(t * 0.07) * 2;
    ctx.save(); ctx.translate(0, b);
    rr(-20, H - 96, W + 40, 130, 8); fs('#5b6b3c', INK, 4);
    ctx.fillStyle = '#4c5828'; ctx.fillRect(-20, H - 84, W + 40, 6); ctx.fillRect(-20, H - 40, W + 40, 6);
    for (let i = 0; i < 12; i++) { E(40 + i * 82, H - 62, 4, 4); fs('#8a9a6a', INK, 1.5); }
    rr(W / 2 - 90, H - 80, 180, 30, 6); fs('#fff6e0', INK, 2.5); txt('BABY ON BOARD', W / 2, H - 65, 16, INK, 'center', null);
    ctx.restore();
  }
  // ================================================================
  //  MAIN LOOP
  // ================================================================
  let ambWant = null;
  function syncAudio() {
    let m = null, a = null;
    if (state === 'title' || state === 'select' || state === 'brief' || state === 'clear') m = 'title';
    else if ((state === 'game' || state === 'pause') && M) { if (M.state === 'play' || M.state === 'rails') m = M.music; a = M.state === 'crawl' || M.state === 'showdown' ? 'fire' : M.amb; }
    else if (state === 'dead' && M) a = M.amb;
    playMusic(m);
    if (a !== ambWant && actx) { ambWant = a; setAmbience(a); }
    audioTick();
  }
  function update() {
    t++; syncAudio();
    if (state === 'game') updateGame();
    else { stateT++; if (state === 'dead' || state === 'clear') { for (const j of jam) j.life--; jam = jam.filter(j => j.life > 0); shake *= 0.9; radioTick(); for (const a of announceQ) a.life--; announceQ = announceQ.filter(a => a.life > 0); } }
  }
  function draw() {
    ctx = mainCtx;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (M && (state === 'game' || state === 'dead' || state === 'clear' || state === 'pause')) {
      ctx.save();
      if (shake > 0.3) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
      collectDrawables();
      render3D();
      if (M.state === 'rails') drawTruck();
      if (M.state !== 'crawl' && M.state !== 'cut' && state !== 'dead') drawWeapon();
      ctx.restore();
      if (state === 'game') drawHUD();
      if (whiteOut > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, whiteOut)})`; ctx.fillRect(0, 0, W, H); }
      if (M.state === 'showdown' && state === 'game' && !M.flags.bossDead) { txt(isTouch ? 'TAP TO SHOOT' : 'CLICK TO SHOOT', W / 2, H - 60, 30 + Math.sin(t * 0.2) * 3, YEL); }
      if (state === 'dead') drawDead();
      if (state === 'clear') drawClear();
      if (state === 'pause') drawPause();
    }
    else if (state === 'title') drawTitle();
    else if (state === 'select') drawSelect();
    else if (state === 'brief') drawBrief();
    else if (state === 'credits') drawCredits();
    // portrait phones: the canvas is rotated, so tell them to turn the phone for the full-fat version
    if (portrait && state !== 'game') txt('(turn your phone sideways for the full experience)', W / 2, H - 4, 11, '#fff', 'center', null);
  }
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  function boot() { bakeTextures(); bakeAll(); bakeProps(); requestAnimationFrame(loop); }
  if (document.fonts && document.fonts.load) document.fonts.load(`20px ${FONT}`).then(boot, boot); else boot();
  //__DBG__
})();
</script>
