<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cum of Duty: Wrong Hole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1530; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  // ---------- Setup ----------
  const W = 960, H = 540;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1, dpr = 1;
  let portrait = false;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    portrait = innerHeight > innerWidth * 1.1;
    scale = portrait ? Math.min(innerHeight / W, innerWidth / H) : Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.style.transform = portrait ? 'rotate(90deg)' : '';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  }
  addEventListener('resize', resize); resize();

  const FONT = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
  const INK = '#3a1230';
  const CREAM = '#fdf6e3';
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const rand = (a, b) => a + Math.random() * (b - a);
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pickOne = a => a[Math.floor(Math.random() * a.length)];

  const PX = 220;                 // player screen x
  const PR = 13;                  // player radius
  let t = 0, state = 'title';
  let scene = 0, sf = 0;          // intro scene + frame within scene
  let mission = 1, scroll = 0, speed = 5, prog = 0, player, objs = [], parts = [], hold = false;
  let deadT = 0, clearT = 0, endT = 0, titleT = -999, score = 0, best = 0, pickups = 0, nextSpawn = 0, shake = 0, flash = 0;
  let radio = null, radioQ = [], fired = new Set(), deathQuote = '', farted = false;
  let birthT = 0, push = 0, popT = -1, pushed = new Set();   // the delivery room
  let streak = 0, boostT = -999, pink = 0;   // hearts-in-a-row combo and the 'she came' surge
  const BOOST_LEN = 110;
  const MOANS = ['ohhh... yes...', 'mmm. keep going.', 'oh god. OH GOD.', 'don\'t you dare stop', 'again. do it again.'];
  try { best = +localStorage.getItem('cod_best') || 0; } catch (e) {}

  const MISSIONS = {
    1: { name: 'OPERATION BROWN EYE', obj: 'Get out of the butthole.', len: 11000, wall: '#7d4034', inner: '#d3867a', deep: '#b76b60', pick: 'lube drops' },
    2: { name: 'OVULATION STATION', obj: 'Reach the egg. Make a baby.', len: 12500, wall: '#b03a5e', inner: '#ff9ec4', deep: '#f07aa8', pick: 'hearts' },
  };
  const SCRIPT = {
    1: [
      [0.02, 'PRICK', "Swimmer, you're in the rectum. Swim toward the light."],
      [0.12, 'PRICK', 'Watch the corn. It never digests. Ever.'],
      [0.24, 'SWIMMER', 'Captain, something just farted on me.'],
      [0.28, 'PRICK', "That's the enemy, son. Hold your breath."],
      [0.4, 'PRICK', "Hemorrhoids on the walls. Don't touch the angry grapes."],
      [0.55, 'PRICK', "You're doing great. This is still the wrong hole."],
      [0.68, 'SWIMMER', 'Is that... a peanut?'],
      [0.72, 'PRICK', 'She had pad thai. Keep moving.'],
      [0.86, 'PRICK', 'Sphincter ahead. Wait for it to open. Do NOT get clenched.'],
      [0.95, 'PRICK', "Almost out. Don't look back. Seriously. Don't."],
    ],
    2: [
      [0.02, 'PRICK', 'Good news: right hole. Bad news: 200 million other guys had the same idea.'],
      [0.18, 'PRICK', "White blood cells inbound. They think you're an infection. Rude."],
      [0.33, 'PRICK', 'Mucus wall. Push through it like your father would.'],
      [0.48, 'SWIMMER', "Captain, it's getting tight."],
      [0.52, 'PRICK', "That's the cervix, son. Everyone's first time is tight."],
      [0.64, 'PRICK', 'Spermicide clouds. Purple means death. Like a grape.'],
      [0.77, 'PRICK', 'Copper wire ahead. She said she had an IUD. Dodge it anyway.'],
      [0.9, 'PRICK', 'Ovulation Station in sight. This is it. Make your father proud.'],
      [0.97, 'EGG', 'come here, big boy'],
    ],
  };
  const TAUNTS = ['later, loser', 'my dad is a lawyer', 'see you at the egg. jk you won\'t', 'nice tail. did your mom pick it?', 'swim faster, grandpa'];
  const QUOTES = [
    ["'Life... uh... finds a way.'", 'Dr. Ian Malcolm, probably'],
    ["'Every sperm is sacred.'", 'some monks'],
    ["'You miss 100% of the eggs you don\'t swim to.'", 'Wayne Gretzky. Michael Scott.'],
    ["'Never go in dry.'", 'Captain Prick'],
    ["'It\'s not the size of the sperm, it\'s the motion of the tail.'", 'nobody, ever'],
    ["'PULL OUT. PULL OUT.'", 'Captain Prick, ignored'],
    ["'The only easy day was yesterday. Yesterday you were in a ball.'", 'Navy SEALs, ish'],
    ["'He died as he lived: in someone\'s butt.'", 'his eulogy'],
    ["'Two hundred million went in. Zero came out. Including you.'", 'after-action report'],
  ];
  const PICK_LINES = { 5: 'that\'s the good lube', 15: 'slippery when wet', 30: 'you\'re basically a fish now', 50: 'ok you can stop collecting and start escaping' };

  // ---------- Sound ----------
  let actx = null, muted = false;
  let unlocked = false;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iOS: play even with the ringer switch on silent
    }
    if (actx && actx.state !== 'running') actx.resume();
    if (actx && !unlocked) {   // iOS: a silent buffer on the first touch unlocks the context
      try { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); unlocked = true; } catch (e) {}
    }
    return actx;
  }
  ['touchend', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(ev => addEventListener(ev, audio, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && actx) actx.resume(); });
  function tone(f1, f2, d, type, vol, when) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.connect(g); g.connect(a.destination);
    const s = a.currentTime + (when || 0);
    o.frequency.setValueAtTime(f1, s); o.frequency.exponentialRampToValueAtTime(f2, s + d);
    g.gain.setValueAtTime(vol, s); g.gain.exponentialRampToValueAtTime(0.001, s + d);
    o.start(s); o.stop(s + d + 0.02);
  }
  function sfx(n) {
    switch (n) {
      case 'pick': tone(880, 1400, 0.1, 'triangle', 0.1); break;
      case 'die': tone(300, 40, 0.6, 'sawtooth', 0.12); break;
      case 'fart': tone(120, 60, 0.4, 'sawtooth', 0.08); tone(90, 50, 0.3, 'square', 0.05, 0.1); break;
      case 'radio': tone(1200, 900, 0.05, 'square', 0.04); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.02, 0.28, 'triangle', 0.12, i * 0.13)); break;
      case 'chop': tone(70, 60, 0.08, 'square', 0.03); break;
      case 'blip': tone(600, 900, 0.06, 'square', 0.05); break;
      case 'pop': tone(200, 900, 0.18, 'sine', 0.15); tone(900, 300, 0.3, 'sine', 0.12, 0.18); break;
      case 'cry': [0, 0.35, 0.7].forEach(w => tone(700, 500, 0.3, 'sawtooth', 0.05, w)); break;
      case 'moan': tone(260, 520, 0.5, 'sine', 0.1); tone(520, 380, 0.7, 'sine', 0.1, 0.45); tone(180, 90, 0.9, 'triangle', 0.08, 0.2); break;
    }
  }

  // ---------- Radio ----------
  function say(who, text, dur) { radioQ.push({ who, text, dur: dur || Math.max(150, 40 + text.length * 4), f: 0 }); }
  function radioTick() {
    if (!radio && radioQ.length) { radio = radioQ.shift(); sfx('radio'); }
    if (radio && ++radio.f > radio.dur) radio = null;
  }
  function drawRadio() {
    if (!radio) return;
    const shown = radio.text.slice(0, Math.floor(radio.f * 1.4));
    const names = { PRICK: 'Capt. Prick', SWIMMER: 'Sgt. Swimmer', RIVAL: 'Some Other Sperm', EGG: 'The Egg' };
    const cols = { PRICK: '#ffd23f', SWIMMER: '#7ed6df', RIVAL: '#ff9f43', EGG: '#ff5d8f' };
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(W / 2 - 400, H - 78, 800, 58, 12); ctx.fill();
    txt(names[radio.who] + ':', W / 2 - 384, H - 49, 20, cols[radio.who], 'left', null);
    txt(shown, W / 2 - 384 + ctx.measureText(names[radio.who] + ': ').width + 8, H - 49, 20, '#fff', 'left', null);
  }

  // ---------- Tunnel ----------
  const center = wx => H / 2 + Math.sin(wx * 0.0035) * 85 + Math.sin(wx * 0.0111 + 2) * 35;
  const halfH = wx => 165 + Math.sin(wx * 0.0027 + 1) * 18;

  // ---------- Mission flow ----------
  function startMission(m) {
    mission = m; scroll = 0; speed = 4.5; prog = 0; objs = []; parts = []; pickups = 0; nextSpawn = 700; radio = null; radioQ = []; fired = new Set(); farted = false; shake = 0; flash = 0; streak = 0; boostT = -999; pink = 0;
    player = { y: H / 2, vy: 0, ph: 0 };
    state = 'play'; titleT = t;
  }
  function die(why) {
    if (state !== 'play') return;
    state = 'dead'; deadT = t; shake = 14; flash = 1; radio = null; radioQ = [];
    deathQuote = pickOne(QUOTES); sfx('die');
    for (let i = 0; i < 16; i++) parts.push({ x: PX, y: player.y, vx: rand(-4, 4), vy: rand(-5, 2), r: rand(3, 6), c: CREAM, life: 50, max: 50 });
    score += Math.floor(scroll / 20) + pickups * 10;
  }
  function tap() {
    audio();
    switch (state) {
      case 'title': state = 'intro'; scene = 0; sf = 0; break;
      case 'intro': nextScene(); break;
      case 'dead': if (t - deadT > 70) startMission(mission); break;
      case 'clear': if (t - clearT > 90) startMission(2); break;
      case 'end': if (t - endT > 120) { state = 'birth'; birthT = t; push = 0; popT = -1; pushed = new Set(); radio = null; radioQ = []; parts = []; } break;
      case 'birth': {
        const k = t - birthT;
        if (k < 200) { birthT = t - 200; break; }                  // skip the title card
        if (popT < 0) { push = Math.min(100, push + 7); shake = 3; sfx('blip'); }
        else if (t - popT > 150) state = 'title';
        break;
      }
    }
  }
  function nextScene() { scene++; sf = 0; if (scene > 3) { score = 0; startMission(1); } }

  // ---------- Input ----------
  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) { if (state === 'play') hold = true; else tap(); } }
    if (e.code === 'KeyM') muted = !muted;
  });
  addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) hold = false; });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') hold = true; else tap(); });
  const release = () => { hold = false; };
  addEventListener('pointerup', release); addEventListener('pointercancel', release);

  // ---------- Spawning ----------
  function spawn(wx) {
    const c = center(wx), h = halfH(wx);
    const pool = mission === 1
      ? [['turd', 3], ['corn', 3], ['peanut', 2], ['fart', 1.5], ['roid', 2]]
      : [['wbc', 2], ['mucus', 1.5], ['rival', 1.5], ['spermicide', prog > 0.5 ? 1.5 : 0.4], ['iud', prog > 0.7 ? 1.2 : 0]];
    let sum = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * sum, type = pool[0][0];
    for (const [n, w] of pool) { if ((r -= w) < 0) { type = n; break; } }
    const R = { turd: 28, corn: 14, peanut: 17, fart: 42, roid: 22, wbc: 26, mucus: 34, rival: 16, spermicide: 36, iud: 30 }[type];
    const o = { type, x: wx, y: c + rand(-h + R + 30, h - R - 30), r: R, seed: rand(0, 6), got: false };
    if (type === 'roid') o.y = Math.random() < 0.5 ? c - h + 8 : c + h - 8;
    if (type === 'rival') { o.x = scroll - 120; o.y = c + rand(-h + 40, h - 40); o.taunted = false; }
    objs.push(o);
    // pickups in an arc or a line
    const pk = mission === 1 ? 'drop' : 'heart';
    if (Math.random() < 0.75) {
      const py = c + rand(-h + 40, h - 40), px = wx + rand(120, 200);
      for (let i = 0; i < 5; i++) objs.push({ type: pk, x: px + i * 34, y: py + Math.sin(i * 0.9) * 22, r: 10, seed: rand(0, 6), got: false });
    }
  }

  // ---------- Update ----------
  function update() {
    t++;
    if (shake > 0) { shake *= 0.9; if (shake < 0.4) shake = 0; }
    if (flash > 0) flash = Math.max(0, flash - 0.04);
    for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life--; }
    parts = parts.filter(q => q.life > 0);

    if (state === 'intro') { sf++; introTick(); return; }
    if (state === 'birth') {
      const k = t - birthT;
      if (k === 200) say('PRICK', "Swimmer? It's me. I got out of the butt. I'm a doctor now. PUSH.", 200);
      if (k > 200 && popT < 0) {
        [[25, 'PRICK', "She's crowning. That's not a hat, son."], [50, 'PRICK', 'Breathe. No, not you. HER.'], [75, 'PRICK', 'I can see a helmet!']].forEach(([f, who, text]) => { if (push >= f && !pushed.has(f)) { pushed.add(f); say(who, text, 130); } });
        if (push < 100) push = Math.max(0, push - 0.35);
        else { popT = t; shake = 16; sfx('pop'); radio = null; radioQ = []; say('PRICK', "It's a... sperm? Congratulations. He has your helmet.", 400);
          for (let i = 0; i < 40; i++) parts.push({ x: 560, y: 330, vx: rand(-6, 6), vy: rand(-8, -1), r: rand(3, 6), c: pickOne(['#ff5d8f', '#ffd23f', '#7ed6df', '#fff']), life: 90, max: 90 }); }
      }
      if (popT > 0 && t - popT === 40) sfx('cry');
      radioTick(); return;
    }
    if (state !== 'play') { radioTick(); return; }

    const M = MISSIONS[mission], p = player;
    const boosting = t - boostT < BOOST_LEN;
    speed = 3.8 + prog * 1.6 + (boosting ? 9 : 0);
    scroll += speed; prog = clamp(scroll / M.len, 0, 1);
    if (boosting) {
      p.y += (center(scroll + PX) - p.y) * 0.12;                 // sucked toward the middle
      if (t % 2 === 0) parts.push({ x: W + 10, y: center(scroll + rand(0, W)) + rand(-120, 120), vx: -speed * 1.6, vy: 0, r: rand(2, 4), c: 'rgba(255,255,255,0.7)', life: 40, max: 40, line: true });
      if (t % 6 === 0) parts.push({ x: PX + rand(-30, 30), y: p.y + rand(-30, 30), vx: -2, vy: rand(-2, -0.5), r: 0, heart: true, c: '#ff5d8f', life: 50, max: 50 });
    }
    if (pink > 0) pink = Math.max(0, pink - 0.012);
    p.vy += 0.24; if (hold) p.vy -= 0.5;
    p.vy = clamp(p.vy, -4.8, 4.8); p.y += p.vy; p.ph += 0.4 + (hold ? 0.3 : 0);
    if (hold && t % 4 === 0) parts.push({ x: PX - 30, y: p.y + rand(-6, 6), vx: -speed * 0.4, vy: rand(-0.5, 0.5), r: rand(2, 4), c: 'rgba(255,255,255,0.6)', life: 25, max: 25 });

    // walls
    const wx = scroll + PX, c = center(wx), h = halfH(wx);
    if (!boosting && (p.y - PR < c - h + 2 || p.y + PR > c + h - 2)) { die('wall'); return; }

    // spawn
    const endZone = M.len - 900;
    while (scroll + W + 150 > nextSpawn && nextSpawn < endZone) { spawn(nextSpawn); nextSpawn += mission === 2 ? rand(470, 700) : rand(400, 600); }

    // objects
    let slow = 1;
    for (const o of objs) {
      if (o.type === 'rival') { o.x += speed + 3.5; o.y += Math.sin(t * 0.1 + o.seed) * 0.8; if (!o.taunted && o.x > scroll + PX + 40) { o.taunted = true; say('RIVAL', pickOne(TAUNTS), 120); } }
      if (o.type === 'wbc') { const dx = o.x - wx; if (dx > -100 && dx < 330) o.y += clamp(p.y - o.y, -0.6, 0.6); }
      const sx = o.x - scroll, dx = sx - PX, dy = o.y - p.y, d = Math.hypot(dx, dy);
      if (o.type === 'heart' && !o.got && !o.missed && sx < PX - o.r - 12) { o.missed = true; if (streak > 0 && !boosting) streak = 0; }
      const hit = d < o.r + PR - (o.type === 'drop' || o.type === 'heart' ? 0 : 9);
      if (!hit) continue;
      switch (o.type) {
        case 'drop': case 'heart':
          if (!o.got) { o.got = true; pickups++; sfx('pick'); if (PICK_LINES[pickups]) say('PRICK', PICK_LINES[pickups], 120);
            parts.push({ x: sx, y: o.y, vx: 0, vy: -1.5, r: 0, txt: '+10', c: '#ffd23f', life: 40, max: 40 });
            if (o.type === 'heart' && !boosting) {
              streak++;
              if (streak >= 5) { streak = 0; boostT = t; pink = 1; shake = 10; sfx('moan'); radio = null; radioQ = []; say('EGG', pickOne(MOANS), 110); say('PRICK', 'She came. Ride the wave, Swimmer!', 130); score += 250;
                for (let i = 0; i < 24; i++) parts.push({ x: PX, y: p.y, vx: rand(-6, 6), vy: rand(-6, 6), r: 0, heart: true, c: '#ff5d8f', life: 60, max: 60 }); }
            } }
          break;
        case 'fart':
          p.vy -= 0.55; slow = 0.7;
          if (!farted) { farted = true; sfx('fart'); say('SWIMMER', 'WHO. FARTED.', 100); }
          if (t % 3 === 0) parts.push({ x: PX + rand(-20, 20), y: p.y + rand(-20, 20), vx: rand(-1, 1), vy: rand(-2, -0.5), r: rand(6, 12), c: 'rgba(120,200,90,0.5)', life: 30, max: 30 });
          break;
        case 'mucus': slow = 0.6; p.vy *= 0.9; break;
        default: if (!boosting) { die(o.type); return; }
      }
    }
    if (slow < 1) scroll -= speed * (1 - slow);
    objs = objs.filter(o => o.x - scroll > -200 && !o.got);

    // end of mission
    if (mission === 1) {
      const gx = M.len - 450 - scroll;               // gate screen x
      const gap = 52 + 70 * Math.abs(Math.sin(t * 0.035));
      const gc = center(M.len - 450);
      if (PX + PR > gx - 40 && PX - PR < gx + 40 && Math.abs(p.y - gc) > gap - PR) { die('clenched'); return; }
      if (scroll > M.len) { state = 'clear'; clearT = t; score += 1000 + pickups * 10; sfx('win'); radio = null; radioQ = []; }
    } else {
      const ex = M.len - scroll, ec = center(M.len);
      if (Math.hypot(ex - PX, ec - p.y) < 90 + PR) { state = 'end'; endT = t; score += 5000 + pickups * 10; sfx('win'); radio = null; radioQ = [];
        if (score > best) { best = score; try { localStorage.setItem('cod_best', best); } catch (e) {} } }
    }

    // scripted radio
    for (const [f, who, text] of SCRIPT[mission]) { const k = f + who; if (prog >= f && !fired.has(k)) { fired.add(k); say(who, text); } }
    radioTick();
  }

  // ---------- Intro ----------
  const INTRO = [
    { len: 320 },
    { len: 680, subs: [[20, 'PRICK', "Swimmer. Wake up. It's go time."], [130, 'SWIMMER', 'Where are we, Captain?'], [220, 'PRICK', 'Classified. Somewhere warm. Somewhere wet.'], [330, 'PRICK', 'Two hundred million of us went in. One comes out a father.'], [450, 'PRICK', 'Gear up. On the rope in ten.'], [560, 'PRICK', 'Bravo Six... going dark.']] },
    { len: 540, subs: [[10, 'PRICK', 'On the rope, Swimmer. Go, go, go.'], [120, 'SWIMMER', "Captain, I can't see shit."], [210, 'PRICK', "That's the fog of war, son."], [310, 'SWIMMER', 'It smells like... war.'], [410, 'PRICK', 'Keep going. Almost at the LZ.']] },
    { len: 640, subs: [[15, 'SWIMMER', '...Captain.'], [95, 'PRICK', 'Yeah.'], [150, 'SWIMMER', "This isn't the ship."], [230, 'PRICK', 'No, son.'], [300, 'PRICK', "That's an asshole."], [400, 'PRICK', 'New mission: get out. Find the right hole. Make a baby.'], [520, 'SWIMMER', 'Copy that. Oscar Mike.']] },
  ];
  function introTick() {
    const sc = INTRO[scene];
    if (sc.subs) for (const [f, who, text] of sc.subs) if (sf === f) { radio = null; radioQ = []; say(who, text, 999); }
    if (scene === 1 && sf % 6 === 0) sfx('chop');
    if (scene === 3 && sf === 1) { shake = 12; flash = 0.6; }
    radioTick();
    if (sf > sc.len) nextScene();
  }

  // ---------- Drawing helpers ----------
  function E(x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), r, 0, Math.PI * 2); }
  function fs(fill, stroke = INK, lw = 2.5) { ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
  function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function heart(x, y, s) {

    // rain streaks flying outward past you
    ctx.strokeStyle = 'rgba(180,200,255,0.35)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 60; i++) { const a = i * 0.7, u = mod(i * 0.13 + sf * 0.02, 1), r = 40 + u * u * 600; ctx.beginPath(); ctx.moveTo(vx + Math.cos(a) * r, vy + Math.sin(a) * r); ctx.lineTo(vx + Math.cos(a) * (r + 25), vy + Math.sin(a) * (r + 25)); ctx.stroke(); }
    // your tail, wrapped around the rope
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(300, H + 20); ctx.quadraticCurveTo(420, 470, vx - 20, 440); ctx.quadraticCurveTo(vx + 30, 420 + Math.sin(t * 0.2) * 3, vx + 22, 470); ctx.stroke();
    ctx.strokeStyle = CREAM; ctx.lineWidth = 13; ctx.stroke();
    helmetBrim(Math.sin(t * 0.15) * 3); vignette(0.75);
  }
  function fpTunnel(M) {
    const vx = 480, vy = 290, pulse = 1 + Math.sin(t * 0.05) * 0.02;
    ctx.fillStyle = M.wall; ctx.fillRect(0, 0, W, H);
    for (let i = 13; i >= 0; i--) {
      const r = 22 * Math.pow(1.36, i) * pulse, d = i / 13;
      E(vx + Math.sin(i * 1.3) * 10, vy + Math.cos(i * 0.9) * 8, r, r * 0.82);
      fs(i % 2 ? M.inner : M.deep, 'rgba(58,18,48,0.5)', 3);
    }
    ctx.fillStyle = '#2a0a12'; E(vx, vy, 20, 16); ctx.fill();
    ctx.fillStyle = '#ffe9a8'; E(vx, vy, 4, 3); ctx.fill();          // the light at the end
    // a few residents floating in the distance
    ctx.save(); ctx.translate(vx + 120 + Math.sin(t * 0.03) * 8, vy + 60); ctx.scale(0.55, 0.55); E(0, 8, 28, 14); fs('#6b3f1d'); E(-4, -4, 22, 12); fs('#7a4a24'); face(-2, -2, { mouth: 'o' }); ctx.restore();
    ctx.save(); ctx.translate(vx - 150, vy - 40); ctx.rotate(t * 0.04); E(0, 0, 9, 7); fs('#ffd23f'); ctx.restore();
    // the rope you came in on
    poly([vx - 10, -10, vx + 10, -10, vx + 2, vy - 30, vx - 2, vy - 30]); fs('#b89a6a', '#6e5a3a', 2);
    helmetBrim(Math.sin(t * 0.15) * 3); vignette(0.55);
  }
  function drawIntro() {
    if (scene === 0) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      const lines = ['DAY 1 — 02:47:13', 'SGT. "SWIMMER" JR.', '22ND SPERM REGIMENT', 'SOMEWHERE OFF THE COAST OF THE BALLSACK'];
      lines.forEach((l, i) => { const start = i * 55; if (sf > start) txt(l.slice(0, Math.floor((sf - start) / 2)), 120, 200 + i * 42, 30, '#e8ffe8', 'left', null); });
    } else if (scene === 1) {
      fpChopper();
    } else if (scene === 2) {
      fpRope();
    } else {
      fpTunnel(MISSIONS[1]);
      if (sf > 280) txt('(it\'s an asshole)', 480, 110, 26, '#ffd23f');
    }
    drawRadio();
    txt(isTouch ? 'tap to skip' : 'SPACE to skip', W - 16, 22, 16, 'rgba(255,255,255,0.7)', 'right', null);
  }

  // ---------- Delivery room ----------
  function drawBirth() {
    const k = t - birthT;
    if (k < 200) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      txt('9 MONTHS LATER'.slice(0, Math.floor(k / 4)), W / 2, H / 2 - 20, 54, '#e8ffe8', 'center', null);
      if (k > 90) txt('(she kept it)', W / 2, H / 2 + 40, 24, '#ffd23f', 'center', null);
      return;
    }
    const sq = popT < 0 ? push / 100 : 1, pk = popT < 0 ? 0 : t - popT;
    // room
    ctx.fillStyle = '#dff3f0'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#b8dcd6'; ctx.fillRect(0, 380, W, H - 380);
    ctx.fillStyle = '#fff'; ctx.fillRect(60, 40, 220, 60); txt('MATERNITY WARD', 170, 70, 20, INK, 'center', null);
    // monitor
    rr(720, 60, 200, 120, 8); fs('#1d232b', INK, 3);
    ctx.strokeStyle = '#4dff88'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x < 180; x += 4) { const u = mod(x - t * 3, 180), spike = u % 60 < 6 ? -30 * (1 - Math.abs(u % 60 - 3) / 3) : 0; ctx.lineTo(730 + x, 130 + spike - Math.sin(x * 0.2) * 2); }
    ctx.stroke(); txt(`${popT < 0 ? 120 + Math.floor(push * 0.8) : 80} bpm`, 820, 165, 16, '#4dff88', 'center', null);
    // bed
    rr(120, 300, 560, 130, 16); fs('#f4f6f8', INK, 3); ctx.fillStyle = '#c9d2dc'; ctx.fillRect(140, 430, 20, 60); ctx.fillRect(640, 430, 20, 60);
    rr(130, 280, 110, 60, 20); fs('#fff', INK, 2.5);             // pillow
    // mom: head, gown, belly, legs in stirrups
    E(200, 250, 40, 40); fs('#f9c3ad');
    ctx.fillStyle = '#5a2e1a'; ctx.beginPath(); ctx.arc(200, 240, 44, Math.PI, 0); ctx.fill(); ctx.fillRect(156, 240, 20, 50);
    face(196, 254, { mouth: popT < 0 && push > 15 ? 'o' : (popT >= 0 ? undefined : 'sad'), ph: 3 });
    if (popT < 0 && push > 30) { ctx.fillStyle = '#9ad8ff'; E(232, 236, 4, 6); ctx.fill(); }
    ctx.fillStyle = '#ffb3c9'; rr(230, 290, 300, 90, 30); ctx.fill();          // gown
    const by = 320 - 30 * sq * 0, bw = 95 * (1 + sq * 0.15), bh = 75 * (1 - sq * 0.25);
    E(400, 300 + (75 - bh), bw, bh); fs('#ffb3c9', INK, 3);                     // belly, squashes when pushing
    if (popT < 0) { E(400, 300 + (75 - bh), bw * 0.4, bh * 0.35); fs('rgba(255,255,255,0.35)', null); }
    // blanket + stirrup legs
    poly([500, 290, 600, 200, 660, 210, 620, 300, 600, 380, 500, 380]); fs('#7ed6df', INK, 3);
    ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(600, 200); ctx.lineTo(640, 150); ctx.moveTo(660, 210); ctx.lineTo(700, 160); ctx.stroke();
    ctx.strokeStyle = '#f9c3ad'; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = '#8d99a6'; ctx.fillRect(636, 140, 14, 10); ctx.fillRect(696, 150, 14, 10);
    // Dr. Prick with a catcher's mitt
    drawSperm(760, 330 + Math.sin(t * 0.1) * 3, 2, { hat: true, stache: true, ph: t * 0.15, mouth: talking('PRICK') ? 'o' : undefined });
    ctx.fillStyle = '#c98b4b'; E(700, 330, 26, 30); fs('#c98b4b', INK, 2.5); E(700, 330, 14, 18); fs('#a8683a', INK, 1.5);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(740, 300); ctx.lineTo(752, 290); ctx.stroke();
    E(760, 288, 12, 5); fs('#7ed6df', INK, 1.5); txt('MD', 760, 288, 8, INK, 'center', null);
    // the baby
    if (popT >= 0) {
      const u = Math.min(1, pk / 60), bx = 620 + u * 120, byy = 300 - Math.sin(u * Math.PI) * 160 + (1 - u) * 0;
      const land = pk > 60;
      drawSperm(land ? 700 + Math.sin(t * 0.3) * 2 : bx, land ? 322 : byy, 0.9, { helmet: true, ph: t * 0.8, rot: land ? 0 : u * Math.PI * 2, mouth: land && pk > 40 ? 'o' : undefined });
      ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      const dx = land ? 700 : bx, dy = land ? 322 : byy; rr(dx - 8, dy + 6, 20, 10, 4); ctx.fill(); ctx.stroke();
      if (pk < 30) txt('POP!', 620, 200, 60 - pk, '#ffd23f');
      if (pk > 40) txt('WAAAH', 700 + rand(-1, 1), 270, 22 + Math.sin(t * 0.5) * 3, '#ff5d8f');
      if (pk > 60) { ctx.save(); ctx.translate(W / 2, 120); ctx.rotate(Math.sin(t * 0.08) * 0.04); txt("IT'S A SPERM", 0, 0, 64, '#ffd23f'); ctx.restore(); }
      if (pk > 90) txt('8 lbs, 0 oz. Well, 8 lbs of helmet.', W / 2, 180, 24, '#fff');
      if (pk > 150 && Math.floor(t / 30) % 2 === 0) txt(isTouch ? 'Tap to play again' : 'SPACE to play again', W / 2, 470, 30, '#fff');
    } else {
      // push meter
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(W / 2 - 220, 200, 440, 34, 17); ctx.fill();
      ctx.fillStyle = push > 75 ? '#ff5d8f' : '#ffd23f'; rr(W / 2 - 220, 200, Math.max(34, 440 * push / 100), 34, 17); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3; rr(W / 2 - 220, 200, 440, 34, 17); ctx.stroke();
      const big = 40 + Math.sin(t * 0.3) * 4 + push * 0.2;
      txt(isTouch ? 'TAP TAP TAP TO PUSH!' : 'MASH SPACE TO PUSH!', W / 2, 150, big, push > 75 ? '#ff5d8f' : '#fff');
      if (push > 60) txt(pickOne(['PUSH!', 'PUSH!!', 'BREATHE', 'PUSH!!!']), 200 + rand(-2, 2), 190, 26, '#ff5d8f');
    }
    for (const q of parts) { ctx.globalAlpha = q.life / q.max; E(q.x, q.y, q.r, q.r); ctx.fillStyle = q.c; ctx.fill(); ctx.globalAlpha = 1; }
    drawRadio();
  }

  // ---------- Draw ----------
  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
    const M = MISSIONS[mission];

    if (state === 'title') {
      night(); sea(360); ship(560, 400); chopper(300 + Math.sin(t * 0.02) * 20, 170 + Math.sin(t * 0.08) * 6, { door: true }); rain();
      ctx.save(); ctx.translate(W / 2, 100 + Math.sin(t * 0.05) * 4); ctx.rotate(Math.sin(t * 0.03) * 0.03);
      txt('CUM OF DUTY', 0, 0, 82, '#ffd23f'); ctx.restore();
      txt('~ Wrong Hole ~', W / 2, 165, 36, '#fff');
      if (Math.floor(t / 30) % 2 === 0) txt(isTouch ? 'Tap to deploy' : 'Press SPACE to deploy', W / 2, 250, 32, '#fff');
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(W / 2 - 300, H - 100, 600, 70, 16); ctx.fill();
      txt(isTouch ? 'Hold to swim up · release to sink' : 'Hold SPACE to swim up · release to sink', W / 2, H - 75, 22, '#fff', 'center', null);
      txt('Don\'t touch anything brown. Or purple. Or angry.', W / 2, H - 47, 20, '#ffd23f', 'center', null);
      if (best) txt(`BEST ${best}`, W - 24, 36, 26, '#fff', 'right');
    } else if (state === 'intro') {
      drawIntro();
    } else if (state === 'birth') {
      drawBirth();
    } else {
      // gameplay + overlays
      drawTunnel(M);
      for (const o of objs) drawObj(o);
      if (mission === 1) drawGate(M); else drawEgg(M);
      const p = player;
      if (state === 'play') drawSperm(PX, p.y, 1.15, { helmet: true, rot: clamp(p.vy * 0.07, -0.5, 0.5), ph: p.ph, mouth: hold ? 'o' : undefined });
      else if (state === 'dead') drawSperm(PX, p.y, 1.15, { helmet: true, dead: true, rot: (t - deadT) * 0.05, ph: p.ph });
      else if (state === 'clear') drawSperm(PX + Math.min(400, (t - clearT) * 6), p.y, 1.15, { helmet: true, ph: t * 0.6 });
      else if (state === 'end') { const k = Math.min(1, (t - endT) / 40); drawSperm(M.len - scroll - 100 - k * 10, center(M.len) + Math.sin(t * 0.3) * 4, 1.15, { helmet: true, ph: t * 0.8 }); }
      for (const q of parts) {
        ctx.globalAlpha = q.life / q.max;
        if (q.txt) txt(q.txt, q.x, q.y, 22, q.c);
        else if (q.heart) { heart(q.x, q.y, 7); fs(q.c, INK, 1.2); }
        else if (q.line) { ctx.strokeStyle = q.c; ctx.lineWidth = q.r; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + 40, q.y); ctx.stroke(); }
        else { E(q.x, q.y, q.r, q.r); ctx.fillStyle = q.c; ctx.fill(); }
        ctx.globalAlpha = 1;
      }
      if (flash > 0) { ctx.fillStyle = `rgba(255,40,60,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
      if (pink > 0) { ctx.fillStyle = `rgba(255,120,180,${pink * 0.45 * (0.7 + Math.sin(t * 0.5) * 0.3)})`; ctx.fillRect(0, 0, W, H); }
      if (state === 'play' && t - boostT < BOOST_LEN) {
        const k = Math.min(1, (t - boostT) / 10);
        ctx.save(); ctx.translate(W / 2, 120); ctx.scale(k, k); ctx.rotate(Math.sin(t * 0.3) * 0.05);
        txt('SHE CAME', 0, 0, 74, '#ff5d8f'); ctx.restore();
        txt('sucked in deeper!', W / 2, 175, 30, '#fff');
      }

      // HUD
      txt(`MISSION ${mission}`, 24, 34, 24, '#7ed6df', 'left');
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; rr(24, 52, 260, 14, 7); ctx.fill();
      ctx.fillStyle = '#ffd23f'; rr(24, 52, Math.max(14, 260 * prog), 14, 7); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; rr(24, 52, 260, 14, 7); ctx.stroke();
      txt(mission === 1 ? 'to the exit' : 'to the egg', 290, 59, 18, '#fff', 'left');
      if (mission === 1) { ctx.save(); ctx.translate(34, 92); ctx.beginPath(); ctx.moveTo(0, -10); ctx.quadraticCurveTo(8, 1, 0, 8); ctx.quadraticCurveTo(-8, 1, 0, -10); ctx.closePath(); fs('#5ec8ff', INK, 2); ctx.restore(); }
      else { heart(34, 92, 8); fs('#ff5d8f', INK, 2); }
      txt(`× ${pickups}`, 52, 92, 26, '#ffd23f', 'left');
      if (mission === 2) { for (let i = 0; i < 5; i++) { heart(140 + i * 22, 92, 7); fs(i < streak ? '#ff5d8f' : 'rgba(255,255,255,0.25)', INK, 1.5); } txt('in a row', 258, 92, 16, '#fff', 'left'); }
      txt(`SCORE ${score + Math.floor(scroll / 20) + pickups * 10}`, W - 24, 34, 24, '#fff', 'right');
      const tk = t - titleT;
      if (state === 'play' && tk < 320) {
        ctx.globalAlpha = tk > 260 ? (320 - tk) / 60 : 1;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(24, 118, 520, 96, 10); ctx.fill();
        txt(`MISSION ${mission}`, 40, 142, 20, '#7ed6df', 'left', null);
        txt(M.name.slice(0, Math.floor(tk / 2)), 40, 172, 34, '#fff', 'left', null);
        if (tk > 50) txt('OBJECTIVE: ' + M.obj.slice(0, Math.floor((tk - 50) / 2)), 40, 200, 18, '#ffd23f', 'left', null);
        ctx.globalAlpha = 1;
      }
      if (state === 'play' && isTouch && scroll < 600) txt('hold anywhere to swim up', W / 2, H - 100, 22, '#fff');
      drawRadio();

      if (state === 'dead') {
        const k = t - deadT;
        ctx.fillStyle = `rgba(60,0,10,${clamp(k / 40, 0, 0.75)})`; ctx.fillRect(0, 0, W, H);
        if (k > 20) { txt('YOU DIED', W / 2, 150, 70, '#ff4d6d', 'center', '#3a0010'); }
        if (k > 50) { txt(deathQuote[0], W / 2, 240, 26, '#fff', 'center', null); txt('— ' + deathQuote[1], W / 2, 278, 22, '#ffd23f', 'center', null); }
        if (k > 70 && Math.floor(t / 30) % 2 === 0) txt(isTouch ? `Tap to retry mission ${mission}` : `SPACE to retry mission ${mission}`, W / 2, 400, 30, '#fff');
      } else if (state === 'clear') {
        const k = t - clearT;
        ctx.fillStyle = `rgba(0,0,0,${clamp(k / 60, 0, 0.6)})`; ctx.fillRect(0, 0, W, H);
        if (k > 30) txt('EXTRACTED', W / 2, 150, 70, '#7ed6df');
        if (k > 60) txt('Mission 1 complete. You escaped the butthole.', W / 2, 235, 28, '#fff', 'center', null);
        if (k > 90) txt('Somewhere, a woman is very confused.', W / 2, 272, 24, '#ffd23f', 'center', null);
        if (k > 90 && Math.floor(t / 30) % 2 === 0) txt(isTouch ? 'Tap for Mission 2' : 'SPACE for Mission 2', W / 2, 400, 30, '#fff');
      } else if (state === 'end') {
        const k = t - endT;
        if (k % 8 === 0) parts.push({ x: rand(0, W), y: H + 10, vx: rand(-1, 1), vy: rand(-4, -2), r: rand(4, 8), c: pickOne(['#ff5d8f', '#ffd23f', '#7ed6df', '#fff']), life: 120, max: 120 });
        ctx.fillStyle = `rgba(0,0,0,${clamp(k / 60, 0, 0.55)})`; ctx.fillRect(0, 0, W, H);
        if (k > 30) txt('MISSION COMPLETE', W / 2, 130, 62, '#ffd23f');
        if (k > 70) txt("She's pregnant.", W / 2, 210, 34, '#fff');
        if (k > 110) txt("Congratulations. It's a... you.", W / 2, 258, 28, '#ff5d8f', 'center', null);
        if (k > 150) txt(`SCORE ${score}   ·   BEST ${best}`, W / 2, 310, 26, '#fff', 'center', null);
        if (k > 190) txt('Captain Prick was never seen again. He is still in the butt.', W / 2, 350, 20, '#ffd23f', 'center', null);
        if (k > 120 && Math.floor(t / 30) % 2 === 0) txt(isTouch ? 'Tap to see what happens next' : 'SPACE to see what happens next', W / 2, 440, 30, '#fff');
      }
    }
    if (!isTouch) txt(muted ? 'M: sound off' : 'M: sound on', W - 16, H - 16, 16, 'rgba(255,255,255,0.8)', 'right', null);
  }

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
