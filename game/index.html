<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; height: 100%; background: #ffd6e7; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  // ---------- Setup ----------
  const W = 960, H = 540;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    scale = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
  }
  addEventListener('resize', resize);
  resize();

  const FONT = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
  const INK = '#4a1d3a';
  const SKIN = '#f9c3ad', SKIN2 = '#f3a48c', HEAD = '#f47fa2', HEAD2 = '#e85f8b';
  const ANG = 0.2, SIN = Math.sin(ANG), COS = Math.cos(ANG);
  const TRACK_Y = 200;   // screen y where the slide starts at x = 0
  const PX = 210;        // player position along the slide
  const GRAV = 0.75, JUMP = -14.5;
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const mod = (a, n) => ((a % n) + n) % n;

  let state = 'title', t = 0, overT = 0, scroll = 0;
  let speed, dist, loot, score = 0, best = 0, newBest = false;
  let objs, parts, gap, player, shake = 0, playT = 0;
  let duckKey = false, duckTouch = null;
  const GOAL = 200;                      // eggplants needed to finish a level
  let level = 1, msg = null, winT = 0;
  const JOKES = {
    3: "ooh... it's growing",
    8: "getting harder already?",
    15: "look at you go, big guy",
    25: "that's a big boy now",
    35: "she's gonna feel that one",
    45: "keep stroking, champ",
    55: "throbbing nicely",
    70: "don't stop now",
    85: "harder... HARDER",
    100: "halfway to heaven",
    120: "you're doing amazing, sweetie",
    140: "faster... faster...",
    160: "you're almost there",
    180: "oh god... oh GOD",
    190: "wow, you're about to cum",
    197: "hold it... hold it...",
  };
  const FILLER = ["mmm, that's the spot", "nice girth", "is it in yet?", "so hard right now", "moan for me", "she said don't stop",
    "veiny", "ohhh yes", "right there, right there", "you absolute stallion", "getting slippery", "harder, daddy"];
  const growth = () => 1 + 1.6 * Math.min(loot, GOAL) / GOAL;   // 1x at 0 eggplants, 2.6x at the goal
  function say(text) { msg = { txt: text, life: 150, max: 150 }; }
  function onLoot() {
    if (loot >= GOAL) { win(); return; }
    if (JOKES[loot]) say(JOKES[loot]);
    else if (loot % 15 === 0) say(FILLER[Math.floor(Math.random() * FILLER.length)]);
  }
  try { best = +localStorage.getItem('cc_best') || 0; } catch (e) {}

  function reset() {
    speed = 5.5; dist = 0; loot = 0; objs = []; parts = []; gap = 500; playT = 0; newBest = false; level = 1; msg = null;
    player = { y: 0, vy: 0, jumps: 0, onGround: true, squash: 0, flip: 0, deadRot: 0, deadX: 0, winX: 0, arrived: false };
  }
  reset();

  // ---------- Sound ----------
  let actx = null, muted = false;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f1, f2, d, type, vol, when) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.connect(g); g.connect(a.destination);
    const s = a.currentTime + (when || 0);
    o.frequency.setValueAtTime(f1, s);
    o.frequency.exponentialRampToValueAtTime(f2, s + d);
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(0.001, s + d);
    o.start(s); o.stop(s + d + 0.02);
  }
  function sfx(n) {
    switch (n) {
      case 'jump': tone(320, 640, 0.15, 'square', 0.08); break;
      case 'flip': tone(500, 1200, 0.22, 'square', 0.08); break;
      case 'loot': tone(880, 1400, 0.1, 'triangle', 0.12); break;
      case 'land': tone(160, 90, 0.07, 'triangle', 0.1); break;
      case 'hit': tone(420, 60, 0.5, 'sawtooth', 0.1); break;
      case 'boing': tone(180, 720, 0.25, 'sine', 0.12); tone(720, 300, 0.25, 'sine', 0.1, 0.25); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.02, 0.28, 'triangle', 0.12, i * 0.13)); tone(200, 60, 0.6, 'sine', 0.15, 0.55); break;
    }
  }

  // ---------- Input ----------
  function start() { reset(); state = 'playing'; sfx('boing'); }
  function jump() {
    if (state === 'title') { start(); return; }
    if (state === 'over') { if (t - overT > 35) start(); return; }
    if (state === 'win') { if (player.arrived && t - winT > 60) nextLevel(); return; }
    const p = player;
    if (p.jumps < 2) {
      p.vy = p.jumps ? JUMP * 0.85 : JUMP;
      if (p.jumps === 1) { p.flip = 0.001; sfx('flip'); } else sfx('jump');
      p.jumps++; p.onGround = false;
      dust(PX - 10, 0, 4);
    }
  }
  addEventListener('keydown', e => {
    audio();
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) jump(); }
    if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); duckKey = true; }
    if (e.code === 'KeyM') muted = !muted;
  });
  addEventListener('keyup', e => { if (['ArrowDown', 'KeyS'].includes(e.code)) duckKey = false; });
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W;
    if (state !== 'playing') { jump(); return; }
    if (x < W * 0.4) duckTouch = e.pointerId; else jump();
  });
  const release = e => { if (duckTouch === e.pointerId) duckTouch = null; };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);

  // ---------- Spawning ----------
  function pick(pool) {
    let sum = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * sum;
    for (const [n, w] of pool) { if ((r -= w) < 0) return n; }
    return pool[0][0];
  }
  const makeLoot = (x, y) => ({ type: 'eggplant', x, y, w: 18, h: 26, pad: 0, seed: Math.random() * 6 });
  function spawn() {
    const x = 1150;
    const pool = [['cactus', 3], ['trap', 3]];
    if (dist > 90) pool.push(['crab', 1.5]);
    if (dist > 140) pool.push(['bee', 2]);
    if (dist > 260) pool.push(['tall', 1.5]);
    const type = pick(pool);
    const size = { cactus: [56, 44, 8], trap: [48, 40, 6], crab: [70, 44, 10], tall: [56, 86, 8], bee: [52, 30, 6] }[type];
    const o = { type, x, w: size[0], h: size[1], pad: size[2], y: type === 'bee' ? 42 : 0, baseY: 42, seed: Math.random() * 6 };
    objs.push(o);
    if (type !== 'bee' && Math.random() < 0.8) {
      const top = o.h + 48;
      for (let i = -2; i <= 2; i++) objs.push(makeLoot(x + o.w / 2 - 9 + i * 38, top - i * i * 9));
    }
    if (Math.random() < 0.85) {
      for (let i = 0; i < 6; i++) objs.push(makeLoot(x + 220 + i * 40, 8));
    }
  }

  // ---------- Particles ----------
  const CONFETTI = ['#ff5d8f', '#ffd23f', '#7ed6df', '#b28cff', '#ff9f43', '#fff'];
  function dust(x, y, n) {
    for (let i = 0; i < n; i++) parts.push({ k: 'd', x: x + rand(-8, 8), y: y - rand(0, 6), vx: -speed * 0.5 + rand(-1, 1), vy: rand(-1.2, -0.2), r: rand(3, 6), life: 25, max: 25 });
  }
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) parts.push({ k: 'c', x, y, vx: rand(-5, 5), vy: rand(-7, -1), rot: rand(0, 6), vr: rand(-0.2, 0.2), c: CONFETTI[i % CONFETTI.length], heart: i % 3 === 0, life: 110, max: 110 });
  }
  function sparkle(x, y) {
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; parts.push({ k: 's', x, y, vx: Math.cos(a) * 3 - speed, vy: Math.sin(a) * 3, life: 20, max: 20 }); }
    parts.push({ k: 'p', x, y: y - 10, vx: -speed * 0.5, vy: -1.5, txt: '+10', life: 40, max: 40 });
  }

  function win() {
    state = 'win'; winT = t; msg = null; objs = []; duckTouch = null;
    const p = player; p.y = 0; p.vy = 0; p.winX = 0; p.arrived = false; p.flip = 0; p.jumps = 0; p.onGround = true;
    sfx('win');
  }
  function nextLevel() {
    level++; loot = 0; objs = []; gap = 600; playT = 0; msg = null;
    const p = player; p.y = 0; p.vy = 0; p.winX = 0; p.arrived = false;
    state = 'playing'; sfx('boing');
    say(`LEVEL ${level} — she wants more`);
  }
  function die() {
    state = 'over'; overT = t; shake = 16;
    const p = player; p.vy = -11; p.deadRot = 0; p.deadX = 0;
    burst(PX, p.y - 35, 22);
    sfx('hit');
    score = Math.floor(dist) + loot * 10 + (level - 1) * GOAL * 10;
    if (score > best) { best = score; newBest = true; try { localStorage.setItem('cc_best', best); } catch (e) {} }
  }

  // ---------- Update ----------
  function update() {
    t++;
    const p = player;
    if (state === 'playing') {
      playT++;
      speed = Math.min(11 + (level - 1) * 1.5, 5.5 + (level - 1) * 1.5 + dist * 0.01);
      scroll += speed; dist += speed / 30;
      const duck = duckKey || duckTouch !== null;
      p.duck = duck;
      p.vy += GRAV + (duck && !p.onGround ? 1.4 : 0);
      p.y += p.vy;
      if (p.y >= 0) {
        if (!p.onGround) { p.squash = 1; dust(PX - 10, 0, 6); sfx('land'); }
        p.y = 0; p.vy = 0; p.onGround = true; p.jumps = 0; p.flip = 0;
      }
      if (p.flip > 0) p.flip = Math.min(1, p.flip + 0.045);
      if (p.onGround && t % 6 === 0) dust(PX - 14, 0, 1);

      gap -= speed;
      if (gap <= 0) { spawn(); gap = rand(560, 860) + speed * 18; }
      for (const o of objs) {
        o.x -= speed + (o.type === 'crab' ? 1.8 : 0);
        if (o.type === 'bee') o.y = o.baseY + Math.sin(t * 0.08 + o.seed) * 5;
      }
      objs = objs.filter(o => o.x > -150 && !o.got);

      const ducking = duck && p.onGround;
      const g = 1;   // hitbox stays the same size no matter how big the art gets
      const ph = ducking ? 34 : 68 * g;
      const L = PX - 20 * g, R = PX + 22 * g, T = p.y - ph, B = p.y - 2;
      for (const o of objs) {
        const pad = o.pad ?? 6;
        const ol = o.x + pad, or = o.x + o.w - pad, ot = -(o.y + o.h) + pad, ob = -o.y;
        if (R > ol && L < or && B > ot && T < ob) {
          if (o.type === 'eggplant') { o.got = true; loot++; sparkle(o.x + 9, -o.y - 12); sfx('loot'); onLoot(); if (state !== 'playing') break; }
          else { die(); break; }
        }
      }
    } else if (state === 'title') {
      scroll += 4; speed = 4;
    } else if (state === 'over') {
      p.vy += 0.6; p.y += p.vy; p.deadRot += 0.2; p.deadX += 2;
    } else if (state === 'win') {
      speed = 3; scroll += speed;
      const target = BOOTY_X - PX - 62 * growth();
      if (!p.arrived) {
        p.winX = Math.min(target, p.winX + 5);
        if (p.winX >= target) { p.arrived = true; winT = t; shake = 18; sfx('boing'); burst(BOOTY_X, -90, 40); }
        if (t % 4 === 0) dust(PX + p.winX - 14, 0, 2);
      } else {
        if (t % 10 === 0) parts.push({ k: 'c', x: BOOTY_X + rand(-70, 70), y: rand(-160, -40), vx: rand(-1, 1), vy: rand(-3, -1), rot: 0, vr: 0, c: '#ff5d8f', heart: true, life: 80, max: 80 });
        if (t % 5 === 0) { const j = JOKE_RAIN[Math.floor(rand(0, JOKE_RAIN.length))]; if (t % 90 === 0) parts.push({ k: 'p', x: rand(100, 800), y: rand(-200, -60), vx: 0, vy: -1, txt: j, life: 60, max: 60 }); }
      }
    }
    if (msg && --msg.life <= 0) msg = null;
    p.squash *= 0.82;

    for (const q of parts) {
      q.x += q.vx; q.y += q.vy; q.life--;
      if (q.k === 'c') { q.vy = Math.min(1.2, q.vy + 0.12); q.vx *= 0.97; q.rot += q.vr; }
      if (q.k === 'd') q.r += 0.4;
      if (q.k === 's') { q.vx *= 0.9; q.vy *= 0.9; }
    }
    parts = parts.filter(q => q.life > 0);
  }

  const BOOTY_X = 700;   // where the prize sits on the slide during the win screen
  const JOKE_RAIN = ['ohhh', 'yes!', 'mmm', 'again?', 'wow', '♥'];

  // ---------- Drawing helpers ----------
  function E(x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); }
  function fs(fill, stroke = INK, lw = 2.5) { ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
  function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s);
    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.2, x - s * 0.6, y - s * 1.2, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.4, y - s * 0.2, x, y + s);
    ctx.closePath();
  }
  function txt(s, x, y, size, fill = '#fff', align = 'center', stroke = INK) {
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = fill; ctx.fillText(s, x, y);
  }

  function drawDick(x, y, s, o = {}) {

    const sy = (1 - sq * 0.3) * (duck ? (o.dk || 0.52) : 1), sx = (1 + sq * 0.2) * (duck ? 1.25 : 1);

    E(5, -60, 3.2, 2); fs('#fff', null);

    if (o.dead) {
      ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
      [[-6, -34], [6, -34]].forEach(([ex, ey]) => { ctx.beginPath(); ctx.moveTo(ex - 3, ey - 3); ctx.lineTo(ex + 3, ey + 3); ctx.moveTo(ex + 3, ey - 3); ctx.lineTo(ex - 3, ey + 3); ctx.stroke(); });

      });

    ctx.restore();
  }

  // The prize at the end of the slide: a cartoon booty in a pink thong.
  function drawBooty(x, by, s, jiggle) {
    ctx.save(); ctx.translate(x, by); ctx.scale(s * (1 + jiggle * 0.06), s * (1 - jiggle * 0.06));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    rr(-64, -78, 50, 80, 20); fs(SKIN); rr(14, -78, 50, 80, 20); fs(SKIN);

    E(0, -190, 52, 14); fs(SKIN2, null);
    // cheeks
    E(-34, -104, 46, 52); fs(SKIN);
    E(34, -104, 46, 52); fs(SKIN);
    ctx.strokeStyle = SKIN2; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -140); ctx.quadraticCurveTo(-3, -100, 0, -56); ctx.stroke();

    E(-52, -124, 7, 4.5); fs('rgba(255,255,255,0.75)', null); E(16, -124, 7, 4.5); fs('rgba(255,255,255,0.75)', null);
    ctx.restore();
  }

  function drawObj(o) {
    const x = o.x, by = -o.y;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    switch (o.type) {
      case 'cactus': cactus(x, by, o.w, o.h); break;
      case 'tall': cactus(x, by, o.w, o.h); break;
      case 'trap': {
        rr(x, by - 12, 48, 12, 3); fs('#c98b4b');
        ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x + 4, by - 6); ctx.lineTo(x + 44, by - 6); ctx.stroke();
        ctx.strokeStyle = '#7c8794'; ctx.lineWidth = 3;
        ctx.beginPath(); for (let i = 0; i < 5; i++) ctx.arc(x + 8 + i * 4, by - 16, 3, Math.PI, 0); ctx.stroke();
        ctx.strokeStyle = '#5c6670'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(x + 42, by - 12); ctx.lineTo(x + 42, by - 36); ctx.lineTo(x + 14, by - 40 + Math.sin(t * 0.2 + o.seed) * 2); ctx.stroke();
        poly([x + 24, by - 12, x + 38, by - 12, x + 36, by - 24]); fs('#ffd23f', INK, 1.5);
        ctx.fillStyle = '#f0a91d'; [[x + 30, by - 16], [x + 34, by - 20]].forEach(([cx, cy]) => { E(cx, cy, 1.5, 1.5); ctx.fill(); });
        break;
      }
      case 'crab': {
        const cx = x + 35, cy = by - 16, run = t * 0.5;
        ctx.strokeStyle = '#d6362e'; ctx.lineWidth = 4;
        for (let i = 0; i < 3; i++) {
          const sw = Math.sin(run + i * 1.5) * 5;
          ctx.beginPath(); ctx.moveTo(cx - 18, cy + i * 2); ctx.lineTo(cx - 32 + sw, by - 1); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx + 18, cy + i * 2); ctx.lineTo(cx + 32 - sw, by - 1); ctx.stroke();
        }
        E(cx, cy, 26, 15); fs('#f04e3e');
        E(cx, cy + 4, 18, 7); fs('#ff7b6b', null);
        const pinch = Math.abs(Math.sin(t * 0.15 + o.seed)) * 0.5;
        [[-1, cx - 30], [1, cx + 30]].forEach(([d, px]) => {
          ctx.save(); ctx.translate(px, cy - 14); ctx.rotate(d * (0.3 - pinch));
          E(0, 0, 9, 7); fs('#f04e3e'); poly([d * 6, -5, d * 16, -2, d * 6, 1]); fs('#f04e3e');
          ctx.restore();
        });
        ctx.strokeStyle = INK; ctx.lineWidth = 2;
        [[cx - 8], [cx + 8]].forEach(([ex]) => {
          ctx.beginPath(); ctx.moveTo(ex, cy - 10); ctx.lineTo(ex, cy - 24); ctx.stroke();
          E(ex, cy - 26, 4.5, 4.5); fs('#fff', INK, 1.5); E(ex - 1.5, cy - 26, 2, 2); fs(INK, null);
        });
        ctx.beginPath(); ctx.moveTo(cx - 6, cy - 2); ctx.quadraticCurveTo(cx, cy + 1, cx + 6, cy - 2); ctx.stroke();
        break;
      }
      case 'bee': {
        const cx = x + 28, cy = by - 15, f = Math.sin(t * 0.7 + o.seed);
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.1);
        E(5, -12 - f * 3, 10, 5, 0.3); fs('rgba(255,255,255,0.85)', INK, 1.5);
        E(-7, -12 + f * 3, 10, 5, -0.3); fs('rgba(255,255,255,0.85)', INK, 1.5);
        E(0, 0, 20, 12); fs('#ffd23f');
        ctx.save(); E(0, 0, 20, 12); ctx.clip(); ctx.fillStyle = INK;
        ctx.fillRect(-9, -13, 7, 26); ctx.fillRect(4, -13, 7, 26); ctx.restore();
        E(0, 0, 20, 12); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
        poly([18, -3, 30, 0, 18, 3]); fs(INK, null);
        E(-20, -3, 9, 8); fs('#ffd23f');
        E(-23, -4, 3.2, 3.5); fs('#fff', INK, 1.4); E(-24, -4, 1.5, 1.6); fs(INK, null);
        ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(-24, -10); ctx.lineTo(-30, -17); ctx.moveTo(-19, -10); ctx.lineTo(-19, -18); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-26, 0); ctx.quadraticCurveTo(-23, 3, -20, 0); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'eggplant': {
        const cx = x + 9, cy = by - 13 + Math.sin(t * 0.12 + o.seed) * 3;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(0.45);
        E(0, 2, 7, 11.5); fs('#7a3fb5', INK, 2);
        E(-2.5, 2, 2.2, 6); fs('#a76ad9', null);
        poly([-6, -8, 0, -14, 6, -8, 3, -6, 0, -8, -3, -6]); fs('#57b947', INK, 1.5);
        ctx.strokeStyle = '#3f8f32'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(3, -18); ctx.stroke();
        ctx.restore();
        break;
      }
    }
  }
  function cactus(x, by, w, h) {
    const cx = x + w / 2;
    const arm = (ax, ah, dir) => {
      ctx.beginPath(); ctx.moveTo(cx + dir * 8, by - ah + 4); ctx.lineTo(ax, by - ah + 4); ctx.lineTo(ax, by - ah - 14);
      ctx.strokeStyle = INK; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.strokeStyle = '#4fb356'; ctx.lineWidth = 10; ctx.stroke();
    };
    arm(x + 8, h * 0.6, -1); arm(x + w - 8, h * 0.75, 1);
    rr(cx - 11, by - h, 22, h, 11); fs('#4fb356');
    ctx.strokeStyle = '#2f7d34'; ctx.lineWidth = 1.5;
    for (let yy = by - h + 10; yy < by - 4; yy += 8) { ctx.beginPath(); ctx.moveTo(cx - 6, yy); ctx.lineTo(cx - 3, yy + 3); ctx.moveTo(cx + 6, yy + 2); ctx.lineTo(cx + 3, yy + 5); ctx.stroke(); }
    E(cx, by - h - 2, 6, 5); fs('#ff5d8f', INK, 1.5); E(cx, by - h - 2, 2, 2); fs('#ffd23f', null);
  }

  function hills(base, amp, freq, off, color) {
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) {
      const u = x + off;
      ctx.lineTo(x, base + Math.sin(u * freq) * amp + Math.sin(u * freq * 2.3 + 1) * amp * 0.4);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }

  // The namesake: a little carousel of dicks spinning in the distance.
  function drawCarousel(cx, gy) {
    const riders = [];
    for (let i = 0; i < 6; i++) {
      const a = t * 0.02 + i * Math.PI / 3;
      riders.push({ x: cx + Math.cos(a) * 60, z: Math.sin(a), bob: Math.sin(t * 0.08 + i * 1.3) * 6, dir: -Math.sin(a), i });
    }
    riders.sort((a, b) => a.z - b.z);
    E(cx, gy, 84, 15); fs('#8e5bd6');
    E(cx, gy - 4, 84, 13); fs('#a97be8');
    const rider = r => {
      ctx.strokeStyle = '#e8b830'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(r.x, gy - 108); ctx.lineTo(r.x, gy - 6); ctx.stroke();
      drawDick(r.x, gy - 22 + r.bob, 0.48 * (0.85 + 0.15 * r.z), { mirror: r.dir < 0, seed: r.i * 40 });
    };
    riders.filter(r => r.z < 0).forEach(rider);
    ctx.fillStyle = '#e8b830'; ctx.fillRect(cx - 5, gy - 112, 10, 108);
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(cx - 5, gy - 112, 10, 108);
    riders.filter(r => r.z >= 0).forEach(rider);
    const top = gy - 170, rim = gy - 110;
    for (let i = 0; i < 8; i++) {
      poly([cx, top, cx - 92 + i * 23, rim, cx - 92 + (i + 1) * 23, rim]);
      fs(i % 2 ? '#fff6e0' : '#ff5d8f', null);
    }
    poly([cx, top, cx - 92, rim, cx + 92, rim]); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(cx - 81 + i * 23, rim, 11.5, 0, Math.PI); fs(i % 2 ? '#fff6e0' : '#ff5d8f'); }
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, top - 22); ctx.stroke();
    poly([cx, top - 22, cx + 18 + Math.sin(t * 0.15) * 3, top - 17, cx, top - 12]); fs('#ffd23f', INK, 1.5);
  }

  // ---------- Draw ----------
  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (shake > 0) { ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5); shake *= 0.9; if (shake < 0.5) shake = 0; }

    // candy sky
    const SKIES = [['#ff9ec4', '#ffd6e7', '#fff0d6'], ['#ff7a9e', '#ffb3c9', '#ffe0a8'], ['#c96bff', '#ff9ec4', '#ffd6e7'], ['#ff5d8f', '#ff9ec4', '#ffd23f']];
    const sky = SKIES[(level - 1) % SKIES.length];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sky[0]); g.addColorStop(0.55, sky[1]); g.addColorStop(1, sky[2]);
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

    // sun
    ctx.save(); ctx.translate(840, 80); ctx.rotate(t * 0.005);
    ctx.fillStyle = '#ffe27a';
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); poly([-7, -50, 7, -50, 0, -70]); ctx.fill(); }
    ctx.restore();
    E(840, 80, 40, 40); fs('#ffd23f', '#f0a91d', 3);
    ctx.strokeStyle = '#f0a91d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(840, 84, 18, 0.3, Math.PI - 0.3); ctx.stroke();
    E(830, 72, 3, 3); fs('#f0a91d', null); E(850, 72, 3, 3); fs('#f0a91d', null);

    // clouds
    [[100, 70, 1], [420, 50, 0.7], [700, 130, 1.2], [1000, 90, 0.9]].forEach(([cx, cy, s]) => {
      const x = mod(cx - scroll * 0.06 * s, W + 300) - 150;
      ctx.fillStyle = '#ffffff';
      [[0, 0, 28], [26, -12, 30], [52, 0, 26], [26, 6, 26]].forEach(([dx, dy, r]) => { E(x + dx * s, cy + dy * s, r * s, r * s * 0.8); ctx.fill(); });
    });

    hills(330, 22, 0.006, scroll * 0.12, '#c9a2ff');
    const cx = mod(1100 - scroll * 0.18, 2000) - 300;
    if (cx > -200 && cx < W + 200) drawCarousel(cx, 352);
    hills(430, 18, 0.009, scroll * 0.3, '#a877f5');
    hills(500, 10, 0.014, scroll * 0.55, '#8c5ce0');

    // slide supports
    for (let k = -1; k < 6; k++) {
      const lx = mod(-scroll, 300) + k * 300;
      const sx = lx * COS - 22 * SIN, sy = TRACK_Y + lx * SIN + 22 * COS;
      ctx.fillStyle = '#3aa6d8'; ctx.fillRect(sx - 8, sy, 16, H - sy + 20);
      ctx.fillStyle = '#7fd0f0'; ctx.fillRect(sx - 8, sy, 5, H - sy + 20);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.strokeRect(sx - 8, sy, 16, H - sy + 20);
    }

    // --- slide space ---
    ctx.save();
    ctx.translate(0, TRACK_Y); ctx.rotate(ANG);

    ctx.fillStyle = '#c93d7a'; ctx.fillRect(-200, -12, 1500, 6);

    for (const o of objs) drawObj(o);

    const p = player;
    if (state === 'playing' && speed > 8.5) {
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const lx = PX - 40 - mod(t * speed * 0.8 + i * 97, 180), ly = p.y - 12 - i * 12;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - 26, ly); ctx.stroke();
      }
    }
    const gsz = state === 'title' ? 1 : growth();
    if (state === 'over') {
      drawDick(PX + p.deadX, p.y, gsz, { rot: p.deadRot, dead: true, flap: true });
    } else if (state === 'win') {
      const jig = p.arrived ? Math.sin((t - winT) * 0.5) * Math.max(0, 1 - (t - winT) / 60) : 0;
      drawBooty(BOOTY_X, 0, 1.1, jig);
      const hump = p.arrived ? Math.abs(Math.sin((t - winT) * 0.25)) * 6 : 0;
      drawDick(PX + p.winX + hump, p.y, gsz, { flap: !p.arrived, squash: p.arrived ? 0.3 : 0 });
    } else {
      const bob = state === 'title' ? Math.sin(t * 0.1) * 1.5 : 0;
      const air = !p.onGround;
      const rot = p.flip > 0 ? p.flip * Math.PI * 2 : (air ? Math.max(-0.4, Math.min(0.4, p.vy * 0.025)) : 0);
      drawDick(PX, p.y + bob, gsz, { squash: p.squash, duck: p.duck && p.onGround, dk: 0.52 / gsz, flap: air, rot });
    }

    // front wall of the chute
    ctx.save();
    ctx.beginPath(); ctx.rect(-200, -8, 1500, 30); ctx.clip();
    ctx.fillStyle = '#ff5d8f'; ctx.fillRect(-200, -8, 1500, 30);
    ctx.fillStyle = '#ffd23f';
    for (let sx = -200 - mod(scroll, 70); sx < 1300; sx += 70) poly([sx, -8, sx + 26, -8, sx + 12, 22, sx - 14, 22]), ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffb3c9'; ctx.fillRect(-200, -9, 1500, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-200, -9); ctx.lineTo(1300, -9); ctx.moveTo(-200, 22); ctx.lineTo(1300, 22); ctx.stroke();

    // particles
    for (const q of parts) {
      const a = Math.max(0, q.life / q.max);
      ctx.globalAlpha = a;
      if (q.k === 'd') { E(q.x, q.y, q.r, q.r); ctx.fillStyle = '#ffffff'; ctx.fill(); }
      else if (q.k === 'c') {
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        if (q.heart) { heart(0, 0, 6); fs(q.c, INK, 1); } else { rr(-6, -3, 12, 6, 2); fs(q.c, INK, 1); }
        ctx.restore();
      }
      else if (q.k === 's') { E(q.x, q.y, 3, 3); ctx.fillStyle = '#fff27a'; ctx.fill(); }
      else if (q.k === 'p') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(-ANG); txt(q.txt, 0, 0, 22, '#ffd23f'); ctx.restore(); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // --- HUD / screens ---
    if (state === 'playing') {
      txt(`${Math.floor(dist)} m`, 24, 36, 36, '#fff', 'left');
      ctx.save(); ctx.translate(36, 82); ctx.rotate(0.45);
      E(0, 2, 6, 10); fs('#7a3fb5', INK, 2); poly([-5, -7, 0, -12, 5, -7]); fs('#57b947', INK, 1.5); ctx.restore();
      txt(`× ${loot} / ${GOAL}`, 54, 82, 28, '#ffd23f', 'left');
      txt(`BEST ${best}`, W - 24, 36, 26, '#fff', 'right');
      txt(`LEVEL ${level}`, W - 24, 70, 24, '#ffd23f', 'right');
      // progress bar to the prize
      ctx.fillStyle = 'rgba(74,29,58,0.5)'; rr(24, 108, 200, 12, 6); ctx.fill();
      ctx.fillStyle = '#ff5d8f'; rr(24, 108, Math.max(12, 200 * Math.min(1, loot / GOAL)), 12, 6); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; rr(24, 108, 200, 12, 6); ctx.stroke();
      if (isTouch && playT < 200) {
        ctx.globalAlpha = Math.min(1, (200 - playT) / 40);
        txt('hold here to duck', W * 0.2, H - 30, 22, '#fff');
        txt('tap here to jump', W * 0.72, H - 30, 22, '#fff');
        ctx.globalAlpha = 1;
      }
    } else if (state === 'title') {
      ctx.save(); ctx.translate(W / 2, 100 + Math.sin(t * 0.05) * 4); ctx.rotate(Math.sin(t * 0.03) * 0.03);
      txt('COCK CAROUSEL', 0, 0, 80, '#ffd23f');
      ctx.restore();
      txt('~ Slide Rush ~', W / 2, 164, 36, '#fff');
      if (Math.floor(t / 30) % 2 === 0) txt(isTouch ? 'Tap to start!' : 'Press SPACE to start!', W / 2, 250, 32, '#fff');
      ctx.fillStyle = 'rgba(74,29,58,0.78)'; rr(W / 2 - 310, H - 118, 620, 96, 18); ctx.fill();
      const jumpTxt = isTouch ? 'Tap right side to jump (tap again mid-air to flip!)' : 'SPACE / ↑  to jump  (press twice for a flip!)';
      const duckTxt = isTouch ? 'Hold left side to duck · eggplants make you grow' : '↓  to duck under bees  ·  eggplants make you GROW';
      txt(jumpTxt, W / 2, H - 88, 22, '#fff', 'center', null);
      txt(duckTxt, W / 2, H - 52, 22, '#ffd23f', 'center', null);
      if (best) txt(`BEST ${best}`, W - 24, 36, 26, '#fff', 'right');
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H);
      rr(W / 2 - 230, 90, 460, 260, 26); fs('#fff6e0', INK, 4);
      txt('OUCH!!', W / 2, 142, 62, '#ff5d8f');
      txt(`${Math.floor(dist)} m  ·  ${loot} eggplants`, W / 2, 202, 28, INK, 'center', null);
      txt(`SCORE ${score}`, W / 2, 245, 40, '#ffd23f');
      txt(newBest ? '★ NEW BEST! ★' : `Best ${best}`, W / 2, 290, 26, newBest ? '#e8628b' : INK, 'center', null);
      if (t - overT > 35 && Math.floor(t / 30) % 2 === 0)
        txt(isTouch ? 'Tap to slide again' : 'SPACE to slide again', W / 2, 395, 30, '#fff');
    }
    else if (state === 'win') {
      txt(`LEVEL ${level}`, W - 24, 36, 26, '#ffd23f', 'right');
      if (p.arrived) {
        const k = Math.min(1, (t - winT) / 12);
        ctx.save(); ctx.translate(W / 2, 110); ctx.scale(k, k); ctx.rotate(Math.sin(t * 0.08) * 0.04);
        txt('YOU MADE IT!!', 0, 0, 72, '#ffd23f');
        ctx.restore();
        txt(`level ${level} complete  ·  ${GOAL} eggplants deep`, W / 2, 168, 26, '#fff');
        if (t - winT > 60 && Math.floor(t / 30) % 2 === 0)
          txt(isTouch ? 'Tap to go again (she wants more)' : 'SPACE to go again (she wants more)', W / 2, H - 60, 30, '#fff');
      } else {
        txt('ohhh here it comes...', W / 2, 110, 44, '#ffd23f');
      }
    }
    // milestone jokes
    if (msg && (state === 'playing' || state === 'win')) {
      const k = Math.min(1, (msg.max - msg.life) / 8), a = Math.min(1, msg.life / 30);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 150); ctx.scale(k, k); ctx.rotate(Math.sin(t * 0.1) * 0.03);
      txt(msg.txt, 0, 0, 40, '#ffd23f');
      ctx.restore();
    }
    if (!isTouch) txt(muted ? 'M: sound off' : 'M: sound on', W - 16, H - 16, 16, '#fff', 'right', null);
  }

  // ---------- Loop (fixed 60fps step) ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
