<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cum of Duty: Wrong Hole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1530; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  // ---------- Setup ----------
  const W = 960, H = 540;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    scale = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  }
  addEventListener('resize', resize); resize();

  const FONT = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
  const INK = '#3a1230';
  const CREAM = '#fdf6e3';
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const rand = (a, b) => a + Math.random() * (b - a);
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pickOne = a => a[Math.floor(Math.random() * a.length)];

  const PX = 220;                 // player screen x
  const PR = 15;                  // player radius
  let t = 0, state = 'title';
  let scene = 0, sf = 0;          // intro scene + frame within scene
  let mission = 1, scroll = 0, speed = 5, prog = 0, player, objs = [], parts = [], hold = false;
  let deadT = 0, clearT = 0, endT = 0, briefT = 0, score = 0, best = 0, pickups = 0, nextSpawn = 0, shake = 0, flash = 0;
  let radio = null, radioQ = [], fired = new Set(), deathQuote = '', farted = false;
  try { best = +localStorage.getItem('cod_best') || 0; } catch (e) {}

  const MISSIONS = {
    1: { name: 'OPERATION BROWN EYE', obj: 'Get out of the butthole.', len: 11000, wall: '#7d4034', inner: '#d3867a', deep: '#b76b60', pick: 'lube drops' },
    2: { name: 'OVULATION STATION', obj: 'Reach the egg. Make a baby.', len: 12500, wall: '#b03a5e', inner: '#ff9ec4', deep: '#f07aa8', pick: 'hearts' },
  };
  const SCRIPT = {
    1: [
      [0.02, 'PRICK', "Swimmer, you're in the rectum. Swim toward the light."],
      [0.12, 'PRICK', 'Watch the corn. It never digests. Ever.'],
      [0.24, 'SWIMMER', 'Captain, something just farted on me.'],
      [0.28, 'PRICK', "That's the enemy, son. Hold your breath."],
      [0.4, 'PRICK', "Hemorrhoids on the walls. Don't touch the angry grapes."],
      [0.55, 'PRICK', "You're doing great. This is still the wrong hole."],
      [0.68, 'SWIMMER', 'Is that... a peanut?'],
      [0.72, 'PRICK', 'She had pad thai. Keep moving.'],
      [0.86, 'PRICK', 'Sphincter ahead. Wait for it to open. Do NOT get clenched.'],
      [0.95, 'PRICK', "Almost out. Don't look back. Seriously. Don't."],
    ],
    2: [
      [0.02, 'PRICK', 'Good news: right hole. Bad news: 200 million other guys had the same idea.'],
      [0.18, 'PRICK', "White blood cells inbound. They think you're an infection. Rude."],
      [0.33, 'PRICK', 'Mucus wall. Push through it like your father would.'],
      [0.48, 'SWIMMER', "Captain, it's getting tight."],
      [0.52, 'PRICK', "That's the cervix, son. Everyone's first time is tight."],
      [0.64, 'PRICK', 'Spermicide clouds. Purple means death. Like a grape.'],
      [0.77, 'PRICK', 'Copper wire ahead. She said she had an IUD. Dodge it anyway.'],
      [0.9, 'PRICK', 'Ovulation Station in sight. This is it. Make your father proud.'],
      [0.97, 'EGG', 'come here, big boy'],
    ],
  };
  const TAUNTS = ['later, loser', 'my dad is a lawyer', 'see you at the egg. jk you won\'t', 'nice tail. did your mom pick it?', 'swim faster, grandpa'];
  const QUOTES = [
    ["'Life... uh... finds a way.'", 'Dr. Ian Malcolm, probably'],
    ["'Every sperm is sacred.'", 'some monks'],
    ["'You miss 100% of the eggs you don\'t swim to.'", 'Wayne Gretzky. Michael Scott.'],
    ["'Never go in dry.'", 'Captain Prick'],
    ["'It\'s not the size of the sperm, it\'s the motion of the tail.'", 'nobody, ever'],
    ["'PULL OUT. PULL OUT.'", 'Captain Prick, ignored'],
    ["'The only easy day was yesterday. Yesterday you were in a ball.'", 'Navy SEALs, ish'],
    ["'He died as he lived: in someone\'s butt.'", 'his eulogy'],
    ["'Two hundred million went in. Zero came out. Including you.'", 'after-action report'],
  ];
  const PICK_LINES = { 5: 'that\'s the good lube', 15: 'slippery when wet', 30: 'you\'re basically a fish now', 50: 'ok you can stop collecting and start escaping' };

  // ---------- Sound ----------
  let actx = null, muted = false;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f1, f2, d, type, vol, when) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.connect(g); g.connect(a.destination);
    const s = a.currentTime + (when || 0);
    o.frequency.setValueAtTime(f1, s); o.frequency.exponentialRampToValueAtTime(f2, s + d);
    g.gain.setValueAtTime(vol, s); g.gain.exponentialRampToValueAtTime(0.001, s + d);
    o.start(s); o.stop(s + d + 0.02);
  }
  function sfx(n) {
    switch (n) {
      case 'pick': tone(880, 1400, 0.1, 'triangle', 0.1); break;
      case 'die': tone(300, 40, 0.6, 'sawtooth', 0.12); break;
      case 'fart': tone(120, 60, 0.4, 'sawtooth', 0.08); tone(90, 50, 0.3, 'square', 0.05, 0.1); break;
      case 'radio': tone(1200, 900, 0.05, 'square', 0.04); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.02, 0.28, 'triangle', 0.12, i * 0.13)); break;
      case 'chop': tone(70, 60, 0.08, 'square', 0.03); break;
      case 'blip': tone(600, 900, 0.06, 'square', 0.05); break;
    }
  }

  // ---------- Radio ----------
  function say(who, text, dur) { radioQ.push({ who, text, dur: dur || Math.max(150, 40 + text.length * 4), f: 0 }); }
  function radioTick() {
    if (!radio && radioQ.length) { radio = radioQ.shift(); sfx('radio'); }
    if (radio && ++radio.f > radio.dur) radio = null;
  }
  function drawRadio() {
    if (!radio) return;
    const shown = radio.text.slice(0, Math.floor(radio.f * 1.4));
    const names = { PRICK: 'Capt. Prick', SWIMMER: 'Sgt. Swimmer', RIVAL: 'Some Other Sperm', EGG: 'The Egg' };
    const cols = { PRICK: '#ffd23f', SWIMMER: '#7ed6df', RIVAL: '#ff9f43', EGG: '#ff5d8f' };
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(W / 2 - 400, H - 78, 800, 58, 12); ctx.fill();
    txt(names[radio.who] + ':', W / 2 - 384, H - 49, 20, cols[radio.who], 'left', null);
    txt(shown, W / 2 - 384 + ctx.measureText(names[radio.who] + ': ').width + 8, H - 49, 20, '#fff', 'left', null);
  }

  // ---------- Tunnel ----------
  const center = wx => H / 2 + Math.sin(wx * 0.0035) * 85 + Math.sin(wx * 0.0111 + 2) * 35;
  const halfH = wx => (mission === 2 ? 135 : 150) + Math.sin(wx * 0.0027 + 1) * 22;

  // ---------- Mission flow ----------
  function startMission(m) {
    mission = m; scroll = 0; speed = 4.5; prog = 0; objs = []; parts = []; pickups = 0; nextSpawn = 700; radio = null; radioQ = []; fired = new Set(); farted = false; shake = 0; flash = 0;
    player = { y: H / 2, vy: 0, ph: 0 };
    state = 'play';
  }
  function die(why) {
    if (state !== 'play') return;
    state = 'dead'; deadT = t; shake = 14; flash = 1; radio = null; radioQ = [];
    deathQuote = pickOne(QUOTES); sfx('die');
    for (let i = 0; i < 16; i++) parts.push({ x: PX, y: player.y, vx: rand(-4, 4), vy: rand(-5, 2), r: rand(3, 6), c: CREAM, life: 50, max: 50 });
    score += Math.floor(scroll / 20) + pickups * 10;
  }
  function tap() {
    audio();
    switch (state) {
      case 'title': state = 'intro'; scene = 0; sf = 0; break;
      case 'intro': nextScene(); break;
      case 'brief': if (t - briefT > 30) startMission(mission); break;
      case 'dead': if (t - deadT > 70) { state = 'brief'; briefT = t; } break;
      case 'clear': if (t - clearT > 90) { mission = 2; state = 'brief'; briefT = t; } break;
      case 'end': if (t - endT > 120) { state = 'title'; } break;
    }
  }
  function nextScene() { scene++; sf = 0; if (scene > 3) { mission = 1; score = 0; state = 'brief'; briefT = t; } }

  // ---------- Input ----------
  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) { if (state === 'play') hold = true; else tap(); } }
    if (e.code === 'KeyM') muted = !muted;
  });
  addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) hold = false; });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') hold = true; else tap(); });
  const release = () => { hold = false; };
  addEventListener('pointerup', release); addEventListener('pointercancel', release);

  // ---------- Spawning ----------
  function spawn(wx) {
    const c = center(wx), h = halfH(wx);
    const pool = mission === 1
      ? [['turd', 3], ['corn', 3], ['peanut', 2], ['fart', 1.5], ['roid', 2]]
      : [['wbc', 3], ['mucus', 2], ['rival', 1.5], ['spermicide', prog > 0.5 ? 2.5 : 0.6], ['iud', prog > 0.7 ? 2 : 0]];
    let sum = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * sum, type = pool[0][0];
    for (const [n, w] of pool) { if ((r -= w) < 0) { type = n; break; } }
    const R = { turd: 28, corn: 14, peanut: 17, fart: 42, roid: 22, wbc: 26, mucus: 34, rival: 16, spermicide: 36, iud: 30 }[type];
    const o = { type, x: wx, y: c + rand(-h + R + 10, h - R - 10), r: R, seed: rand(0, 6), got: false };
    if (type === 'roid') o.y = Math.random() < 0.5 ? c - h + 8 : c + h - 8;
    if (type === 'rival') { o.x = scroll - 120; o.y = c + rand(-h + 40, h - 40); o.taunted = false; }
    objs.push(o);
    // pickups in an arc or a line
    const pk = mission === 1 ? 'drop' : 'heart';
    if (Math.random() < 0.75) {
      const py = c + rand(-h + 40, h - 40), px = wx + rand(120, 200);
      for (let i = 0; i < 5; i++) objs.push({ type: pk, x: px + i * 34, y: py + Math.sin(i * 0.9) * 22, r: 10, seed: rand(0, 6), got: false });
    }
  }

  // ---------- Update ----------
  function update() {
    t++;
    if (shake > 0) { shake *= 0.9; if (shake < 0.4) shake = 0; }
    if (flash > 0) flash = Math.max(0, flash - 0.04);
    for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life--; }
    parts = parts.filter(q => q.life > 0);

    if (state === 'intro') { sf++; introTick(); return; }
    if (state !== 'play') { radioTick(); return; }

    const M = MISSIONS[mission], p = player;
    speed = 4.5 + prog * 2.5;
    scroll += speed; prog = clamp(scroll / M.len, 0, 1);
    p.vy += 0.32; if (hold) p.vy -= 0.62;
    p.vy = clamp(p.vy, -6, 6); p.y += p.vy; p.ph += 0.4 + (hold ? 0.3 : 0);
    if (hold && t % 4 === 0) parts.push({ x: PX - 30, y: p.y + rand(-6, 6), vx: -speed * 0.4, vy: rand(-0.5, 0.5), r: rand(2, 4), c: 'rgba(255,255,255,0.6)', life: 25, max: 25 });

    // walls
    const wx = scroll + PX, c = center(wx), h = halfH(wx);
    if (p.y - PR < c - h + 6 || p.y + PR > c + h - 6) { die('wall'); return; }

    // spawn
    const endZone = M.len - 900;
    while (scroll + W + 150 > nextSpawn && nextSpawn < endZone) { spawn(nextSpawn); nextSpawn += rand(300, 460); }

    // objects
    let slow = 1;
    for (const o of objs) {
      if (o.type === 'rival') { o.x += speed + 3.5; o.y += Math.sin(t * 0.1 + o.seed) * 0.8; if (!o.taunted && o.x > scroll + PX + 40) { o.taunted = true; say('RIVAL', pickOne(TAUNTS), 120); } }
      if (o.type === 'wbc') { const dx = o.x - wx; if (dx > -100 && dx < 420) o.y += clamp(p.y - o.y, -1.3, 1.3); }
      const sx = o.x - scroll, dx = sx - PX, dy = o.y - p.y, d = Math.hypot(dx, dy);
      const hit = d < o.r + PR - 4;
      if (!hit) continue;
      switch (o.type) {
        case 'drop': case 'heart':
          if (!o.got) { o.got = true; pickups++; sfx('pick'); if (PICK_LINES[pickups]) say('PRICK', PICK_LINES[pickups], 120);
            parts.push({ x: sx, y: o.y, vx: 0, vy: -1.5, r: 0, txt: '+10', c: '#ffd23f', life: 40, max: 40 }); }
          break;
        case 'fart':
          p.vy -= 0.9; slow = 0.6;
          if (!farted) { farted = true; sfx('fart'); say('SWIMMER', 'WHO. FARTED.', 100); }
          if (t % 3 === 0) parts.push({ x: PX + rand(-20, 20), y: p.y + rand(-20, 20), vx: rand(-1, 1), vy: rand(-2, -0.5), r: rand(6, 12), c: 'rgba(120,200,90,0.5)', life: 30, max: 30 });
          break;
        case 'mucus': slow = 0.45; p.vy *= 0.85; break;
        default: die(o.type); return;
      }
    }
    if (slow < 1) scroll -= speed * (1 - slow);
    objs = objs.filter(o => o.x - scroll > -200 && !o.got);

    // end of mission
    if (mission === 1) {
      const gx = M.len - 450 - scroll;               // gate screen x
      const gap = 34 + 70 * Math.abs(Math.sin(t * 0.045));
      const gc = center(M.len - 450);
      if (PX + PR > gx - 40 && PX - PR < gx + 40 && Math.abs(p.y - gc) > gap - PR) { die('clenched'); return; }
      if (scroll > M.len) { state = 'clear'; clearT = t; score += 1000 + pickups * 10; sfx('win'); radio = null; radioQ = []; }
    } else {
      const ex = M.len - scroll, ec = center(M.len);
      if (Math.hypot(ex - PX, ec - p.y) < 90 + PR) { state = 'end'; endT = t; score += 5000 + pickups * 10; sfx('win'); radio = null; radioQ = [];
        if (score > best) { best = score; try { localStorage.setItem('cod_best', best); } catch (e) {} } }
    }

    // scripted radio
    for (const [f, who, text] of SCRIPT[mission]) { const k = f + who; if (prog >= f && !fired.has(k)) { fired.add(k); say(who, text); } }
    radioTick();
  }

  // ---------- Intro ----------
  const INTRO = [
    { len: 320 },
    { len: 680, subs: [[20, 'PRICK', "Swimmer. Wake up. It's go time."], [130, 'SWIMMER', 'Where are we, Captain?'], [220, 'PRICK', 'Classified. Somewhere warm. Somewhere wet.'], [330, 'PRICK', 'Two hundred million of us went in. One comes out a father.'], [450, 'PRICK', 'Gear up. On the rope in ten.'], [560, 'PRICK', 'Bravo Six... going dark.']] },
    { len: 540, subs: [[10, 'PRICK', 'On the rope, Swimmer. Go, go, go.'], [120, 'SWIMMER', "Captain, I can't see shit."], [210, 'PRICK', "That's the fog of war, son."], [310, 'SWIMMER', 'It smells like... war.'], [410, 'PRICK', 'Keep going. Almost at the LZ.']] },
    { len: 640, subs: [[15, 'SWIMMER', '...Captain.'], [95, 'PRICK', 'Yeah.'], [150, 'SWIMMER', "This isn't the ship."], [230, 'PRICK', 'No, son.'], [300, 'PRICK', "That's an asshole."], [400, 'PRICK', 'New mission: get out. Find the right hole. Make a baby.'], [520, 'SWIMMER', 'Copy that. Oscar Mike.']] },
  ];
  function introTick() {
    const sc = INTRO[scene];
    if (sc.subs) for (const [f, who, text] of sc.subs) if (sf === f) { radio = null; radioQ = []; say(who, text, 999); }
    if (scene === 1 && sf % 6 === 0) sfx('chop');
    if (scene === 3 && sf === 1) { shake = 12; flash = 0.6; }
    radioTick();
    if (sf > sc.len) nextScene();
  }

  // ---------- Drawing helpers ----------
  function E(x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), r, 0, Math.PI * 2); }
  function fs(fill, stroke = INK, lw = 2.5) { ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
  function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s);
    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.2, x - s * 0.6, y - s * 1.2, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.4, y - s * 0.2, x, y + s);
    ctx.closePath();
  }
  function txt(s, x, y, size, fill = '#fff', align = 'center', stroke = INK) {
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = fill; ctx.fillText(s, x, y);
  }
  function face(x, y, o) {
    if (o.dead) {
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      [[x - 3, y - 3], [x + 6, y - 3]].forEach(([ex, ey]) => { ctx.beginPath(); ctx.moveTo(ex - 2.5, ey - 2.5); ctx.lineTo(ex + 2.5, ey + 2.5); ctx.moveTo(ex + 2.5, ey - 2.5); ctx.lineTo(ex - 2.5, ey + 2.5); ctx.stroke(); });
      return;
    }
    const blink = (t + (o.ph || 0) * 9) % 170 < 5;
    [[x - 2, y - 3], [x + 7, y - 3]].forEach(([ex, ey]) => {
      if (blink) { ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(ex - 3, ey); ctx.lineTo(ex + 3, ey); ctx.stroke(); }
      else { E(ex, ey, 3.6, 4); fs('#fff', INK, 1.4); E(ex + 1.3, ey + 0.4, 1.9, 2.1); fs(INK, null); E(ex + 1.9, ey - 0.8, 0.7, 0.7); fs('#fff', null); }
    });
    if (o.angry) { ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 6, y - 10); ctx.lineTo(x + 1, y - 7); ctx.moveTo(x + 11, y - 10); ctx.lineTo(x + 4, y - 7); ctx.stroke(); }
    if (o.stache) { ctx.fillStyle = INK; E(x + 3, y + 3.5, 7, 2.6); ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    if (o.mouth === 'o') { E(x + 3, y + 6, 2.6, 3.4); fs('#7a2a4a', INK, 1.5); }
    else if (o.mouth === 'sad') { ctx.beginPath(); ctx.moveTo(x - 1, y + 7); ctx.quadraticCurveTo(x + 3, y + 3, x + 7, y + 7); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(x - 1, y + 4); ctx.quadraticCurveTo(x + 3, y + 8, x + 7, y + 4); ctx.stroke(); }
  }
  // The hero: a sperm with a face and a helmet. Head faces +x.
  function drawSperm(x, y, s, o = {}) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); if (o.rot) ctx.rotate(o.rot);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const ph = o.ph !== undefined ? o.ph : t * 0.35, amp = o.dead ? 0.25 : 1;
    ctx.beginPath(); ctx.moveTo(-12, 0);
    for (let i = 1; i <= 9; i++) ctx.lineTo(-12 - i * 6.5, Math.sin(ph + i * 0.75) * (1.5 + i * 1.2) * amp);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke(); ctx.strokeStyle = o.col || CREAM; ctx.lineWidth = 4; ctx.stroke();
    E(0, 0, 18, 14); fs(o.col || CREAM);
    E(-7, -5, 5, 2.5); fs('rgba(255,255,255,0.8)', null);
    if (o.helmet) {
      ctx.beginPath(); ctx.arc(0, -4, 19, Math.PI, 0); ctx.closePath(); fs('#5c7a3a');
      rr(-20, -6, 40, 5, 2); fs('#4a6330', INK, 1.5);
    }
    if (o.hat) { E(0, -10, 24, 5); fs('#6b7a4a'); rr(-13, -24, 26, 16, 5); fs('#6b7a4a'); }
    face(0, 0, o);
    ctx.restore();
  }
  function drawObj(o) {
    const x = o.x - scroll, y = o.y, s = o.seed;
    if (x < -120 || x > W + 120) return;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    switch (o.type) {
      case 'turd': {
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 0.03 + s) * 0.2);
        E(0, 8, 28, 14); fs('#6b3f1d'); E(-4, -4, 22, 12); fs('#7a4a24'); E(2, -15, 14, 9); fs('#8a5630');
        E(6, -24, 5, 4); fs('#8a5630');
        face(-2, -2, { mouth: 'o', ph: s });
        ctx.restore(); break;
      }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
