<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cock Carousel: Slide Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #ffd6e7; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  // ---------- Setup ----------
  const W = 960, H = 540;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1, dpr = 1;
  let portrait = false;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    portrait = innerHeight > innerWidth * 1.1;
    scale = portrait ? Math.min(innerHeight / W, innerWidth / H) : Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.style.transform = portrait ? 'rotate(90deg)' : '';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  }
  addEventListener('resize', resize);
  resize();

  const FONT = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
  const INK = '#4a1d3a';
  const SKIN = '#f9c3ad', SKIN2 = '#f3a48c', HEAD = '#f47fa2', HEAD2 = '#e85f8b';
  const ANG = 0.2, SIN = Math.sin(ANG), COS = Math.cos(ANG);
  const TRACK_Y = 200;   // screen y where the slide starts at x = 0
  const PX = 210;        // player position along the slide
  const GRAV = 0.75, JUMP = -14.5;
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const mod = (a, n) => ((a % n) + n) % n;

  let state = 'title', t = 0, overT = 0, scroll = 0;
  let deathBy = '', dfl = 0;             // what killed you, and how deflated you are (bee sting)
  let speed, dist, loot, score = 0, best = 0, newBest = false;
  let objs, parts, gap, player, shake = 0, playT = 0;
  let duckKey = false, duckTouch = null;
  let level = 1, msg = null, winT = 0, banner = null, ldist = 0, bonus = 0, maxLevel = 1, endT = 0, lastPct = 0, fxp = [], flash = 0;
  // Ten levels, each with its own goal, speed band, obstacle mix and scenery. After 10 the last one loops as an encore, faster each time.
  const LEVELS = [
    { name: 'Candy Hills',      tag: 'just the tip',           goal: 60,  speed: 5.5,  max: 8,    gap: [620, 900], pairs: 0,    pool: [['cactus', 3], ['trap', 3]],
      sky: ['#ff9ec4', '#ffd6e7', '#fff0d6'], hills: ['#c9a2ff', '#a877f5', '#8c5ce0'] },
    { name: 'Crab Beach',       tag: "something's pinching",   goal: 80,  speed: 6,    max: 8.5,  gap: [580, 860], pairs: 0.1,  pool: [['cactus', 2], ['trap', 2], ['crab', 3]],
      sky: ['#7fd0f0', '#bfe9f8', '#fff3d6'], hills: ['#ffe3a8', '#f7cf80', '#e6b45f'] },
    { name: 'Bee Meadow',       tag: 'duck, dummy',            goal: 100, speed: 6.5,  max: 9,    gap: [560, 820], pairs: 0.15, pool: [['cactus', 2], ['trap', 2], ['bee', 4]],
      sky: ['#9be07a', '#d6f5b0', '#fff8d6'], hills: ['#6cc25a', '#4ea548', '#2f7d34'] },
    { name: 'Cactus Canyon',    tag: 'prickly situation',      goal: 120, speed: 7,    max: 9.5,  gap: [540, 800], pairs: 0.3,  pool: [['cactus', 3], ['tall', 3], ['trap', 1], ['crab', 1]],
      sky: ['#ffb36b', '#ffd6a8', '#fff0d6'], hills: ['#e07a4f', '#c25b3a', '#8f3f2a'] },
    { name: 'Night Shift',      tag: 'lights off, still hard', goal: 140, speed: 7.5,  max: 10,   gap: [520, 780], pairs: 0.3,  pool: [['cactus', 2], ['trap', 2], ['crab', 2], ['bee', 2], ['tall', 1]], fx: 'stars',
      sky: ['#1a1040', '#3b2470', '#6a3d9a'], hills: ['#4a2d7a', '#3a2160', '#2a1748'] },
    { name: 'Shrinkage Slopes', tag: "it's cold, okay?!",      goal: 150, speed: 8.5,  max: 11,   gap: [540, 800], pairs: 0.3,  pool: [['ice', 4], ['trap', 1], ['bee', 2], ['cactus', 1]], fx: 'snow',
      sky: ['#a8dcff', '#d9f0ff', '#ffffff'], hills: ['#cfe9ff', '#a9d3f5', '#7fb6e6'] },
    { name: 'Hot Sauce Hollow', tag: 'burns a little',         goal: 170, speed: 8.5,  max: 11,   gap: [500, 760], pairs: 0.4,  pool: [['pepper', 4], ['cactus', 2], ['crab', 2], ['bee', 1]], fx: 'embers',
      sky: ['#ff5e3a', '#ff9a5c', '#ffd6a8'], hills: ['#c2261f', '#8f1a16', '#5c100e'] },
    { name: 'Thunder Thighs',   tag: 'wet.',                   goal: 180, speed: 9,    max: 11.5, gap: [480, 740], pairs: 0.45, pool: [['cactus', 2], ['trap', 2], ['crab', 2], ['bee', 3], ['tall', 2], ['ice', 1]], fx: 'rain',
      sky: ['#3d4a6b', '#6b7a9c', '#a3b0c9'], hills: ['#4c5b7a', '#3a4763', '#28324a'] },
    { name: 'Disco Inferno',    tag: 'shake it',               goal: 200, speed: 9.5,  max: 12.5, gap: [460, 720], pairs: 0.5,  pool: [['cactus', 2], ['trap', 2], ['crab', 2], ['bee', 3], ['tall', 2], ['pepper', 2], ['ice', 1]], fx: 'disco',
      sky: ['#ff5d8f', '#c96bff', '#7ed6df'], hills: ['#ff5d8f', '#c96bff', '#7ed6df'] },
    { name: 'The Big Finish',   tag: "don't you dare stop",    goal: 250, speed: 10,   max: 13.5, gap: [440, 700], pairs: 0.6,  pool: [['cactus', 2], ['trap', 2], ['crab', 2], ['bee', 3], ['tall', 2], ['pepper', 2], ['ice', 2]], fx: 'hearts',
      sky: ['#ff2d7a', '#ff9ec4', '#ffd23f'], hills: ['#ffb3c9', '#ff5d8f', '#c93d7a'] },
  ];
  const LV = () => {
    if (level <= LEVELS.length) return LEVELS[level - 1];
    const b = LEVELS[LEVELS.length - 1], n = level - LEVELS.length;
    return Object.assign({}, b, { name: `Encore ${n}`, tag: 'she still wants more', speed: b.speed + n * 0.5, max: b.max + n * 0.5 });
  };
  const goal = () => LV().goal;
  const lvName = () => `LEVEL ${level} · ${LV().name}`;
  const OVER_DELAY = 95;                // frames of wipeout before GAME OVER shows
  const JOKES = {   // keyed by % of the level goal
    2: "ooh... it's growing", 5: "getting harder already?", 10: "look at you go, big guy", 15: "that's a big boy now",
    20: "she's gonna feel that one", 25: "keep stroking, champ", 30: "throbbing nicely", 38: "don't stop now",
    45: "harder... HARDER", 50: "halfway to heaven", 60: "you're doing amazing, sweetie", 70: "faster... faster...",
    80: "you're almost there", 90: "oh god... oh GOD", 95: "wow, you're about to cum", 98: "hold it... hold it...",
  };
  const FILLER = ["mmm, that's the spot", "nice girth", "is it in yet?", "so hard right now", "moan for me", "she said don't stop",
    "veiny", "ohhh yes", "right there, right there", "you absolute stallion", "getting slippery", "harder, daddy"];
  const growth = () => 1 + 1.6 * Math.min(loot, goal()) / goal();   // 1x at 0 eggplants, 2.6x at the goal
  function say(text) { if (banner) return; msg = { txt: text, life: 150, max: 150 }; }
  function onLoot() {
    if (loot >= goal()) { win(); return; }
    const pct = Math.floor(loot / goal() * 100);
    let hit = null;
    for (const k in JOKES) if (+k > lastPct && +k <= pct) hit = JOKES[k];
    lastPct = pct;
    if (hit) say(hit);
    else if (loot % 15 === 0) say(FILLER[Math.floor(Math.random() * FILLER.length)]);
  }
  try { best = +localStorage.getItem('ccs_best') || 0; } catch (e) {}
  try { maxLevel = Math.min(LEVELS.length, Math.max(1, +localStorage.getItem('ccs_unlocked') || 1)); } catch (e) {}

  function reset(lv = 1) {
    speed = 5.5; dist = 0; ldist = 0; loot = 0; objs = []; parts = []; fxp = []; gap = 500; playT = 0; newBest = false; level = lv; msg = null; banner = null; bonus = 0; lastPct = 0; flash = 0;
    player = { y: 0, vy: 0, jumps: 0, onGround: true, squash: 0, flip: 0, deadRot: 0, deadX: 0, winX: 0, arrived: false };
  }
  reset();

  // ---------- Sound ----------
  let actx = null, muted = false;
  let unlocked = false;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iOS: play even with the ringer switch on silent
    }
    if (actx && actx.state !== 'running') actx.resume();
    if (actx && !unlocked) {   // iOS: a silent buffer on the first touch unlocks the context
      try { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); unlocked = true; } catch (e) {}
    }
    return actx;
  }
  ['touchend', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(ev => addEventListener(ev, audio, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && actx) actx.resume(); });
  function tone(f1, f2, d, type, vol, when) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.connect(g); g.connect(a.destination);
    const s = a.currentTime + (when || 0);
    o.frequency.setValueAtTime(f1, s);
    o.frequency.exponentialRampToValueAtTime(f2, s + d);
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(0.001, s + d);
    o.start(s); o.stop(s + d + 0.02);
  }
  function sfx(n) {
    switch (n) {
      case 'jump': tone(320, 640, 0.15, 'square', 0.08); break;
      case 'flip': tone(500, 1200, 0.22, 'square', 0.08); break;
      case 'loot': tone(880, 1400, 0.1, 'triangle', 0.12); break;
      case 'land': tone(160, 90, 0.07, 'triangle', 0.1); break;
      case 'hit': tone(420, 60, 0.5, 'sawtooth', 0.1); break;
      case 'boing': tone(180, 720, 0.25, 'sine', 0.12); tone(720, 300, 0.25, 'sine', 0.1, 0.25); break;
      case 'thud': tone(rand(200, 320), 60, 0.12, 'sine', 0.08); break;
      case 'whoosh': tone(700, 250, 0.18, 'sine', 0.1); break;
      case 'thunder': tone(90, 30, 0.8, 'sawtooth', 0.12); break;
      case 'deflate': tone(520, 70, 1.6, 'sine', 0.1); tone(260, 40, 1.6, 'sawtooth', 0.03); break;
      case 'snip': tone(1400, 900, 0.05, 'square', 0.08); tone(900, 1500, 0.05, 'square', 0.08, 0.06); tone(300, 60, 0.4, 'sawtooth', 0.08, 0.12); break;
      case 'drip': tone(900, 500, 0.08, 'sine', 0.06); break;
      case 'tape': tone(150, 500, 0.2, 'sine', 0.12); tone(500, 120, 0.35, 'sine', 0.12, 0.2); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.02, 0.28, 'triangle', 0.12, i * 0.13)); tone(200, 60, 0.6, 'sine', 0.15, 0.55); break;
    }
  }

  // ---------- Input ----------
  function start(lv = 1) { reset(lv); state = 'playing'; sfx('boing'); showBanner(); }
  function showBanner() { banner = { life: 170, max: 170 }; }
  function jump() {
    if (state === 'title') { start(maxLevel); return; }
    if (state === 'over') { if (t - overT > OVER_DELAY + 40) start(level); return; }
    if (state === 'win') {
      if (player.arrived && t - winT > 60) {
        if (level === LEVELS.length) {
          state = 'end'; endT = t; sfx('win');
          const sc = Math.floor(dist) + bonus + goal() * 10;
          if (sc > best) { best = sc; newBest = true; try { localStorage.setItem('ccs_best', best); } catch (e) {} }
        } else nextLevel();
      }
      return;
    }
    if (state === 'end') { if (t - endT > 60) nextLevel(); return; }
    const p = player;
    if (p.jumps < 2) {
      p.vy = p.jumps ? JUMP * 0.85 : JUMP;
      if (p.jumps === 1) { p.flip = 0.001; sfx('flip'); sfx('drip'); parts.push({ k: 'p', x: PX + 30, y: p.y - 90 * growth(), vx: -speed * 0.3, vy: -1.2, txt: 'precum!', life: 45, max: 45 }); } else sfx('jump');
      p.jumps++; p.onGround = false;
      dust(PX - 10, 0, 4);
    }
  }
  addEventListener('keydown', e => {
    audio();
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) jump(); }
    if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); duckKey = true; }
    if (e.code === 'KeyM') muted = !muted;
    if (e.code === 'KeyN' && state === 'title') start(1);
  });
  addEventListener('keyup', e => { if (['ArrowDown', 'KeyS'].includes(e.code)) duckKey = false; });
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    const r = cv.getBoundingClientRect();
    const x = portrait ? (e.clientY - r.top) / r.height * W : (e.clientX - r.left) / r.width * W;
    if (state !== 'playing') { if (state === 'title' && maxLevel > 1) start(x < W / 2 ? 1 : maxLevel); else jump(); return; }
    if (x < W * 0.4) duckTouch = e.pointerId; else jump();
  });
  const release = e => { if (duckTouch === e.pointerId) duckTouch = null; };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);

  // ---------- Spawning ----------
  function pick(pool) {
    let sum = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * sum;
    for (const [n, w] of pool) { if ((r -= w) < 0) return n; }
    return pool[0][0];
  }
  const makeLoot = (x, y) => ({ type: 'eggplant', x, y, w: 18, h: 26, pad: 0, seed: Math.random() * 6 });
  const SIZES = { cactus: [56, 44, 8], trap: [48, 40, 6], crab: [70, 44, 10], tall: [56, 86, 8], bee: [52, 30, 6], ice: [50, 34, 6], pepper: [30, 60, 5] };
  const LOW = ['cactus', 'trap', 'ice', 'pepper'];   // short enough to be fair as a pair
  function spawn() {
    const x = 1150, L = LV();
    const mk = (type, x) => { const s = SIZES[type]; return { type, x, w: s[0], h: s[1], pad: s[2], y: type === 'bee' ? 42 : 0, baseY: 42, seed: Math.random() * 6 }; };
    const type = pick(L.pool);
    const o = mk(type, x); objs.push(o);
    let paired = false;
    if (Math.random() < L.pairs && LOW.includes(type)) {
      const lowPool = L.pool.filter(p => LOW.includes(p[0]));
      if (lowPool.length) { objs.push(mk(pick(lowPool), x + o.w + rand(95, 130))); paired = true; }
    }
    if (type !== 'bee' && Math.random() < 0.8) {
      const top = o.h + 48;
      for (let i = -2; i <= 2; i++) objs.push(makeLoot(x + o.w / 2 - 9 + i * 38, top - i * i * 9));
    }
    if (Math.random() < 0.85) {
      const lx = x + (paired ? 330 : 220);
      for (let i = 0; i < 6; i++) objs.push(makeLoot(lx + i * 40, 8));
    }
  }

  // ---------- Particles ----------
  const CONFETTI = ['#ff5d8f', '#ffd23f', '#7ed6df', '#b28cff', '#ff9f43', '#fff'];
  function dust(x, y, n) {
    for (let i = 0; i < n; i++) parts.push({ k: 'd', x: x + rand(-8, 8), y: y - rand(0, 6), vx: -speed * 0.5 + rand(-1, 1), vy: rand(-1.2, -0.2), r: rand(3, 6), life: 25, max: 25 });
  }
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) parts.push({ k: 'c', x, y, vx: rand(-5, 5), vy: rand(-7, -1), rot: rand(0, 6), vr: rand(-0.2, 0.2), c: CONFETTI[i % CONFETTI.length], heart: i % 3 === 0, life: 110, max: 110 });
  }
  function sparkle(x, y) {
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; parts.push({ k: 's', x, y, vx: Math.cos(a) * 3 - speed, vy: Math.sin(a) * 3, life: 20, max: 20 }); }
    parts.push({ k: 'p', x, y: y - 10, vx: -speed * 0.5, vy: -1.5, txt: '+10', life: 40, max: 40 });
  }

  function win() {
    state = 'win'; winT = t; msg = null; objs = []; duckTouch = null;
    const p = player; p.y = 0; p.vy = 0; p.winX = 0; p.fly = 0; p.arrived = false; p.flip = 0; p.jumps = 0; p.onGround = true;
    sfx('win');
  }
  function nextLevel() {
    bonus += goal() * 10;
    level++; loot = 0; ldist = 0; lastPct = 0; objs = []; fxp = []; gap = 600; playT = 0; msg = null;
    if (level > maxLevel && level <= LEVELS.length) { maxLevel = level; try { localStorage.setItem('ccs_unlocked', maxLevel); } catch (e) {} }
    const p = player; p.y = 0; p.vy = 0; p.winX = 0; p.fly = 0; p.arrived = false;
    state = 'playing'; sfx('boing'); showBanner();
  }
  function die(by) {
    state = 'over'; overT = t; shake = 16; msg = null; deathBy = by || ''; dfl = 0;
    const p = player; p.vy = 0; p.y = 0; p.deadRot = 0; p.deadX = 0; p.onGround = true;
    if (deathBy === 'bee') sfx('deflate');
    else if (deathBy === 'trap') { sfx('snip'); p.headX = 6; p.headY = -86 * growth(); p.headVx = 7; p.headVy = -13; p.headRot = 0; }
    else { sfx('hit'); sfx('boing'); p.vy = -15; p.tumble = 0; burst(PX, -60, 30); }
    score = Math.floor(dist) + loot * 10 + bonus;
    if (score > best) { best = score; newBest = true; try { localStorage.setItem('ccs_best', best); } catch (e) {} }
  }

  // ---------- Update ----------
  function update() {
    t++;
    const p = player;
    if (state === 'playing') {
      playT++;
      speed = Math.min(LV().max, LV().speed + ldist * 0.012);
      scroll += speed; dist += speed / 30; ldist += speed / 30;
      const duck = duckKey || duckTouch !== null;
      p.duck = duck;
      p.vy += GRAV + (duck && !p.onGround ? 1.4 : 0);
      p.y += p.vy;
      if (p.y >= 0) {
        if (!p.onGround) { p.squash = 1; dust(PX - 10, 0, 6); sfx('land'); }
        p.y = 0; p.vy = 0; p.onGround = true; p.jumps = 0; p.flip = 0;
      }
      if (p.flip > 0) {
        p.flip = Math.min(1, p.flip + 0.045);
        if (p.flip < 1 && t % 2 === 0) { const a = p.flip * Math.PI * 2, g = growth(); parts.push({ k: 'j', x: PX + Math.sin(a) * 60 * g, y: p.y - 32 - Math.cos(a) * 60 * g, vx: -speed * 0.3 + Math.cos(a) * 3, vy: -Math.sin(a) * 3 - 1, r: rand(2.5, 4.5), life: 40, max: 40 }); }
      }
      if (p.onGround && t % 6 === 0) dust(PX - 14, 0, 1);

      gap -= speed;
      if (gap <= 0) { spawn(); gap = rand(LV().gap[0], LV().gap[1]) + speed * 18; }
      for (const o of objs) {
        o.x -= speed + (o.type === 'crab' ? 1.8 : 0);
        if (o.type === 'bee') o.y = o.baseY + Math.sin(t * 0.08 + o.seed) * 5;
      }
      objs = objs.filter(o => o.x > -150 && !o.got);

      const ducking = duck && p.onGround;
      const g = 1;   // hitbox stays the same size no matter how big the art gets
      const ph = ducking ? 34 : 68 * g;
      const L = PX - 20 * g, R = PX + 22 * g, T = p.y - ph, B = p.y - 2;
      for (const o of objs) {
        const pad = o.pad ?? 6;
        const ol = o.x + pad, or = o.x + o.w - pad, ot = -(o.y + o.h) + pad, ob = -o.y;
        if (R > ol && L < or && B > ot && T < ob) {
          if (o.type === 'eggplant') { o.got = true; loot++; sparkle(o.x + 9, -o.y - 12); sfx('loot'); onLoot(); if (state !== 'playing') break; }
          else { die(o.type); break; }
        }
      }
    } else if (state === 'title') {
      scroll += 4; speed = 4;
    } else if (state === 'over') {
      const age = t - overT;
      p.deadRot = Math.sin(age * 0.9) * 0.08 * Math.max(0, 1 - age / OVER_DELAY);   // trembling
      p.squash = 0.35 + Math.abs(Math.sin(age * 0.45)) * 0.3;
      if (deathBy === 'bee') {
        dfl = Math.min(1, dfl + 0.011);
        p.deadRot = Math.sin(age * 0.5) * 0.05 * (1 - dfl);
        if (age % 5 === 0 && dfl < 1) parts.push({ k: 'p', x: PX + 20 + rand(-10, 10), y: -40 - rand(0, 40), vx: 1.5, vy: -1.5, txt: 'psss', life: 30, max: 30 });
      } else if (deathBy === 'trap') {
        p.headVy += 0.5; p.headX += p.headVx; p.headY += p.headVy; p.headRot += 0.25;
        if (age < 70 && age % 3 === 0) parts.push({ k: 'c', x: PX + 4, y: -70 * growth(), vx: rand(-3, 5), vy: rand(-6, -1), rot: 0, vr: 0, c: '#e0245e', heart: false, life: 60, max: 60 });
      } else {
        // head over heels off the end of the slide
        p.vy += 0.62; p.y += p.vy; p.deadX += 3.6; p.deadRot += 0.27;
        if (age < 46 && age % 5 === 0) parts.push({ k: 'st', x: PX + p.deadX + rand(-26, 26), y: p.y - 60 + rand(-26, 26), vx: rand(-1.2, 1.2), vy: rand(-1.6, -0.3), r: rand(7, 13), rot: rand(0, 6), vr: rand(-0.12, 0.12), life: 46, max: 46 });
        if (age === 14 || age === 34) sfx('land');
      }

    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }

  // The namesake: a little carousel of dicks spinning in the distance.
  function drawCarousel(cx, gy) {
    const riders = [];
    for (let i = 0; i < 6; i++) {
      const a = t * 0.02 + i * Math.PI / 3;
      riders.push({ x: cx + Math.cos(a) * 60, z: Math.sin(a), bob: Math.sin(t * 0.08 + i * 1.3) * 6, dir: -Math.sin(a), i });
    }
    riders.sort((a, b) => a.z - b.z);
    E(cx, gy, 84, 15); fs('#8e5bd6');
    E(cx, gy - 4, 84, 13); fs('#a97be8');
    const rider = r => {
      ctx.strokeStyle = '#e8b830'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(r.x, gy - 108); ctx.lineTo(r.x, gy - 6); ctx.stroke();
      drawDick(r.x, gy - 22 + r.bob, 0.48 * (0.85 + 0.15 * r.z), { mirror: r.dir < 0, seed: r.i * 40 });
    };
    riders.filter(r => r.z < 0).forEach(rider);
    ctx.fillStyle = '#e8b830'; ctx.fillRect(cx - 5, gy - 112, 10, 108);
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(cx - 5, gy - 112, 10, 108);
    riders.filter(r => r.z >= 0).forEach(rider);
    const top = gy - 170, rim = gy - 110;
    for (let i = 0; i < 8; i++) {
      poly([cx, top, cx - 92 + i * 23, rim, cx - 92 + (i + 1) * 23, rim]);
      fs(i % 2 ? '#fff6e0' : '#ff5d8f', null);
    }
    poly([cx, top, cx - 92, rim, cx + 92, rim]); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(cx - 81 + i * 23, rim, 11.5, 0, Math.PI); fs(i % 2 ? '#fff6e0' : '#ff5d8f'); }
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, top - 22); ctx.stroke();
    poly([cx, top - 22, cx + 18 + Math.sin(t * 0.15) * 3, top - 17, cx, top - 12]); fs('#ffd23f', INK, 1.5);
  }

  // ---------- Draw ----------
  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (shake > 0) { ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5); shake *= 0.9; if (shake < 0.5) shake = 0; }

    // sky, per level
    const L = LV();
    let sky = L.sky;
    if (L.fx === 'disco') { const h = (t * 1.2) % 360; sky = [`hsl(${h},90%,60%)`, `hsl(${(h + 60) % 360},90%,70%)`, `hsl(${(h + 120) % 360},90%,80%)`]; }
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sky[0]); g.addColorStop(0.55, sky[1]); g.addColorStop(1, sky[2]);
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

    if (L.fx === 'stars') {
      // night: stars + a sleepy moon
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 70; i++) { const sx = (i * 137.5 + 40) % W, sy = (i * 71.3 + 20) % 300; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 0.07 + i); E(sx, sy, 1.5 + (i % 3), 1.5 + (i % 3)); ctx.fill(); }
      ctx.globalAlpha = 1;
      E(840, 80, 40, 40); fs('#fff3c4', '#d9c88f', 3);
      E(826, 66, 7, 6); fs('#e9dcb0', null); E(856, 96, 5, 4); fs('#e9dcb0', null); E(858, 62, 3, 3); fs('#e9dcb0', null);
      ctx.strokeStyle = '#8a7a50'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(826, 80); ctx.lineTo(836, 80); ctx.moveTo(846, 80); ctx.lineTo(856, 80); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(834, 92); ctx.quadraticCurveTo(840, 97, 846, 92); ctx.stroke();
    } else if (L.fx === 'disco') {
      // mirror ball
      ctx.save(); ctx.translate(840, 80);
      ctx.strokeStyle = '#8892a0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, -100); ctx.stroke();
      E(0, 0, 40, 40); fs('#d8dde6', '#8892a0', 3);
      ctx.save(); E(0, 0, 40, 40); ctx.clip(); ctx.strokeStyle = 'rgba(80,90,110,0.5)'; ctx.lineWidth = 1.5;
      for (let i = -40; i <= 40; i += 10) { const ox = (t * 0.5) % 10; ctx.beginPath(); ctx.moveTo(i + ox, -40); ctx.lineTo(i + ox, 40); ctx.moveTo(-40, i); ctx.lineTo(40, i); ctx.stroke(); }
      ctx.restore();
      for (let i = 0; i < 6; i++) { const a = t * 0.05 + i; E(Math.cos(a) * 28, Math.sin(a) * 28, 4, 4); fs('#fff', null); }
      ctx.restore();
    } else {
      // sun
      ctx.save(); ctx.translate(840, 80); ctx.rotate(t * 0.005);
      ctx.fillStyle = '#ffe27a';
      for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); poly([-7, -50, 7, -50, 0, -70]); ctx.fill(); }
      ctx.restore();
      E(840, 80, 40, 40); fs('#ffd23f', '#f0a91d', 3);
      ctx.strokeStyle = '#f0a91d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(840, 84, 18, 0.3, Math.PI - 0.3); ctx.stroke();
      E(830, 72, 3, 3); fs('#f0a91d', null); E(850, 72, 3, 3); fs('#f0a91d', null);
    }

    // clouds
    [[100, 70, 1], [420, 50, 0.7], [700, 130, 1.2], [1000, 90, 0.9]].forEach(([cx, cy, s]) => {
      const x = mod(cx - scroll * 0.06 * s, W + 300) - 150;
      ctx.fillStyle = '#ffffff';
      [[0, 0, 28], [26, -12, 30], [52, 0, 26], [26, 6, 26]].forEach(([dx, dy, r]) => { E(x + dx * s, cy + dy * s, r * s, r * s * 0.8); ctx.fill(); });
    });

    const hc = L.fx === 'disco' ? [0, 1, 2].map(i => `hsl(${(t * 1.2 + 200 + i * 30) % 360},70%,${55 - i * 10}%)`) : L.hills;
    hills(330, 22, 0.006, scroll * 0.12, hc[0]);
    const cx = mod(1100 - scroll * 0.18, 2000) - 300;
    if (cx > -200 && cx < W + 200) drawCarousel(cx, 352);
    hills(430, 18, 0.009, scroll * 0.3, hc[1]);
    hills(500, 10, 0.014, scroll * 0.55, hc[2]);

    // slide supports
    for (let k = -1; k < 6; k++) {
      const lx = mod(-scroll, 300) + k * 300;
      const sx = lx * COS - 22 * SIN, sy = TRACK_Y + lx * SIN + 22 * COS;
      ctx.fillStyle = '#3aa6d8'; ctx.fillRect(sx - 8, sy, 16, H - sy + 20);
      ctx.fillStyle = '#7fd0f0'; ctx.fillRect(sx - 8, sy, 5, H - sy + 20);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.strokeRect(sx - 8, sy, 16, H - sy + 20);
    }

    // --- slide space ---
    ctx.save();
    ctx.translate(0, TRACK_Y); ctx.rotate(ANG);

    ctx.fillStyle = '#c93d7a'; ctx.fillRect(-200, -12, 1500, 6);

    for (const o of objs) drawObj(o);

    const p = player;
    if (state === 'playing' && speed > 8.5) {
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const lx = PX - 40 - mod(t * speed * 0.8 + i * 97, 180), ly = p.y - 12 - i * 12;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - 26, ly); ctx.stroke();
      }
    }
    const gsz = state === 'title' ? 1 : growth();
    if (state === 'over') {
      const tumbling = deathBy !== 'bee' && deathBy !== 'trap';
      drawDick(PX + (tumbling ? p.deadX : 0), tumbling ? p.y : 0, gsz, { rot: p.deadRot, flap: deathBy !== 'bee', dead: deathBy === 'bee' && dfl > 0.5, squash: p.squash, deflate: deathBy === 'bee' ? dfl : 0, cut: deathBy === 'trap' });
      if (deathBy === 'trap') {   // the head, flying off into the sunset
        ctx.save(); ctx.translate(PX + p.headX, p.headY); ctx.rotate(p.headRot); ctx.scale(gsz, gsz);
        E(0, 0, 15.5, 13); fs(HEAD); E(5, -5, 3.2, 2); fs('#fff', null);
        E(-5, -2, 3, 3.5); fs('#fff', INK, 1.4); E(6, -2, 3, 3.5); fs('#fff', INK, 1.4); E(-4, -1.5, 1.5, 1.8); fs(INK, null); E(7, -1.5, 1.5, 1.8); fs(INK, null);
        E(0.5, 5, 3, 3.5); fs('#7a2a4a', INK, 1.5);
        ctx.restore();
      }
    } else if (state === 'win') {
      const target = FINISH_X - PX - 250;
      drawFinish(FINISH_X, 0, 1.1, p.arrived ? Math.min(1, (t - winT) / 14) : 0);
      if (!p.arrived) {
        if (p.fly === 0) drawDick(PX + p.winX, 0, gsz, { flap: true });
        else {
          const u = p.fly, x0 = PX + target, x = x0 + (FINISH_X + 130 - x0) * u, y = -114 * u - Math.sin(u * Math.PI) * 230;
          drawDick(x, y, gsz, { rot: u * Math.PI * 2 * 1.5, flap: true });
        }
      } else {
        drawDick(FINISH_X + 130, 0, gsz, { flap: true, squash: Math.abs(Math.sin((t - winT) * 0.22)) * 0.32 });
      }
    } else {
      const bob = state === 'title' ? Math.sin(t * 0.1) * 1.5 : 0;
      const air = !p.onGround;
      const rot = p.flip > 0 ? p.flip * Math.PI * 2 : (air ? Math.max(-0.4, Math.min(0.4, p.vy * 0.025)) : 0);
      drawDick(PX, p.y + bob, gsz, { squash: p.squash, duck: p.duck && p.onGround, dk: 0.52 / gsz, flap: air, rot });
    }

    // front wall of the chute
    ctx.save();
    ctx.beginPath(); ctx.rect(-200, -8, 1500, 30); ctx.clip();
    ctx.fillStyle = '#ff5d8f'; ctx.fillRect(-200, -8, 1500, 30);
    ctx.fillStyle = '#ffd23f';
    for (let sx = -200 - mod(scroll, 70); sx < 1300; sx += 70) poly([sx, -8, sx + 26, -8, sx + 12, 22, sx - 14, 22]), ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffb3c9'; ctx.fillRect(-200, -9, 1500, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-200, -9); ctx.lineTo(1300, -9); ctx.moveTo(-200, 22); ctx.lineTo(1300, 22); ctx.stroke();

    // particles
    for (const q of parts) {
      const a = Math.max(0, q.life / q.max);
      ctx.globalAlpha = a;
      if (q.k === 'd') { E(q.x, q.y, q.r, q.r); ctx.fillStyle = '#ffffff'; ctx.fill(); }
      else if (q.k === 'c') {
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        if (q.heart) { heart(0, 0, 6); fs(q.c, INK, 1); } else { rr(-6, -3, 12, 6, 2); fs(q.c, INK, 1); }
        ctx.restore();
      }
      else if (q.k === 's') { E(q.x, q.y, 3, 3); ctx.fillStyle = '#fff27a'; ctx.fill(); }
      else if (q.k === 'st') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); star(0, 0, q.r); fs('#ffd23f', INK, 1.6); ctx.restore(); }
      else if (q.k === 'j') { E(q.x, q.y, q.r, q.r * 1.3); fs('#f7f4ec', '#e6e0d2', 1.2); }
      else if (q.k === 'p') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(-ANG); txt(q.txt, 0, 0, 22, '#ffd23f'); ctx.restore(); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    drawFx();

    // --- HUD / screens ---
    if (state === 'playing') {
      txt(`${Math.floor(dist)} m`, 24, 36, 36, '#fff', 'left');
      ctx.save(); ctx.translate(36, 82); ctx.rotate(0.45);
      E(0, 2, 6, 10); fs('#7a3fb5', INK, 2); poly([-5, -7, 0, -12, 5, -7]); fs('#57b947', INK, 1.5); ctx.restore();
      txt(`× ${loot} / ${goal()}`, 54, 82, 28, '#ffd23f', 'left');
      txt(`BEST ${best}`, W - 24, 36, 26, '#fff', 'right');
      txt(lvName(), W - 24, 70, 22, '#ffd23f', 'right');
      // progress bar to the prize
      ctx.fillStyle = 'rgba(74,29,58,0.5)'; rr(24, 108, 200, 12, 6); ctx.fill();
      ctx.fillStyle = '#ff5d8f'; rr(24, 108, Math.max(12, 200 * Math.min(1, loot / goal())), 12, 6); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; rr(24, 108, 200, 12, 6); ctx.stroke();
      if (isTouch && playT < 200) {
        ctx.globalAlpha = Math.min(1, (200 - playT) / 40);
        txt('hold here to duck', W * 0.2, H - 30, 22, '#fff');
        txt('tap here to jump', W * 0.72, H - 30, 22, '#fff');
        ctx.globalAlpha = 1;
      }
    } else if (state === 'title') {
      ctx.save(); ctx.translate(W / 2, 100 + Math.sin(t * 0.05) * 4); ctx.rotate(Math.sin(t * 0.03) * 0.03);
      txt('COCK CAROUSEL', 0, 0, 80, '#ffd23f');
      ctx.restore();
      txt('~ Slide Rush ~  ·  10 levels', W / 2, 164, 36, '#fff');
      if (maxLevel > 1) {
        const bw = 270, by = 228, bh = 58;
        [[W / 2 - bw - 12, 'NEW GAME', isTouch ? 'tap' : 'press N'], [W / 2 + 12, `CONTINUE · LEVEL ${maxLevel}`, isTouch ? 'tap' : 'press SPACE']].forEach(([bx, label, hint]) => {
          rr(bx, by, bw, bh, 16); fs('rgba(74,29,58,0.82)', '#ffd23f', 3);
          txt(label, bx + bw / 2, by + 22, 24, '#fff', 'center', null);
          txt(hint, bx + bw / 2, by + 45, 14, '#ffd23f', 'center', null);
        });
      } else if (Math.floor(t / 30) % 2 === 0) txt(isTouch ? 'Tap to start!' : 'Press SPACE to start!', W / 2, 250, 32, '#fff');
      ctx.fillStyle = 'rgba(74,29,58,0.78)'; rr(W / 2 - 310, H - 118, 620, 96, 18); ctx.fill();
      const jumpTxt = isTouch ? 'Tap right side to jump (tap again mid-air to flip!)' : 'SPACE / ↑  to jump  (press twice for a flip!)';
      const duckTxt = isTouch ? 'Hold left side to duck · eggplants make you grow' : '↓  to duck under bees  ·  eggplants make you GROW';
      txt(jumpTxt, W / 2, H - 88, 22, '#fff', 'center', null);
      txt(duckTxt, W / 2, H - 52, 22, '#ffd23f', 'center', null);
      if (best) txt(`BEST ${best}`, W - 24, 36, 26, '#fff', 'right');
    } else if (state === 'over') {
      const age = t - overT;
      if (deathBy === 'bee') {
        if (age < 30) txt('bzzz... uh oh', W / 2, 110, 40, '#ffd23f');
        else if (age < 80) txt('PSSSSSSSSSS', W / 2, 110, 50 + Math.sin(age * 0.5) * 4, '#ffd23f');
        else if (age < OVER_DELAY) { const k = Math.min(1, (age - 80) / 10); ctx.save(); ctx.translate(W / 2, 110); ctx.scale(k, k); txt('DEFLATED', 0, 0, 74, '#7ed6df'); ctx.restore(); }
      } else if (deathBy === 'trap') {
        if (age < 20) txt('SNIP!', W / 2, 110, 50 + age * 2, '#fff');
        else if (age < OVER_DELAY) { const k = Math.min(1, (age - 20) / 8); ctx.save(); ctx.translate(W / 2, 110); ctx.scale(k, k); ctx.rotate(Math.sin(age * 0.3) * 0.05); txt('SNIPPED!', 0, 0, 78, '#e0245e', 'center', '#3a0010'); ctx.restore(); }
        if (age < 40) { ctx.fillStyle = `rgba(255,40,60,${(40 - age) / 40 * 0.35})`; ctx.fillRect(0, 0, W, H); }
      } else if (age < 22) txt('WHOOPS', W / 2, 110, 40 + age, '#fff');
      else if (age < OVER_DELAY) { const k = Math.min(1, (age - 22) / 10); ctx.save(); ctx.translate(W / 2, 110); ctx.scale(k, k); ctx.rotate(Math.sin(age * 0.2) * 0.05); txt('WIPEOUT!', 0, 0, 78, '#ffd23f'); ctx.restore(); }
      if (age > OVER_DELAY) {
        const k = Math.min(1, (age - OVER_DELAY) / 12);
        ctx.save(); ctx.translate(W / 2, H / 2 - 50); ctx.scale(k, k); ctx.translate(-W / 2, -(H / 2 - 50));
        rr(W / 2 - 250, 80, 500, 290, 26); fs('#fff6e0', INK, 4);
        txt('GAME OVER', W / 2, 135, 62, '#ff5d8f');
        txt(deathBy === 'bee' ? 'stung. all the air went out of him.' : deathBy === 'trap' ? 'a little off the top.' : 'head over heels, off the slide.', W / 2, 185, 28, INK, 'center', null);
        txt(`${Math.floor(dist)} m  ·  ${loot} eggplants  ·  level ${level}`, W / 2, 225, 24, INK, 'center', null);
        txt(`SCORE ${score}`, W / 2, 272, 40, '#ffd23f');
        txt(newBest ? '★ NEW BEST! ★' : `Best ${best}`, W / 2, 320, 26, newBest ? '#e8628b' : INK, 'center', null);
        ctx.restore();
        if (age > OVER_DELAY + 40 && Math.floor(t / 30) % 2 === 0)
          txt(isTouch ? 'Tap to slide again' : 'SPACE to slide again', W / 2, 430, 30, '#fff');
      }
    }
    else if (state === 'win') {
      txt(`LEVEL ${level}`, W - 24, 36, 26, '#ffd23f', 'right');
      if (p.arrived) {
        const k = Math.min(1, (t - winT) / 12);
        ctx.save(); ctx.translate(W / 2, 110); ctx.scale(k, k); ctx.rotate(Math.sin(t * 0.08) * 0.04);
        txt('YOU MADE IT!!', 0, 0, 72, '#ffd23f');
        ctx.restore();
        txt(`level ${level} complete  ·  ${goal()} eggplants deep`, W / 2, 168, 26, '#fff');
        if (t - winT > 60 && Math.floor(t / 30) % 2 === 0) {
          const nxt = LEVELS[level] ? LEVELS[level].name : 'Encore';
          txt(level === LEVELS.length ? (isTouch ? 'Tap for the grand finale' : 'SPACE for the grand finale')
                                      : `${isTouch ? 'Tap' : 'SPACE'} for level ${level + 1}: ${nxt}`, W / 2, H - 60, 30, '#fff');
        }
      } else if (p.fly > 0) {
        txt('GERONIMOOOOO', W / 2, 110, 48 + p.fly * 12, '#ffd23f');
      } else {
        txt('here comes the finish line!', W / 2, 110, 44, '#ffd23f');
      }
      if (p.arrived && t - winT < 40) txt('THROUGH THE TAPE!', W / 2, 180, 40 - (t - winT) * 0.3, '#fff');
    }
    else if (state === 'end') {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
      const k = Math.min(1, (t - endT) / 12);
      ctx.save(); ctx.translate(W / 2, H / 2 - 35); ctx.scale(k, k); ctx.translate(-W / 2, -(H / 2 - 35));
      rr(W / 2 - 300, 70, 600, 330, 26); fs('#fff6e0', INK, 4);
      txt('YOU RODE THE WHOLE CAROUSEL', W / 2, 125, 38, '#ff5d8f');
      txt('all 10 levels. she is speechless.', W / 2, 172, 26, INK, 'center', null);
      txt(`${Math.floor(dist)} m total  ·  ${LEVELS.reduce((s, l) => s + l.goal, 0)} eggplants`, W / 2, 215, 24, INK, 'center', null);
      txt(`SCORE ${Math.floor(dist) + bonus + goal() * 10}`, W / 2, 265, 40, '#ffd23f');
      txt(newBest ? '★ NEW BEST! ★' : `Best ${best}`, W / 2, 312, 24, newBest ? '#e8628b' : INK, 'center', null);
      txt('ENCORE MODE unlocked — it only gets faster from here', W / 2, 355, 22, INK, 'center', null);
      ctx.restore();
      if (t - endT > 60 && Math.floor(t / 30) % 2 === 0) txt(isTouch ? 'Tap for the encore' : 'SPACE for the encore', W / 2, 460, 30, '#fff');
    }
    // level intro banner
    if (banner && state === 'playing') {
      const age = banner.max - banner.life, k = Math.min(1, age / 10), a = Math.min(1, banner.life / 25);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 200); ctx.scale(k, k);
      txt(`LEVEL ${level}`, 0, -44, 32, '#fff');
      txt(LV().name.toUpperCase(), 0, 8, 58, '#ffd23f');
      txt(LV().tag, 0, 60, 26, '#fff');
      ctx.restore();
    }
    // milestone jokes
    if (msg && (state === 'playing' || state === 'win')) {
      const k = Math.min(1, (msg.max - msg.life) / 8), a = Math.min(1, msg.life / 30);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 150); ctx.scale(k, k); ctx.rotate(Math.sin(t * 0.1) * 0.03);
      txt(msg.txt, 0, 0, 40, '#ffd23f');
      ctx.restore();
    }
    if (!isTouch) txt(muted ? 'M: sound off' : 'M: sound on', W - 16, H - 16, 16, '#fff', 'right', null);
  }

  // ---------- Loop (fixed 60fps step) ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
