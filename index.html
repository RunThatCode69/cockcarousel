<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cock Carousel</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      background: #fff;
      color: #111;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
    p  { font-size: 1.5rem; margin: 0 0 2rem; }
    img { max-width: 100%; width: 600px; height: auto; border-radius: 8px; }

      display: inline-block;
      margin-top: 2rem;

      font-family: Georgia, serif;
      font-size: 1.5rem;
      color: #fff;
      background: #e0245e;
      border: none;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
    }
    .ride:hover { background: #b81a4b; }
  </style>
</head>
<body>
  <h1>welcome to cock carousel dot com!</h1>
  <p>are you ready to ride?</p>
  <img src="ride.png" alt="the carousel">

</html>
