<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cum of Duty: Modern Wharfare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #2a1030; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  // ================================================================
  //  CUM OF DUTY: MODERN WHARFARE — a Cock Carousel joint
  //  Canvas 2D raycaster. No libraries, no assets, no shame.
  // ================================================================
  const W = 960, H = 540;
  const cv = document.getElementById('c');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx;                        // drawing helpers target this; swapped when baking sprites
  let scale = 1, dpr = 1, portrait = false;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    portrait = innerHeight > innerWidth * 1.1;
    scale = portrait ? Math.min(innerHeight / W, innerWidth / H) : Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.style.transform = portrait ? 'rotate(90deg)' : '';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  }
  addEventListener('resize', resize);
  resize();

  const FONT = "'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif";
  const INK = '#4a1d3a';
  const SKIN = '#f9c3ad', SKIN2 = '#f3a48c', HEAD = '#f47fa2', HEAD2 = '#e85f8b';
  const PINK = '#ff5d8f', YEL = '#ffd23f', PURP = '#7a3fb5', CYAN = '#7ed6df', CUM = '#f7f4ec', CUM2 = '#e6e0d2';
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, k) => a + (b - a) * k;
  const TAU = Math.PI * 2;
  const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
  const pickOne = a => a[Math.floor(Math.random() * a.length)];
  let t = 0;                                 // global frame counter (always ticks, even in slow-mo)

  // ---------- Drawing helpers (same as Slide Rush) ----------
  function E(x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, TAU); }
  function fs(fill, stroke = INK, lw = 2.5) { ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
  function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s);
    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.2, x - s * 0.6, y - s * 1.2, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.4, y - s * 0.2, x, y + s);
    ctx.closePath();
  }
  function txt(s, x, y, size, fill = '#fff', align = 'center', stroke = INK) {
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = fill; ctx.fillText(s, x, y);
  }
  // word-wrapped text, returns the number of lines drawn
  function txtWrap(s, x, y, size, maxW, fill = '#fff', align = 'left', stroke = null, lh = 1.25) {
    ctx.font = `${size}px ${FONT}`;
    const words = s.split(' '); let line = '', n = 0;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { txt(line, x, y + n * size * lh, size, fill, align, stroke); line = w; n++; }
      else line = test;
    }
    if (line) { txt(line, x, y + n * size * lh, size, fill, align, stroke); n++; }
    return n;
  }
  function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  // run a painter against an offscreen canvas and hand the canvas back
  function bake(w, h, fn) { const c = mkCanvas(w, h); const old = ctx; ctx = c.getContext('2d'); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; fn(ctx, w, h); ctx = old; return c; }

  // ---------- Sound (oscillators only; iOS unlock copied from Slide Rush) ----------
  let actx = null, muted = false, unlocked = false;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iOS: play even with the ringer switch on silent
    }
    if (actx && actx.state !== 'running') actx.resume();
    if (actx && !unlocked) {   // iOS: a silent buffer on the first touch unlocks the context
      try { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); unlocked = true; } catch (e) {}
    }
    return actx;
  }
  ['touchend', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(ev => addEventListener(ev, audio, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && actx) actx.resume(); });
  function tone(f1, f2, d, type, vol, when) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.connect(g); g.connect(a.destination);
    const s = a.currentTime + (when || 0);
    o.frequency.setValueAtTime(f1, s);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), s + d);
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(0.001, s + d);
    o.start(s); o.stop(s + d + 0.02);
  }
  function noise(d, vol, when, f = 800) {   // crunchy noise burst made of detuned saws
    for (let i = 0; i < 3; i++) tone(f * rand(0.7, 1.3), f * 0.2, d, 'sawtooth', vol / 3, (when || 0) + i * 0.01);
  }
  function sfx(n) {
    switch (n) {
      case 'shoot': tone(600, 180, 0.12, 'square', 0.07); tone(1200, 300, 0.06, 'sine', 0.06); break;
      case 'pump': tone(150, 520, 0.16, 'sine', 0.12); tone(520, 120, 0.3, 'sine', 0.12, 0.17); tone(900, 400, 0.05, 'triangle', 0.05, 0.3); break;
      case 'click': tone(1200, 800, 0.03, 'square', 0.05); break;
      case 'butt': tone(120, 40, 0.18, 'sawtooth', 0.14); tone(400, 90, 0.1, 'square', 0.06); break;
      case 'hit': tone(300, 120, 0.1, 'triangle', 0.1); break;
      case 'splat': tone(rand(220, 340), 60, 0.14, 'sine', 0.1); break;
      case 'kill': tone(500, 1000, 0.12, 'square', 0.07); tone(1000, 250, 0.25, 'sine', 0.08, 0.1); break;
      case 'hurt': tone(240, 70, 0.3, 'sawtooth', 0.1); break;
      case 'loot': tone(880, 1400, 0.1, 'triangle', 0.12); tone(1400, 1800, 0.1, 'triangle', 0.1, 0.1); break;
      case 'streak': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, 0.18, 'square', 0.07, i * 0.08)); break;
      case 'bee': tone(rand(300, 360), rand(280, 340), 0.25, 'sawtooth', 0.03); break;
      case 'sting': tone(1500, 700, 0.08, 'square', 0.05); break;
      case 'snap': tone(1400, 900, 0.05, 'square', 0.08); tone(300, 60, 0.3, 'sawtooth', 0.08, 0.05); break;
      case 'wrap': tone(200, 900, 0.35, 'sine', 0.1); tone(900, 200, 0.35, 'sine', 0.08, 0.35); break;
      case 'sizzle': noise(0.4, 0.15, 0, 2000); break;
      case 'shiver': for (let i = 0; i < 6; i++) tone(700 + i * 40, 650, 0.05, 'square', 0.04, i * 0.06); break;
      case 'boom': tone(120, 30, 1.2, 'sawtooth', 0.2); noise(0.8, 0.4, 0, 400); break;
      case 'chop': tone(90, 70, 0.12, 'square', 0.06); tone(60, 50, 0.12, 'sawtooth', 0.05); break;
      case 'tick': tone(1800, 1400, 0.02, 'square', 0.03); break;
      case 'drop': tone(900, 200, 0.5, 'sine', 0.08); tone(120, 40, 0.3, 'sawtooth', 0.15, 0.5); break;
      case 'ultra': for (let i = 0; i < 4; i++) tone(1200, 1800, 0.1, 'sine', 0.06, i * 0.15); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.02, 0.28, 'triangle', 0.12, i * 0.13)); tone(200, 60, 0.6, 'sine', 0.15, 0.55); break;
      case 'die': tone(400, 50, 1.4, 'sawtooth', 0.12); tone(200, 30, 1.4, 'sine', 0.1); break;
      case 'slide': noise(0.5, 0.1, 0, 300); break;
      case 'boss': tone(70, 40, 0.6, 'sawtooth', 0.15); tone(140, 80, 0.6, 'square', 0.06); break;
      case 'type': tone(2000, 1500, 0.015, 'square', 0.025); break;
      case 'select': tone(700, 1100, 0.08, 'square', 0.07); break;
      case 'slowmo': tone(800, 80, 1.5, 'sine', 0.1); break;
    }
  }
  // sad piano for the credits: a slow minor arpeggio, scheduled a bar at a time
  const PIANO = [[0, 220], [0.5, 261.6], [1, 329.6], [1.5, 261.6], [2, 196], [2.5, 246.9], [3, 293.7], [3.5, 246.9],
                 [4, 174.6], [4.5, 220], [5, 261.6], [5.5, 220], [6, 164.8], [6.5, 207.7], [7, 246.9], [7.5, 329.6]];
  function pianoBar() { for (const [at, f] of PIANO) { tone(f, f * 0.995, 1.1, 'triangle', 0.09, at * 0.55); tone(f * 2, f * 1.99, 0.5, 'sine', 0.03, at * 0.55); } }

  // ================================================================
  //  ART — everything is drawn with canvas, nothing is loaded.
  // ================================================================
  // The hero (and most of the cast): a cartoon dick with a face, sitting on his balls. Lifted from Slide Rush, with costumes.
  function drawDick(x, y, s, o = {}) {
    const sq = o.squash || 0;
    const sy = (1 - sq * 0.3), sx = (1 + sq * 0.2);
    const skin = o.skin || SKIN, skin2 = o.skin2 || SKIN2, head = o.head || HEAD, head2 = o.head2 || HEAD2;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s * sx * (o.mirror ? -1 : 1), s * sy);
    if (o.rot) { ctx.translate(0, -32); ctx.rotate(o.rot); ctx.translate(0, 32); }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const wob = o.still ? 0 : Math.sin(t * 0.25 + (o.seed || 0)) * 0.03;

    // fur coat (behind everything): a big fluffy brown blob
    if (o.coat) {
      ctx.fillStyle = '#6b4a2a';
      for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; E(Math.cos(a) * 34, -34 + Math.sin(a) * 30, 9, 9); fs('#6b4a2a', INK, 2); }
      E(0, -34, 34, 30); fs('#7a5632', null);
    }
    // stubby arms (behind the body)
    const wave = o.flap ? Math.sin(t * 0.6) * 8 - 18 : (o.armsUp ? -26 : 6);
    ctx.strokeStyle = skin2; ctx.lineWidth = 6;
    ctx.beginPath();
    if (!o.onearm) { ctx.moveTo(-8, -40); ctx.lineTo(-24, -40 + wave); }
    ctx.moveTo(12, -40); ctx.lineTo(28, -40 + wave); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    const hands = o.onearm ? [[28, -40 + wave]] : [[-24, -40 + wave], [28, -40 + wave]];
    hands.forEach(([hx, hy]) => { E(hx, hy, 4.5, 4.5); fs(skin, INK, 1.8); });
    if (o.onearm) {   // the stump: a bandaged nub. he lost it in a very bad way.
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-8, -40); ctx.lineTo(-14, -39); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-8, -44); ctx.lineTo(-14, -35); ctx.moveTo(-11, -44); ctx.lineTo(-17, -36); ctx.stroke();
    }
    ctx.lineCap = 'round';
    if (o.pistol) {   // a little pistol in the right hand
      ctx.save(); ctx.translate(28, -40 + wave); ctx.rotate(-0.3);
      rr(-3, -4, 18, 7, 2); fs('#3a3a4a', INK, 1.5); rr(6, 2, 6, 9, 2); fs('#3a3a4a', INK, 1.5);
      ctx.restore();
    }

    // shaft (leans back a touch)
    const dfl = o.deflate || 0;
    ctx.save(); ctx.translate(2, -14); ctx.rotate(-0.12 + wob - dfl * 1.35 + (o.lean || 0)); ctx.scale(1 - dfl * 0.3, 1 - dfl * 0.5);
    rr(-13, -56, 26, 60, 11); fs(skin);
    if (o.wrinkly) { ctx.strokeStyle = skin2; ctx.lineWidth = 1.5; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-8, -50 + i * 12); ctx.quadraticCurveTo(0, -46 + i * 12, 8, -50 + i * 12); ctx.stroke(); } }
    if (o.coat) { E(0, -4, 22, 9); fs('#8a6a44', INK, 2); for (let i = -2; i <= 2; i++) { E(i * 9, -6, 5, 5); fs('#8a6a44', INK, 1.5); } }
    // head
    E(0, -55, 15.5, 13); fs(head);
    ctx.beginPath(); ctx.moveTo(-15, -52); ctx.quadraticCurveTo(0, -42, 15, -52); ctx.strokeStyle = head2; ctx.lineWidth = 2.5; ctx.stroke();
    E(5, -60, 3.2, 2); fs('#fff', null);
    if (o.bandana) { ctx.strokeStyle = '#c92a2a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-15, -48); ctx.quadraticCurveTo(0, -44, 15, -48); ctx.stroke(); }
    // hats
    if (o.hat === 'drill') { E(0, -64, 24, 5); fs('#6b7a3a'); E(0, -70, 12, 9); fs('#6b7a3a'); ctx.strokeStyle = '#4c5828'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, -74); ctx.lineTo(6, -74); ctx.stroke(); }
    if (o.hat === 'boonie') { E(0, -62, 25, 6); fs('#5d6b45'); rr(-13, -78, 26, 17, 7); fs('#5d6b45'); ctx.strokeStyle = '#3f4a2e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-13, -68); ctx.lineTo(13, -68); ctx.stroke(); }
    if (o.hat === 'helmet') { E(0, -63, 19, 12); fs(o.helmetC || '#5b6b3c'); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-17, -56); ctx.quadraticCurveTo(0, -46, 17, -56); ctx.stroke(); }
    if (o.hat === 'beanie') { E(0, -64, 17, 11); fs('#3a3a4a'); E(0, -75, 5, 5); fs('#3a3a4a'); }
    // face
    if (o.face !== false) {
      if (o.dead) {
        ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
        [[-6, -34], [6, -34]].forEach(([ex, ey]) => { ctx.beginPath(); ctx.moveTo(ex - 3, ey - 3); ctx.lineTo(ex + 3, ey + 3); ctx.moveTo(ex + 3, ey - 3); ctx.lineTo(ex - 3, ey + 3); ctx.stroke(); });
        E(0, -22, 4, 5); fs(INK, null);
      } else {
        const blink = !o.still && (t + (o.seed || 0) * 7) % 190 < 6;
        [[-5.5, -34], [6.5, -34]].forEach(([ex, ey], i) => {
          if (blink) { ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex - 4, ey); ctx.lineTo(ex + 4, ey); ctx.stroke(); }
          else {
            E(ex, ey, 4.6, 5); fs('#fff', INK, 1.6);
            const lx = o.look === undefined ? 1.6 : o.look;
            E(ex + lx, ey + 0.5, 2.3, 2.6); fs(INK, null); E(ex + lx + 0.8, ey - 1, 0.9, 0.9); fs('#fff', null);
            if (o.angry) { ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(ex - 5, ey - 8 + (i ? 2 : 0)); ctx.lineTo(ex + 5, ey - 6 - (i ? 2 : 0)); ctx.stroke(); }
          }
        });
        if (o.scar) { ctx.strokeStyle = '#c96a80'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(4, -42); ctx.lineTo(9, -28); ctx.moveTo(4, -38); ctx.lineTo(8, -37); ctx.moveTo(6, -32); ctx.lineTo(10, -33); ctx.stroke(); }
        E(-10, -26, 3.2, 2); fs('#ff9bb5', null); E(11, -26, 3.2, 2); fs('#ff9bb5', null);
        ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
        if (o.yell) { E(0.5, -21, 5, 6); fs('#7a2a4a', INK, 2); E(0.5, -18.5, 3, 2); fs('#ff9bb5', null); }
        else if (o.flap || o.open) { E(0.5, -22, 4, 4.5); fs('#7a2a4a', INK, 2); }
        else if (o.frown) { ctx.beginPath(); ctx.moveTo(-6, -20); ctx.quadraticCurveTo(0.5, -26, 7, -20); ctx.stroke(); }
        else { ctx.beginPath(); ctx.moveTo(-6, -24); ctx.quadraticCurveTo(0.5, -17, 7, -24); ctx.stroke(); }
        if (o.stache) {
          const k = o.stache; ctx.strokeStyle = o.stacheC || INK; ctx.lineWidth = 3.5 * Math.min(k, 1.6); ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(0, -28); ctx.quadraticCurveTo(-7 * k, -34, -12 * k, -26); ctx.moveTo(0, -28); ctx.quadraticCurveTo(7 * k, -34, 12 * k, -26); ctx.stroke();
          ctx.lineCap = 'round';
        }
        if (o.cigar) { ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(6, -22); ctx.lineTo(18, -19); ctx.stroke(); E(19, -19, 2, 2); fs('#ff7a3a', null); }
      }
    }
    ctx.restore();

    // balls (the seat)
    E(-9, -11, 14, 12); fs(skin);
    E(11, -11, 14, 12); fs(skin);
    ctx.strokeStyle = skin2; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-12, -8); ctx.quadraticCurveTo(-9, -12, -5, -8); ctx.moveTo(8, -8); ctx.quadraticCurveTo(11, -12, 15, -8); ctx.stroke();
    ctx.restore();
  }

  // ---- enemy painters. Each draws at (cx, by) = feet-center, facing the camera. `p` is the pose. ----
  function crabArt(cx, by, p) {
    const k = 2.2, cy = by - 26 * k * 0.6, run = p.dead ? 0 : t * 0.5;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
    if (p.dead) { ctx.scale(1, -0.6); ctx.translate(0, -8); }
    ctx.strokeStyle = '#d6362e'; ctx.lineWidth = 4;
    for (let i = 0; i < 3; i++) {
      const sw = Math.sin(run + i * 1.5 + (p.f || 0) * 2) * 5;
      ctx.beginPath(); ctx.moveTo(-18, i * 2); ctx.lineTo(-32 + sw, 15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(18, i * 2); ctx.lineTo(32 - sw, 15); ctx.stroke();
    }
    E(0, 0, 26, 15); fs('#f04e3e');
    E(0, 4, 18, 7); fs('#ff7b6b', null);
    const pinch = p.attack ? 0.8 : Math.abs(Math.sin(t * 0.15)) * 0.5;
    [[-1, -30], [1, 30]].forEach(([d, px]) => {
      ctx.save(); ctx.translate(px, -14 - (p.attack ? 8 : 0)); ctx.rotate(d * (0.3 - pinch) * (p.attack ? -1 : 1));
      E(0, 0, 9, 7); fs('#f04e3e'); poly([d * 6, -5, d * 16, -2, d * 6, 1]); fs('#f04e3e');
      ctx.restore();
    });
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    [[-8], [8]].forEach(([ex]) => {
      ctx.beginPath(); ctx.moveTo(ex, -10); ctx.lineTo(ex, -24); ctx.stroke();
      if (p.dead) { ctx.beginPath(); ctx.moveTo(ex - 3, -29); ctx.lineTo(ex + 3, -23); ctx.moveTo(ex + 3, -29); ctx.lineTo(ex - 3, -23); ctx.stroke(); }
      else { E(ex, -26, 4.5, 4.5); fs('#fff', INK, 1.5); E(ex - 1.5 + (p.attack ? 1.5 : 0), -26, 2, 2); fs(INK, null); }
    });
    if (p.attack) { E(0, -1, 5, 4); fs('#7a2a4a', INK, 2); }
    else { ctx.beginPath(); ctx.moveTo(-6, -2); ctx.quadraticCurveTo(0, 1, 6, -2); ctx.stroke(); }
    ctx.restore();
  }
  function beeArt(cx, by, p) {
    const k = 2.4, f = Math.sin(t * 0.7 + (p.f || 0) * 3);
    ctx.save(); ctx.translate(cx, by - 30 * k * 0.6); ctx.scale(k, k);
    if (p.dead) { ctx.rotate(Math.PI); ctx.translate(0, -12); }
    E(5, -12 - f * 3, 10, 5, 0.3); fs('rgba(255,255,255,0.85)', INK, 1.5);
    E(-7, -12 + f * 3, 10, 5, -0.3); fs('rgba(255,255,255,0.85)', INK, 1.5);
    E(0, 0, 20, 12); fs(YEL);
    ctx.save(); E(0, 0, 20, 12); ctx.clip(); ctx.fillStyle = INK;
    ctx.fillRect(-9, -13, 7, 26); ctx.fillRect(4, -13, 7, 26); ctx.restore();
    E(0, 0, 20, 12); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();

    carve(g, 8, 2, 20, 2, '>');                                                // the walkway, going the wrong way
    carve(g, 1, 1, 2, 3);                                                      // Room 69
    put(g, 30, 1, 'e'); put(g, 12, 21, 'e'); put(g, 2, 13, 'e');
    put(g, 0, 17, 'P'); put(g, 33, 2, 'P');
    let wave = 0, serving = 4;
    const SPAWNS = [[2, 13], [13, 13], [7, 21.5], [13, 21.5]];
    const waves = [[['condom', 0], ['condom', 1], ['bee', 2]], [['condom', 0], ['condom', 3], ['bee', 1], ['bee', 2]], [['condom', 1], ['condom', 2], ['condom', 3], ['bee', 0], ['bee', 3]]];
    const nextWave = () => { const w = waves[wave]; if (!w) return; spawnWave(w.map(([ty, s]) => [ty, SPAWNS[s][0], SPAWNS[s][1]])); for (const e of ents) if (e.kind === 'enemy') { e.ai = 'chase'; e.sightMul = 3; } wave++; serving++; announce(`NOW SERVING: ${serving}`, 'your number is 69. nobody is rushing.', 40); };
    return {
      map: g, tex: { '#': 'tile', A: 'velvet', G: 'gate', P: 'poster' }, pal: PAL.clinic, start: [7.5, 20.5, -Math.PI / 2], par: 190, goal: { x: 19.5, y: 19.5 },
      brief: ['> FERTILITY CLINIC, WAITING ROOM B. 10:30. APPOINTMENT WAS AT 9.', 'Deep cover. You are here to make a deposit. Nobody is rushing. Nobody has ever rushed here.',
        'Take a number at reception. Wait your turn. Condom Troopers guard the waiting room; they will try to wrap you.', 'When they call 69, ride the escalator up to Room 69. The walkway may be going the wrong way. That is on purpose.',
        '> OBJECTIVE: make the deposit. Remember: no Rushin\'.'],
      init() {
        spawnPickup('ticket', 19.5, 19.5);
        spawnNpc('prick', 21.5, 16.5, 1.15, 0.9, { far: 30 });
        say('PRICK', 'I\'m at reception, son. Undercover. The mustache is a disguise.', 240);
      },
      triggers: [
        { x: 24.5, y: 18, r: 1.6, fn: () => say('PRICK', 'Escalator\'s going up. Let it carry you. No rushin\'.', 220) },
        { x: 20, y: 2, r: 1.5, fn: () => { say('PRICK', 'That walkway is going the wrong way.', 160); say('PRICK', '...Walk anyway.', 140); announce('WRONG WAY', 'nobody is rushing', 40); } },
        { x: 5, y: 2, r: 1.5, fn: () => say('PRICK', 'Room 69. Go on in. Take your time. That\'s a joke. Please hurry.', 220) },
      ],
      stages: [
        { obj: 'Take a number at reception', done: () => M.flags.ticket, end() { M.goal = null; say('PRICK', 'Sixty-nine. Nice. Now sit tight — they\'re calling four.', 220); } },
        { obj: 'Wait your turn (nobody is rushing)', at: [7.5, 20.5, -Math.PI / 2], pre() { for (const e of ents) if (e.kind === 'pickup' && e.type === 'ticket') e.got = true; M.goal = null; }, start() { M.flags.waveT = t; nextWave(); },
          tick() { if (noEnemies() && wave < waves.length && t - M.flags.waveT > 90) { M.flags.waveT = t; nextWave(); } },
          done: () => wave >= waves.length && noEnemies(), end() { serving = 69; announce('NOW SERVING: 69', 'that\'s you. finally.', 46); openGate(3, 2); say('PRICK', 'Sixty-nine! That\'s you. Escalator\'s past reception. Room 69 is upstairs at the far end.', 300); M.goal = { x: 1.5, y: 2 }; } },
        { obj: 'Ride the escalator up to Room 69', at: [20, 19.5, 0], pre() { for (const e of ents) if (e.kind === 'pickup' && e.type === 'ticket') e.got = true; openGate(3, 2); M.goal = { x: 1.5, y: 2 }; }, start() { spawnWave([['bee', 12, 2], ['bee', 28, 2], ['condom', 6, 2]]); for (const e of ents) if (e.kind === 'enemy') { e.ai = 'chase'; e.sightMul = 3; } },
          done: () => near(1.5, 2, 1.3), end() { announce('DEPOSIT MADE', 'the doctor will see you now', 44); say('PRICK', 'Sample delivered. You beautiful, patient man.', 240); M.flags.outT = t; } },
        { obj: 'Deposit', checkpoint: false, done: () => t - M.flags.outT > 130 },
      ],
    };
  };

  // ---------- 5. GAME OVA ----------
  const M5 = () => {
    const g = grid(82, 11);
    carve(g, 1, 3, 78, 7);          // the bridge deck
    carve(g, 58, 1, 80, 9);         // where it all ends
    for (let x = 6; x < 56; x += 10) { put(g, x, 2, 'A'); put(g, x, 8, 'A'); }
    let allies = [], boss = null, prick = null, pistol = null, f0 = 0;
    const F = () => t - f0;
    return {
      map: g, tex: { '#': 'concrete', A: 'steel', B: 'rust' }, pal: PAL.bridge, start: [3, 5, Math.PI], par: 200, railSpeed: 0.028,
      brief: ['> BRIDGE OVER THE TUBES. 11:11. THE END.', 'Jackoff has the launch codes. He is going to launch something. Nobody asked what.',
        'You are in the back of the truck with Soup, Gas and Gropes. Everything behind you wants to pinch you.', 'Hold them off until the bridge. Then it goes how it always goes. You know how it goes.',
        '> OBJECTIVE: survive the bridge. Don\'t. Look. Back. (Do look back. That\'s where they are.)'],
      init() { say('PRICK', 'Back of the truck, son. They\'re coming up behind us. Fire at will. Will\'s the crab.', 260); },
      stages: [
        { obj: 'Hold them off until the bridge', start() { M.state = 'rails'; player.a = Math.PI; M.flags.spawnT = 0; },
          tick() {
            if (t - M.flags.spawnT > (diff === 'regular' ? 70 : 95) && player.x < 50) { M.flags.spawnT = t; const ty = Math.random() < 0.55 ? 'bee' : 'crab'; spawnEnemy(ty, player.x - 9, rand(3.5, 6.5), { ai: 'chase', speedMul: ty === 'crab' ? 2.2 : 1.6, sightMul: 5 }); }
            for (const e of ents) if (e.kind === 'enemy' && e.x < player.x - 14) e.gone = true;
            if (player.x > 25 && !M.flags.mid) { M.flags.mid = true; say('SOUP', 'Bridge! We\'re almost across!', 180); say('PRICK', 'Don\'t say that. Never say that.', 180); }
          },
          done: () => player.x >= 56, end() { M.timer = null; } },
        { obj: '', at: [58, 5, 0],
          start() {
            M.state = 'crawl'; f0 = t; player.canFire = false; player.invul = true; player.a = 0; camH = 0.5; ts = 1;
            for (const e of ents) if (e.kind === 'enemy') e.gone = true; ents = ents.filter(e => !e.gone);
            M.pal = PAL.finale; M.tex = { '#': 'rust', A: 'steel', B: 'rust' };
            allies = [spawnNpc('gas', 59.6, 3.7, 1.3, 1.0), spawnNpc('gropes', 60.8, 6.6, 1.3, 1.0), spawnNpc('soup', 59.2, 7.3, 1.3, 1.0)];
            boss = spawnNpc('boss', 74, 5, 3.0, 2.3, { r: 1.0, hp: 1, far: 60 });
            prick = spawnNpc('prick', 57, 8.2, 1.15, 0.9, { far: 60 });
            shake = 30; flash = 1.4; sfx('boom');
          },
          tick() {
            const f = F();
            if (f < 40) { shake = Math.max(shake, 14); }
            camH = lerp(camH, 0.16, 0.03); ts = lerp(ts, 0.42, 0.03); pitch = lerp(pitch, 24, 0.02);
            if (f === 30) { say('PRICK', 'The bridge... Soup! Gas! Gropes! Sound off!', 220); sfx('slowmo'); }
            if (f === 60) setObjective('Crawl. That\'s all you can do.');
            if (f > 60 && f % 14 === 0 && f < 500) sfx('chop');
            if (f === 150) { allies[0].dead = true; say('SOUP', 'Gas is down!', 160); sfx('shoot'); }
            if (f === 300) { allies[1].dead = true; say('SOUP', 'Gropes! No... no.', 160); sfx('shoot'); }
            if (f === 420) { allies[2].dead = true; say('PRICK', '...Soup.', 200); sfx('shoot'); }
            if (f > 90 && boss.x > 61.6) { boss.x -= 0.022; boss.y = lerp(boss.y, 5, 0.01); if (f % 40 === 0) sfx('boss'); }
            if (f === 480) { say('JACKOFF', 'Hello, little fella. I\'d shake your hand, but... you know.', 260); boss.attackT = 999; }
            if (f === 640) { say('JACKOFF', 'You took my arm. I\'m going to take everything.', 220); }
            if (f === 760) { say('PRICK', 'Son... catch.', 160); sfx('slide'); prick.attackT = 999; pistol = spawnPickup('pistol', 57.4, 7.8); pistol.tick = e => { const a = angleTo(e, player); e.x += Math.cos(a) * 0.05; e.y += Math.sin(a) * 0.05; }; pistol.h = 0.35; pistol.w = 0.5; }
          },
          done: () => M.flags.pistol },
        { obj: 'SHOOT HIM.', checkpoint: false,
          start() { M.state = 'showdown'; f0 = t; player.a = angleTo(player, boss); player.canFire = true; player.ammo = 1; player.reloading = false; boss.shootable = true; boss.attackT = 0; boss.onDeath = e => { M.flags.bossDead = true; M.flags.deadT = t; sfx('boss'); shake = 20; ts = 0.2; say('JACKOFF', '...oh.', 120); }; announce(isTouch ? 'TAP TO SHOOT' : 'CLICK TO SHOOT', 'one glob. make it count.', 48); ts = 0.3; sfx('slowmo'); },
          tick() { ts = lerp(ts, M.flags.bossDead ? 0.2 : 0.35, 0.05); if (M.flags.bossDead) { const k = t - M.flags.deadT; if (k > 60) whiteOut = Math.min(1, (k - 60) / 90); } },
          done: () => M.flags.bossDead && t - M.flags.deadT > 170 },
        { obj: '', checkpoint: false,
          start() { M.state = 'cut'; f0 = t; ts = 1; player.canFire = false; player.canMove = false; for (const e of ents) if (e.kind === 'npc' && e !== prick) e.gone = true; ents = ents.filter(e => !e.gone); camH = 0.5; pitch = -30; player.x = 62; player.y = 5; player.a = -Math.PI / 2 + 0.3; whiteOut = 1; spawnDeco('heli', 64, 2.5, 1.4, 1.6, { z: 1.2, far: 40 }); M.pal = PAL.bridge; },
          tick() { const f = F(); whiteOut = Math.max(0, 1 - f / 60); if (f % 10 === 0 && f < 400) sfx('chop'); if (f === 70) say('PRICK', 'We got you, son. We got you.', 200); if (f === 200) say('PRICK', 'It\'s over. She said... she said you did great.', 240); if (f > 330) whiteOut = Math.min(1, (f - 330) / 60); },
          done: () => F() > 400 },
      ],
    };
  };
  const MISSIONS = [M1, M2, M3, M4, M5];

  // ================================================================
  //  MAIN LOOP
  // ================================================================
  function update() {
    t++;
    if (state === 'game') updateGame();
    else { stateT++; if (state === 'dead' || state === 'clear') { for (const j of jam) j.life--; jam = jam.filter(j => j.life > 0); shake *= 0.9; radioTick(); for (const a of announceQ) a.life--; announceQ = announceQ.filter(a => a.life > 0); } }
  }
  function draw() {
    ctx = mainCtx;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (M && (state === 'game' || state === 'dead' || state === 'clear' || state === 'pause')) {
      ctx.save();
      if (shake > 0.3) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
      collectDrawables();
      render3D();
      if (M.state !== 'crawl' && M.state !== 'cut' && state !== 'dead') drawWeapon();
      ctx.restore();
      if (state === 'game') drawHUD();
      if (whiteOut > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, whiteOut)})`; ctx.fillRect(0, 0, W, H); }
      if (M.state === 'showdown' && state === 'game' && !M.flags.bossDead) { txt(isTouch ? 'TAP TO SHOOT' : 'CLICK TO SHOOT', W / 2, H - 60, 30 + Math.sin(t * 0.2) * 3, YEL); }
      if (state === 'dead') drawDead();
      if (state === 'clear') drawClear();
      if (state === 'pause') drawPause();
    }
    else if (state === 'title') drawTitle();
    else if (state === 'select') drawSelect();
    else if (state === 'brief') drawBrief();
    else if (state === 'credits') drawCredits();
    // portrait phones: the canvas is rotated, so tell them to turn the phone for the full-fat version
    if (portrait && state !== 'game') txt('(turn your phone sideways for the full experience)', W / 2, H - 4, 11, '#fff', 'center', null);
  }
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  function boot() { bakeTextures(); bakeAll(); requestAnimationFrame(loop); }
  if (document.fonts && document.fonts.load) document.fonts.load(`20px ${FONT}`).then(boot, boot); else boot();
  //__DBG__
})();
</script>
